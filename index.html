          elem.y1 = ep1.y;
          elem.x2 = ep2.x;
          elem.y2 = ep2.y;
          renderCanvas();
        } else if (drag.type === "tangentcurve-slide") {
          const elem = state.elements.find((x) => x.id === drag.id);
          const line = elem && state.elements.find((x) => x.id === elem.lineId);
          const geo = line && getLineGeometry(line);
          if (!elem || !geo) return;
          const { a: a, b: b } = geo;
          const p1 = econToSVG(a.x, a.y),
            p2 = econToSVG(b.x, b.y);
          const segLen2 = (p2.x - p1.x) * (p2.x - p1.x) + (p2.y - p1.y) * (p2.y - p1.y);
          let t =
            segLen2 > 0
              ? ((sp.x - p1.x) * (p2.x - p1.x) + (sp.y - p1.y) * (p2.y - p1.y)) / segLen2
              : 0;
          elem.t = Math.max(0, Math.min(1, t));
          renderCanvas();
        } else if (drag.type === "curve-slide") {
          const elem = state.elements.find((x) => x.id === drag.id);
          const host = elem && state.elements.find((x) => x.id === elem.slideLineId);
          const geo = host && getLineGeometry(host);
          if (!elem || !geo) return;
          const { a: a, b: b } = geo;
          const me = svgToEcon(sp.x, sp.y);
          const dx = b.x - a.x,
            dy = b.y - a.y;
          const len2 = dx * dx + dy * dy;
          let u = len2 > 0 ? ((me.x - a.x) * dx + (me.y - a.y) * dy) / len2 : 0;
          u = Math.max(0, Math.min(1, u));
          const target = {
            x: a.x + dx * u,
            y: a.y + dy * u,
          };
          const t = elem.tanT !== undefined ? elem.tanT : 0.5;
          const cur = qBezEcon(elem, t);
          const shiftX = target.x - cur.x,
            shiftY = target.y - cur.y;
          elem.x1 += shiftX;
          elem.y1 += shiftY;
          elem.x2 += shiftX;
          elem.y2 += shiftY;
          if (elem.cpx !== undefined) {
            elem.cpx += shiftX;
            elem.cpy += shiftY;
          }
          renderCanvas();
        } else if (drag.type === "tangent-t") {
          const elem = state.elements.find((x) => x.id === drag.id);
          const curve = elem && state.elements.find((c) => c.id === elem.curveId);
          if (!elem || !curve) return;
          const p1s = econToSVG(curve.x1, curve.y1),
            p2s = econToSVG(curve.x2, curve.y2);
          const cp = curveCP(curve);
          let bestT = elem.t,
            bestD = Infinity;
          for (let t = 0; t <= 1; t += 0.01) {
            const pt = qBez(p1s, cp, p2s, t);
            const d = Math.hypot(pt.x - sp.x, pt.y - sp.y);
            if (d < bestD) {
              bestD = d;
              bestT = t;
            }
          }
          elem.t = Math.max(0.02, Math.min(0.98, bestT));
          renderCanvas();
        } else if (drag.type === "tangent-ext") {
          const elem = state.elements.find((x) => x.id === drag.id);
          const curve = elem && state.elements.find((c) => c.id === elem.curveId);
          if (!elem || !curve) return;
          const p1s = econToSVG(curve.x1, curve.y1),
            p2s = econToSVG(curve.x2, curve.y2);
          const cp = curveCP(curve);
          const pos = qBez(p1s, cp, p2s, elem.t);
          const tanv = qBezTan(p1s, cp, p2s, elem.t);
          const ln = Math.hypot(tanv.x, tanv.y) || 1;
          const nx = tanv.x / ln,
            ny = tanv.y / ln;
          const proj = (sp.x - pos.x) * nx + (sp.y - pos.y) * ny;
          if (drag.h === "eB") {
            elem.extPos = Math.max(10, proj);
          } else {
            elem.extNeg = Math.max(10, -proj);
          }
          renderCanvas();
        } else if (drag.type === "label") {
          const elem = state.elements.find((x) => x.id === drag.id);
          if (!elem) return;
          elem.lox = drag.origLox + (sp.x - drag.startSP.x);
          elem.loy = drag.origLoy + (sp.y - drag.startSP.y);
          renderCanvas();
        }
      });

      let justMarqueed = false;

      function finalizeMarquee() {
        if (!marquee) return;
        const dx = Math.abs(marquee.curSP.x - marquee.startSP.x);
        const dy = Math.abs(marquee.curSP.y - marquee.startSP.y);
        if (dx > 4 || dy > 4) {
          const rect = {
            x1: Math.min(marquee.startSP.x, marquee.curSP.x),
            y1: Math.min(marquee.startSP.y, marquee.curSP.y),
            x2: Math.max(marquee.startSP.x, marquee.curSP.x),
            y2: Math.max(marquee.startSP.y, marquee.curSP.y),
          };
          const hits = elementsInRect(rect);
          selectMultiple(marquee.additive ? [...new Set([...state.selectedIds, ...hits])] : hits);
          justMarqueed = true;
          setTimeout(() => {
            justMarqueed = false;
          }, 0);
        }
        marquee = null;
        render();
      }

      svg.addEventListener("mouseup", () => {
        drag = null;
        finalizeMarquee();
      });

      document.addEventListener("mouseup", () => {
        drag = null;
        finalizeMarquee();
      });

      function ptSegDist(px, py, ax, ay, bx, by) {
        const dx = bx - ax,
          dy = by - ay,
          l2 = dx * dx + dy * dy;
        if (!l2) return Math.hypot(px - ax, py - ay);
        const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
        return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
      }

      function rectContainsPt(rect, p) {
        return p.x >= rect.x1 && p.x <= rect.x2 && p.y >= rect.y1 && p.y <= rect.y2;
      }

      function segSegIntersect(p1, p2, p3, p4) {
        function ccw(a, b, c) {
          return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x);
        }
        return ccw(p1, p3, p4) !== ccw(p2, p3, p4) && ccw(p1, p2, p3) !== ccw(p1, p2, p4);
      }

      function segIntersectsRect(p1, p2, rect) {
        if (rectContainsPt(rect, p1) || rectContainsPt(rect, p2)) return true;
        const c = [
          {
            x: rect.x1,
            y: rect.y1,
          },
          {
            x: rect.x2,
            y: rect.y1,
          },
          {
            x: rect.x2,
            y: rect.y2,
          },
          {
            x: rect.x1,
            y: rect.y2,
          },
        ];
        for (let i = 0; i < 4; i++) {
          if (segSegIntersect(p1, p2, c[i], c[(i + 1) % 4])) return true;
        }
        return false;
      }

      function elementsInRect(rect) {
        const ids = [];
        const o = econToSVG(0, 0),
          xEnd = econToSVG(state.xScale, 0),
          yEnd = econToSVG(0, state.yScale);
        if (segIntersectsRect(o, xEnd, rect)) ids.push("xaxis");
        if (segIntersectsRect(o, yEnd, rect)) ids.push("yaxis");
        for (const elem of state.elements) {
          let hit = false;
          if (elem.type === "point" || elem.type === "text") {
            hit = rectContainsPt(rect, econToSVG(elem.ex, elem.ey));
          } else if (elem.type === "line") {
            const a = state.elements.find((x) => x.id === elem.p1Id);
            const b = state.elements.find((x) => x.id === elem.p2Id);
            if (a && b) {
              hit = segIntersectsRect(econToSVG(a.ex, a.ey), econToSVG(b.ex, b.ey), rect);
            }
          } else if (elem.type === "curve") {
            const p1 = econToSVG(elem.x1, elem.y1),
              p2 = econToSVG(elem.x2, elem.y2),
              cp = curveCP(elem);
            let prev = p1;
            for (let t = 0.05; t <= 1.0001; t += 0.05) {
              const cur = qBez(p1, cp, p2, Math.min(t, 1));
              if (segIntersectsRect(prev, cur, rect)) {
                hit = true;
                break;
              }
              prev = cur;
            }
          } else if (elem.type === "tangent") {
            const curve = state.elements.find((x) => x.id === elem.curveId);
            if (curve) {
              const p1s = econToSVG(curve.x1, curve.y1),
                p2s = econToSVG(curve.x2, curve.y2),
                cp = curveCP(curve);
              const pos = qBez(p1s, cp, p2s, elem.t);
              const tanv = qBezTan(p1s, cp, p2s, elem.t);
              const ln = Math.hypot(tanv.x, tanv.y) || 1;
              const nx = tanv.x / ln,
                ny = tanv.y / ln;
              const extNeg = elem.extNeg !== undefined ? elem.extNeg : 150;
              const extPos = elem.extPos !== undefined ? elem.extPos : 150;
              const endA = {
                x: pos.x - nx * extNeg,
                y: pos.y - ny * extNeg,
              };
              const endB = {
                x: pos.x + nx * extPos,
                y: pos.y + ny * extPos,
              };
              hit = segIntersectsRect(endA, endB, rect);
            }
          }
          if (hit) ids.push(elem.id);
        }
        return ids;
      }

      function nearestElement(sx, sy, threshCSS = 13) {
        const r = svg.getBoundingClientRect();
        const scale = r.width ? r.width / SVG_W : 1;
        const thresh = threshCSS / scale;
        let bestId = null,
          bestD = thresh;
        const o = econToSVG(0, 0),
          xEnd = econToSVG(state.xScale, 0),
          yEnd = econToSVG(0, state.yScale);
        const dX = ptSegDist(sx, sy, o.x, o.y, xEnd.x, xEnd.y);
        if (dX < bestD) {
          bestD = dX;
          bestId = "xaxis";
        }
        const dY = ptSegDist(sx, sy, o.x, o.y, yEnd.x, yEnd.y);
        if (dY < bestD) {
          bestD = dY;
          bestId = "yaxis";
        }
        for (const elem of state.elements) {
          let d = Infinity;
          if (elem.type === "point" || elem.type === "text") {
            const p = econToSVG(elem.ex, elem.ey);
            d = Math.hypot(p.x - sx, p.y - sy);
          } else if (elem.type === "line") {
            const a = state.elements.find((x) => x.id === elem.p1Id);
            const b = state.elements.find((x) => x.id === elem.p2Id);
            if (!a || !b) continue;
            const p1 = econToSVG(a.ex, a.ey),
              p2 = econToSVG(b.ex, b.ey);
            d = ptSegDist(sx, sy, p1.x, p1.y, p2.x, p2.y);
          } else if (elem.type === "curve") {
            const p1 = econToSVG(elem.x1, elem.y1),
              p2 = econToSVG(elem.x2, elem.y2);
            const cp = curveCP(elem);
            for (let t = 0; t <= 1; t += 0.02) {
              const pt = qBez(p1, cp, p2, t);
              d = Math.min(d, Math.hypot(pt.x - sx, pt.y - sy));
            }
          } else if (elem.type === "tangent") {
            const c = state.elements.find((x) => x.id === elem.curveId);
            if (!c) continue;
            const p1 = econToSVG(c.x1, c.y1),
              p2 = econToSVG(c.x2, c.y2),
              cp = curveCP(c);
            const pos = qBez(p1, cp, p2, elem.t),
              tan = qBezTan(p1, cp, p2, elem.t);
            const ln = Math.hypot(tan.x, tan.y) || 1;
            const nx = tan.x / ln,
              ny = tan.y / ln,
              ext = 160;
            d = ptSegDist(
              sx,
              sy,
              pos.x - nx * ext,
              pos.y - ny * ext,
              pos.x + nx * ext,
              pos.y + ny * ext,
            );
          }
          if (d < bestD) {
            bestD = d;
            bestId = elem.id;
          }
        }
        const onStroke = bestId !== null && bestD <= 6 / scale;
        if (!onStroke) {
          for (let i = state.elements.length - 1; i >= 0; i--) {
            const elem = state.elements[i];
            if (elem.type !== "shade") continue;
            const poly = computeShadePolygonEcon(elem);
            if (
              poly &&
              ptInPolygon(
                sx,
                sy,
                poly.map((p) => econToSVG(p.x, p.y)),
              )
            )
              return elem.id;
          }
        }
        return bestId;
      }

      function ptInPolygon(x, y, pts) {
        let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const xi = pts[i].x,
            yi = pts[i].y,
            xj = pts[j].x,
            yj = pts[j].y;
          if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
        }
        return inside;
      }

      svg.addEventListener("click", (e) => {
        if (drag) return;
        if (justMarqueed) {
          justMarqueed = false;
          return;
        }
        const sp = getSVGPt(e);
        if (state.mode === "select") {
          const near = nearestElement(sp.x, sp.y);
          if (near) {
            selectEl(near);
          } else {
            clearSelection();
            render();
          }
          return;
        }
        if (!isInGrid(sp.x, sp.y)) return;
        const placeSVG = resolveSnap(sp.x, sp.y, e, null);
        let ep = svgToEcon(placeSVG.x, placeSVG.y);
        ep = clampEcon(ep.x, ep.y);
        if (state.mode === "point") {
          // Only an existing point blocks placement; lines and curves are valid snap targets.
          const r = svg.getBoundingClientRect();
          const thresh = 9 / (r.width ? r.width / SVG_W : 1);
          const onPoint = state.elements.some((p) => {
            if (p.type !== "point") return false;
            const ps = econToSVG(p.ex, p.ey);
            return Math.hypot(ps.x - sp.x, ps.y - sp.y) < thresh;
          });
          if (!onPoint) addPoint(ep.x, ep.y);
        } else if (state.mode === "text") {
          addText(ep.x, ep.y);
          setMode("select");
        } else if (state.mode === "line") {
          const axisLocked = (e.ctrlKey || e.metaKey) && !e.shiftKey && state.lineFirstId;
          const near = axisLocked ? null : nearestElement(sp.x, sp.y, 9);
          const nearEl = near && state.elements.find((x) => x.id === near);
          if (nearEl && nearEl.type === "point") {
            if (!state.lineFirstId) {
              state.lineFirstId = nearEl.id;
              selectEl(nearEl.id);
            } else if (state.lineFirstId !== nearEl.id) {
              addLine(state.lineFirstId, nearEl.id);
              state.lineFirstId = null;
              setMode("select");
            }
          } else {
            const nid = addPoint(ep.x, ep.y);
            if (!state.lineFirstId) {
              state.lineFirstId = nid;
            } else {
              addLine(state.lineFirstId, nid);
              state.lineFirstId = null;
              setMode("select");
            }
          }
        }
      });

      document.getElementById("canvas-area").addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        if (drag || marquee) return;
        if (state.mode !== "select") return;
        if (e.target.closest("#toolbar")) return;
        if (e.target.closest("svg#main-svg")) return;
        clearSelection();
        render();
      });

      function getSVGPt(e) {
        const r = svg.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) * (SVG_W / r.width),
          y: (e.clientY - r.top) * (SVG_H / r.height),
        };
      }

      function setMode(m) {
        state.mode = m;
        if (m !== "line") state.lineFirstId = null;
        if (m === "point" || m === "line" || m === "text") clearSelection();
        svg.className.baseVal = m === "select" ? `` : `mode-${m}`;
        syncToolbarButtons();
        render();
      }

      function syncToolbarButtons() {
        ["select", "point", "line", "curve", "text"].forEach((m) => {
          const b = document.getElementById("btn-" + m);
          if (b) b.classList.toggle("active", state.mode === m);
        });
      }

      function addPoint(ex, ey) {
        pushUndo();
        const id = uid();
        state.elements.push({
          id: id,
          type: "point",
          ex: ex,
          ey: ey,
          color: "#222",
          size: 5,
          label: "",
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
        return id;
      }

      function addText(ex, ey) {
        pushUndo();
        const id = uid();
        state.elements.push({
          id: id,
          type: "text",
          ex: ex,
          ey: ey,
          text: "Text",
          color: "#222",
          fontSize: 14,
          labelRotation: 0,
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
        return id;
      }

      function addLine(p1Id, p2Id) {
        pushUndo();
        const id = uid();
        state.elements.push({
          id: id,
          type: "line",
          p1Id: p1Id,
          p2Id: p2Id,
          color: nextColor(),
          thickness: 2,
          dotted: false,
          label: "",
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
        return id;
      }

      function addCurve(shape, anchor) {
        pushUndo();
        const id = uid();
        const isIncreasing = shape === "increasing-convex" || shape === "increasing-concave";
        if (shape === "parabola" || shape === "parabola-down") {
          const up = shape === "parabola";
          const anchored = anchor && anchor.type === "point";
          const ax = anchored ? anchor.ex : state.xScale * 0.5;
          const ay = anchored ? anchor.ey : up ? state.yScale * 0.3 : state.yScale * 0.7;
          const k = 2 * 0.72 * (state.yScale / state.xScale);
          const room = up ? state.yScale - ay : ay;
          const hs = Math.max(
            state.xScale * 0.08,
            Math.min(state.xScale * 0.35, ax, state.xScale - ax, room / k),
          );
          const my = up ? ay + k * hs : ay - k * hs;
          state.elements.push({
            id: id,
            type: "curve",
            shape: shape,
            x1: ax - hs,
            y1: my,
            x2: ax + hs,
            y2: my,
            curvature: 0.72,
            color: nextColor(),
            thickness: 2,
            dotted: false,
            label: "",
          });
          state.selectedId = id;
          state.selectedIds = new Set([id]);
          render();
          return id;
        }
        let x1 = 0,
          y1 = state.yScale * 0.7,
          x2 = state.xScale * 0.7,
          y2 = 0;
        if (isIncreasing) {
          x1 = 0.5;
          y1 = 0.5;
          x2 = state.xScale * 0.85;
          y2 = state.yScale * 0.85;
        }
        if (anchor && anchor.type === "point") {
          const ax = anchor.ex,
            ay = anchor.ey;
          if (shape === "convex") {
            x1 = 0;
            y1 = Math.min(state.yScale * 0.9, ay + ax * 0.5);
            x2 = Math.min(state.xScale * 0.9, ax + ay * 0.5);
            y2 = 0;
          } else if (isIncreasing) {
            x1 = Math.max(0.3, ax * 0.3);
            y1 = Math.max(0.3, ay * 0.3);
            x2 = Math.min(state.xScale * 0.95, ax + (state.xScale - ax) * 0.5);
            y2 = Math.min(state.yScale * 0.95, ay + (state.yScale - ay) * 0.5);
          } else {
            x1 = 0;
            y1 = Math.max(state.yScale * 0.1, ay - ax * 0.2);
            x2 = Math.min(state.xScale * 0.9, ax + ay * 0.2);
            y2 = state.yScale;
          }
        }
        state.elements.push({
          id: id,
          type: "curve",
          shape: shape,
          x1: Math.max(0, x1),
          y1: Math.max(0, y1),
          x2: Math.min(state.xScale, x2),
          y2: Math.min(state.yScale, y2),
          curvature: 0.72,
          color: nextColor(),
          thickness: 2,
          dotted: false,
          label: "",
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
        return id;
      }

      function addTangent(curveId, t) {
        pushUndo();
        const id = uid();
        state.elements.push({
          id: id,
          type: "tangent",
          curveId: curveId,
          t: t !== undefined ? t : 0.5,
          color: nextColor(),
          thickness: 2,
          dotted: false,
          label: "",
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
      }

      function findLineThroughPoint(pointId, tolEcon) {
        const pt = state.elements.find((e) => e.id === pointId);
        if (!pt) return null;
        const exact = state.elements.find(
          (elem) => elem.type === "line" && (elem.p1Id === pointId || elem.p2Id === pointId),
        );
        if (exact) return exact;
        const tol = tolEcon !== undefined ? tolEcon : Math.max(state.xScale, state.yScale) * 0.02;
        let best = null,
          bestD = tol;
        for (const elem of state.elements) {
          if (elem.type !== "line" && elem.type !== "tangent") continue;
          const geo = getLineGeometry(elem);
          if (!geo) continue;
          const d = ptSegDist(pt.ex, pt.ey, geo.a.x, geo.a.y, geo.b.x, geo.b.y);
          if (d < bestD) {
            bestD = d;
            best = elem;
          }
        }
        return best;
      }

      function findCurveThroughPoint(pointId, tolEcon) {
        const pt = state.elements.find((e) => e.id === pointId);
        if (!pt) return null;
        const tol = tolEcon !== undefined ? tolEcon : Math.max(state.xScale, state.yScale) * 0.02;
        let best = null,
          bestOverallD = tol;
        for (const elem of state.elements) {
          if (elem.type !== "curve") continue;
          const P0 = {
              x: elem.x1,
              y: elem.y1,
            },
            P2 = {
              x: elem.x2,
              y: elem.y2,
            },
            Pc = econCurveCP(elem);
          let bestD = Infinity,
            bestT = 0.5;
          const N = 60;
          for (let i = 0; i <= N; i++) {
            const t = i / N,
              mt = 1 - t;
            const x = mt * mt * P0.x + 2 * mt * t * Pc.x + t * t * P2.x;
            const y = mt * mt * P0.y + 2 * mt * t * Pc.y + t * t * P2.y;
            const d = Math.hypot(x - pt.ex, y - pt.ey);
            if (d < bestD) {
              bestD = d;
              bestT = t;
            }
          }
          if (bestD < bestOverallD) {
            bestOverallD = bestD;
            best = {
              curve: elem,
              t: Math.max(0.02, Math.min(0.98, bestT)),
            };
          }
        }
        return best;
      }

      function getLineGeometry(hostElem) {
        if (hostElem.type === "line") {
          const a = state.elements.find((x) => x.id === hostElem.p1Id);
          const b = state.elements.find((x) => x.id === hostElem.p2Id);
          if (!a || !b) return null;
          return {
            a: {
              x: a.ex,
              y: a.ey,
            },
            b: {
              x: b.ex,
              y: b.ey,
            },
          };
        }
        if (hostElem.type === "tangent") {
          const curve = state.elements.find((x) => x.id === hostElem.curveId);
          if (!curve) return null;
          const p1s = econToSVG(curve.x1, curve.y1),
            p2s = econToSVG(curve.x2, curve.y2),
            cp = curveCP(curve);
          const pos = qBez(p1s, cp, p2s, hostElem.t);
          const tanv = qBezTan(p1s, cp, p2s, hostElem.t);
          const ln = Math.hypot(tanv.x, tanv.y) || 1;
          const nx = tanv.x / ln,
            ny = tanv.y / ln;
          const extNeg = hostElem.extNeg !== undefined ? hostElem.extNeg : 150;
          const extPos = hostElem.extPos !== undefined ? hostElem.extPos : 150;
          const a = svgToEcon(pos.x - nx * extNeg, pos.y - ny * extNeg);
          const b = svgToEcon(pos.x + nx * extPos, pos.y + ny * extPos);
          return {
            a: a,
            b: b,
          };
        }
        return null;
      }

      function tangentContactPoint(tangentElem) {
        const curve = state.elements.find((x) => x.id === tangentElem.curveId);
        if (!curve) return null;
        const p1s = econToSVG(curve.x1, curve.y1),
          p2s = econToSVG(curve.x2, curve.y2),
          cp = curveCP(curve);
        const pos = qBez(p1s, cp, p2s, tangentElem.t);
        return svgToEcon(pos.x, pos.y);
      }

      // Normal to the line, always pointing up (or right for a vertical line) so that
      // "convex" means the same thing whichever end the line was drawn from.
      function tangentPerp(dir) {
        const flip = dir.x < -1e-9 || (Math.abs(dir.x) <= 1e-9 && dir.y > 0);
        return flip ? { x: dir.y, y: -dir.x } : { x: -dir.y, y: dir.x };
      }

      // The curve's midpoint (t = 0.5) is always Q with tangent parallel to dir, so any
      // bend keeps it tangent to the line; bend only sets how far the arms pull away.
      function computeTangentCurvePoints(Q, dir, perp, sign, initialL, bend = 1) {
        function pointsFor(l) {
          const d = l * 0.35 * bend;
          const M = {
            x: Q.x - sign * d * perp.x,
            y: Q.y - sign * d * perp.y,
          };
          return {
            P0: {
              x: M.x - (l / 2) * dir.x,
              y: M.y - (l / 2) * dir.y,
            },
            P2: {
              x: M.x + (l / 2) * dir.x,
              y: M.y + (l / 2) * dir.y,
            },
            Pc: {
              x: Q.x + sign * d * perp.x,
              y: Q.y + sign * d * perp.y,
            },
          };
        }
        let L = initialL,
          pts = pointsFor(L),
          iter = 0;
        while (
          (!inBoundsEcon(pts.P0.x, pts.P0.y) || !inBoundsEcon(pts.P2.x, pts.P2.y)) &&
          iter < 40
        ) {
          L *= 0.85;
          pts = pointsFor(L);
          iter++;
        }
        return {
          P0: pts.P0,
          P2: pts.P2,
          Pc: pts.Pc,
          L: L,
        };
      }

      function addTangentCurveToLine(lineId, shape, Q, pointId) {
        const line = state.elements.find((x) => x.id === lineId);
        if (!line) return;
        pushUndo();
        const geo = getLineGeometry(line);
        if (!geo) return;
        const { a: a, b: b } = geo;
        const dx = b.x - a.x,
          dy = b.y - a.y;
        const lenSq = dx * dx + dy * dy;
        const len = Math.sqrt(lenSq) || 1;
        const dir = {
          x: dx / len,
          y: dy / len,
        };
        const perp = tangentPerp(dir);
        if (!Q)
          Q = {
            x: (a.x + b.x) / 2,
            y: (a.y + b.y) / 2,
          };
        const sign = shape === "convex" ? -1 : 1;
        const initialL = Math.min(len * 0.6, Math.max(state.xScale, state.yScale) * 0.5) || 1;
        const {
          P0: P0,
          P2: P2,
          Pc: Pc,
          L: L,
        } = computeTangentCurvePoints(Q, dir, perp, sign, initialL);
        const t = lenSq > 0 ? ((Q.x - a.x) * dx + (Q.y - a.y) * dy) / lenSq : 0.5;
        const id = uid();
        state.elements.push({
          id: id,
          type: "curve",
          shape: shape,
          x1: P0.x,
          y1: P0.y,
          x2: P2.x,
          y2: P2.y,
          cpx: Pc.x,
          cpy: Pc.y,
          lineId: lineId,
          t: Math.max(0, Math.min(1, t)),
          span: L,
          pointId: pointId,
          color: nextColor(),
          thickness: 2,
          dotted: false,
          label: "",
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
      }

      function resolveTangentCurveGeometry(elem) {
        const line = state.elements.find((x) => x.id === elem.lineId);
        if (!line) return;
        const geo = getLineGeometry(line);
        if (!geo) return;
        const { a: a, b: b } = geo;
        const Q = {
          x: a.x + (b.x - a.x) * elem.t,
          y: a.y + (b.y - a.y) * elem.t,
        };
        const dx = b.x - a.x,
          dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const dir = {
          x: dx / len,
          y: dy / len,
        };
        const perp = tangentPerp(dir);
        const sign = elem.shape === "convex" ? -1 : 1;
        const initialL =
          elem.span || Math.min(len * 0.6, Math.max(state.xScale, state.yScale) * 0.5) || 1;
        const bend = elem.bend !== undefined ? elem.bend : 1;
        const { P0: P0, P2: P2, Pc: Pc } = computeTangentCurvePoints(
          Q,
          dir,
          perp,
          sign,
          initialL,
          bend,
        );
        elem.x1 = P0.x;
        elem.y1 = P0.y;
        elem.x2 = P2.x;
        elem.y2 = P2.y;
        elem.cpx = Pc.x;
        elem.cpy = Pc.y;
        if (elem.pointId !== undefined) {
          const pt = state.elements.find((x) => x.id === elem.pointId);
          if (pt) {
            pt.ex = Q.x;
            pt.ey = Q.y;
          }
        }
      }

      function handleAddTangentCurve(lineId, Q, pointId) {
        showPopup(
          "Add Tangent Curve",
          "Choose the shape for a curve tangent to this line at the selected point:",
          [
            {
              label: "Convex",
              cls: "primary",
              fn: () => {
                addTangentCurveToLine(lineId, "convex", Q, pointId);
                closePopup();
              },
            },
            {
              label: "Concave",
              cls: "secondary",
              fn: () => {
                addTangentCurveToLine(lineId, "concave", Q, pointId);
                closePopup();
              },
            },
            {
              label: "Cancel",
              cls: "ghost",
              fn: closePopup,
            },
          ],
        );
      }

      function duplicateCurveShifted(src) {
        pushUndo();
        const off = Math.max(state.xScale, state.yScale) * 0.12;
        const dx = src.shape === "convex" ? -off : off;
        const dy = src.shape === "convex" ? off : -off;
        const id = uid();
        const dupe = {
          ...src,
          id: id,
          x1: Math.max(0, src.x1 + dx),
          y1: Math.min(state.yScale, src.y1 + dy),
          x2: Math.min(state.xScale, src.x2 - dx),
          y2: Math.max(0, src.y2 - dy),
          label: "",
        };
        if (src.cpx !== undefined) {
          dupe.cpx = src.cpx + dx;
          dupe.cpy = src.cpy + dy;
        }
        delete dupe.lineId;
        delete dupe.t;
        delete dupe.span;
        delete dupe.pointId;
        state.elements.push(dupe);
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
      }

      function deleteSelected() {
        if (!state.selectedIds || state.selectedIds.size === 0) return;
        pushUndo();
        const gone = state.selectedIds;
        state.elements = state.elements.filter((e) => !gone.has(e.id));
        let changed = true;
        while (changed) {
          const before = state.elements.length;
          state.elements = state.elements.filter((e) => {
            if (e.type === "line") {
              return (
                state.elements.find((x) => x.id === e.p1Id) &&
                state.elements.find((x) => x.id === e.p2Id)
              );
            }
            if (e.type === "tangent") {
              return state.elements.find((x) => x.id === e.curveId);
            }
            if (e.type === "curve" && e.lineId !== undefined) {
              return state.elements.find((x) => x.id === e.lineId);
            }
            if (e.type === "shade") {
              if (e.region) return true;
              const okA =
                e.boundA === "xaxis" ||
                e.boundA === "yaxis" ||
                state.elements.find((x) => x.id === e.boundA);
              const okB =
                e.boundB === "xaxis" ||
                e.boundB === "yaxis" ||
                state.elements.find((x) => x.id === e.boundB);
              return okA && okB;
            }
            return true;
          });
          changed = state.elements.length !== before;
        }
        clearSelection();
        render();
      }

      function copySelected() {
        const ids = [...state.selectedIds].filter((id) => id !== "xaxis" && id !== "yaxis");
        if (ids.length === 0) return;
        const toClone = new Set(ids);
        ids.forEach((id) => {
          const e = state.elements.find((x) => x.id === id);
          if (e && e.type === "line") {
            toClone.add(e.p1Id);
            toClone.add(e.p2Id);
          }
        });
        clipboard = [...toClone]
          .map((id) => state.elements.find((x) => x.id === id))
          .filter(Boolean)
          .map((e) => JSON.parse(JSON.stringify(e)));
      }

      function pasteClipboard() {
        if (!clipboard || clipboard.length === 0) return;
        pushUndo();
        const off = Math.max(state.xScale, state.yScale) * 0.03;
        const idMap = {};
        clipboard.forEach((src) => {
          idMap[src.id] = uid();
        });
        const newIds = [];
        clipboard.forEach((src) => {
          const dupe = JSON.parse(JSON.stringify(src));
          dupe.id = idMap[src.id];
          if (dupe.type === "point" || dupe.type === "text") {
            const c = clampEcon(src.ex + off, src.ey + off);
            dupe.ex = c.x;
            dupe.ey = c.y;
          } else if (dupe.type === "curve") {
            const c1 = clampEcon(src.x1 + off, src.y1 + off),
              c2 = clampEcon(src.x2 + off, src.y2 + off);
            dupe.x1 = c1.x;
            dupe.y1 = c1.y;
            dupe.x2 = c2.x;
            dupe.y2 = c2.y;
            if (src.cpx !== undefined) {
              dupe.cpx = src.cpx + off;
              dupe.cpy = src.cpy + off;
            }
            delete dupe.lineId;
            delete dupe.t;
            delete dupe.span;
            delete dupe.pointId;
          } else if (dupe.type === "line") {
            dupe.p1Id = idMap[src.p1Id] !== undefined ? idMap[src.p1Id] : src.p1Id;
            dupe.p2Id = idMap[src.p2Id] !== undefined ? idMap[src.p2Id] : src.p2Id;
          } else if (dupe.type === "tangent") {
            dupe.curveId = idMap[src.curveId] !== undefined ? idMap[src.curveId] : src.curveId;
          } else if (dupe.type === "shade") {
            dupe.boundA = idMap[src.boundA] !== undefined ? idMap[src.boundA] : src.boundA;
            dupe.boundB = idMap[src.boundB] !== undefined ? idMap[src.boundB] : src.boundB;
          }
          state.elements.push(dupe);
          newIds.push(dupe.id);
        });
        selectMultiple(newIds);
        render();
      }

      function duplicateSelected() {
        copySelected();
        pasteClipboard();
      }

      function nudgeSelected(dx, dy, pushHistory) {
        if (pushHistory) pushUndo();
        const movedPointIds = new Set();
        state.selectedIds.forEach((id) => {
          const e = state.elements.find((x) => x.id === id);
          if (!e) return;
          if (e.type === "point" || e.type === "text") movedPointIds.add(e.id);
          else if (e.type === "line") {
            movedPointIds.add(e.p1Id);
            movedPointIds.add(e.p2Id);
          }
        });
        movedPointIds.forEach((id) => {
          const p = state.elements.find((x) => x.id === id);
          if (!p) return;
          const c = clampEcon(p.ex + dx, p.ey + dy);
          p.ex = c.x;
          p.ey = c.y;
        });
        state.selectedIds.forEach((id) => {
          const e = state.elements.find((x) => x.id === id);
          if (e && e.type === "curve") {
            const c1 = clampEcon(e.x1 + dx, e.y1 + dy),
              c2 = clampEcon(e.x2 + dx, e.y2 + dy);
            e.x1 = c1.x;
            e.y1 = c1.y;
            e.x2 = c2.x;
            e.y2 = c2.y;
            if (e.cpx !== undefined) {
              e.cpx += dx;
              e.cpy += dy;
            }
          }
        });
        renderCanvas();
      }

      function selectEl(id) {
        state.selectedId = id;
        state.selectedIds = new Set(id != null ? [id] : []);
        render();
      }

      function selectElMaybeAdd(id, e) {
        if (e && (e.ctrlKey || e.metaKey)) {
          const s = new Set(state.selectedIds);
          if (s.has(id)) s.delete(id);
          else s.add(id);
          selectMultiple([...s]);
        } else {
          selectEl(id);
        }
      }

      function selectMultiple(ids) {
        state.selectedIds = new Set(ids);
        state.selectedId = ids.length === 1 ? ids[0] : null;
        render();
      }

      function selectAll() {
        selectMultiple(state.elements.map((e) => e.id));
      }

      let _fontFaceCSS = null;

      async function embeddedFontCSS() {
        if (_fontFaceCSS !== null) return _fontFaceCSS;
        try {
          const css = await (
            await fetch(
              "https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,400;0,500;1,400&display=swap",
            )
          ).text();
          const urls = [...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map((m) => m[1]))];
          let out = css;
          for (const u of urls) {
            const buf = await (await fetch(u)).arrayBuffer();
            const bytes = new Uint8Array(buf);
            let bin = "";
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            out = out.split(u).join("data:font/woff2;base64," + btoa(bin));
          }
          _fontFaceCSS = out;
        } catch (e) {
          _fontFaceCSS = "";
        }
        return _fontFaceCSS;
      }

      async function serializeSVGForExport() {
        const clone = svg.cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
        style.textContent =
          (await embeddedFontCSS()) + "\n.svg-lbl{font-family:'Prompt',sans-serif}\n";
        clone.insertBefore(style, clone.firstChild);
        return (
          `<?xml version="1.0" encoding="UTF-8"?>` + new XMLSerializer().serializeToString(clone)
        );
      }

      async function doExportSVG() {
        const origSel = state.selectedId,
          origSelIds = state.selectedIds;
        clearSelection();
        render();
        const svgStr = await serializeSVGForExport();
        const blob = new Blob([svgStr], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = "cruxplot-graph.svg";
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
        state.selectedId = origSel;
        state.selectedIds = origSelIds;
        render();
      }

      function exportJSONFile() {

        const blob = new Blob([data], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = "cruxplot-graph.json";
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);

      function importJSONFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            pushUndo();
            Object.assign(state, data);
            clearSelection();
            render();
          } catch (err) {
            alert("That file could not be read as a cruxplot graph.");
          }
        };
        reader.readAsText(file);
      }

      document.getElementById("import-file-input").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) importJSONFile(file);
        e.target.value = "";
      });

      async function doExport(transparent) {
        const scale = 2;
        const origBg = state.bgColor;
        const origGrid = state.showGrid;
        if (transparent) {
          state.bgColor = "transparent";
        }
        const origSel = state.selectedId;
        const origSelIds = state.selectedIds;
        clearSelection();
        render();
        const svgStr = await serializeSVGForExport();
        const blob = new Blob([svgStr], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = SVG_W * scale;
          canvas.height = SVG_H * scale;
          const ctx = canvas.getContext("2d");
          if (!transparent) {
            ctx.fillStyle = origBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          ctx.scale(scale, scale);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          const link = document.createElement("a");
          link.download = "cruxplot-graph.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          state.bgColor = origBg;
          state.selectedId = origSel;
          state.selectedIds = origSelIds;
          render();
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          state.bgColor = origBg;
          state.selectedId = origSel;
          state.selectedIds = origSelIds;
          render();
          alert('Export failed. Try right-clicking the graph and "Save as image".');
        };
        img.src = url;
      }

      function numFmt(v) {
        return (Math.round(v * 100) / 100).toString();
      }

      function numFmtSig(v, sig = 4) {
        if (Math.abs(v) < 1e-9) return "0";
        return parseFloat(v.toPrecision(sig)).toString();
      }

      function buildConicString(co) {
        const terms = [
          [co.A, "x^2"],
          [co.B, "xy"],
          [co.C, "y^2"],
          [co.D, "x"],
          [co.E, "y"],
        ];
        let out = "";
        terms.forEach(([coef, label]) => {
          if (Math.abs(coef) < 1e-9) return;
          const absC = Math.abs(coef);
          const coefStr = Math.abs(absC - 1) < 1e-6 ? "" : numFmtSig(absC);
          if (out === "") {
            out = (coef < 0 ? "-" : "") + coefStr + label;
          } else {
            out += ` ${coef < 0 ? "-" : "+"} ${coefStr}${label}`;
          }
        });
        if (Math.abs(co.F) > 1e-9 || out === "") {
          const val = numFmtSig(Math.abs(co.F));
          out += out === "" ? (co.F < 0 ? "-" : "") + val : ` ${co.F < 0 ? "-" : "+"} ${val}`;
        }
        return out + " = 0";
      }

      function parseConicSide(s) {
        s = s.replace(/\s+/g, "");
        if (s === "")
          return {
            A: 0,
            B: 0,
            C: 0,
            D: 0,
            E: 0,
            F: 0,
          };
        if (s[0] !== "+" && s[0] !== "-") s = "+" + s;
        const termRe = /([+-])(\d*\.?\d*)(x\^2|y\^2|xy|yx|x|y)?/g;
        const co = {
          A: 0,
          B: 0,
          C: 0,
          D: 0,
          E: 0,
          F: 0,
        };
        let m;
        while ((m = termRe.exec(s)) !== null) {
          if (m[0] === "") {
            termRe.lastIndex++;
            continue;
          }
          const sign = m[1] === "-" ? -1 : 1;
          const coef = (m[2] === "" ? 1 : parseFloat(m[2])) * sign;
          const v = m[3];
          if (!v) co.F += coef;
          else if (v === "x^2") co.A += coef;
          else if (v === "y^2") co.C += coef;
          else if (v === "xy" || v === "yx") co.B += coef;
          else if (v === "x") co.D += coef;
          else if (v === "y") co.E += coef;
        }
        return co;
      }

      function parseConicString(str) {
        const s = str.trim();
        if (!s) return null;
        let lhsStr = s,
          rhsStr = "0";
        if (s.includes("=")) {
          const parts = s.split("=");
          if (parts.length !== 2) return null;
          lhsStr = parts[0];
          rhsStr = parts[1];
        }
        const lhs = parseConicSide(lhsStr),
          rhs = parseConicSide(rhsStr);
        const co = {};
        ["A", "B", "C", "D", "E", "F"].forEach((k) => (co[k] = lhs[k] - rhs[k]));
        const anyNonzero = Object.values(co).some((v) => Math.abs(v) > 1e-12);
        return anyNonzero ? co : null;
      }

      function solveConicForY(co, x, preferNearY) {
        const a = co.C,
          b = co.B * x + co.E,
          c = co.A * x * x + co.D * x + co.F;
        if (Math.abs(a) < 1e-9) {
          if (Math.abs(b) < 1e-9) return null;
          return -c / b;
        }
        const disc = b * b - 4 * a * c;
        if (disc < 0) return null;
        const sq = Math.sqrt(disc);
        const y1 = (-b + sq) / (2 * a),
          y2 = (-b - sq) / (2 * a);
        if (preferNearY === undefined) return y1;
        return Math.abs(y1 - preferNearY) <= Math.abs(y2 - preferNearY) ? y1 : y2;
      }

      function equationFor(elem) {
        if (!elem) return "";
        if (elem.type === "point") {
          return `(${numFmt(elem.ex)}, ${numFmt(elem.ey)})`;
        }
        if (elem.type === "line") {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return "";
          if (Math.abs(b.ex - a.ex) < 1e-9) return `x = ${numFmt(a.ex)}`;
          const m = (b.ey - a.ey) / (b.ex - a.ex);
          const c = a.ey - m * a.ex;
          return `y = ${numFmt(m)}x ${c >= 0 ? "+" : "-"} ${numFmt(Math.abs(c))}`;
        }
        if (elem.type === "curve") {
          const co = curveConicCoeffs(elem);
          if (co) return buildConicString(co);
          if (Math.abs(elem.x2 - elem.x1) < 1e-9) return `x = ${numFmt(elem.x1)}`;
          const m = (elem.y2 - elem.y1) / (elem.x2 - elem.x1);
          const c = elem.y1 - m * elem.x1;
          return `y = ${numFmt(m)}x ${c >= 0 ? "+" : "-"} ${numFmt(Math.abs(c))}`;
        }
        if (elem.type === "tangent") {
          return `t = ${numFmt(elem.t)}`;
        }
        return "";
      }

      function parseEquation(elem, str) {
        str = (str || "").trim();
        if (!elem || !str) return false;
        if (elem.type === "point") {
          const m = str.match(/^\(\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*\)$/);
          if (!m) return false;
          const ep = clampEcon(parseFloat(m[1]), parseFloat(m[2]));
          elem.ex = ep.x;
          elem.ey = ep.y;
          return true;
        }
        if (elem.type === "line") {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return false;
          let m;
          if ((m = str.match(/^x\s*=\s*(-?\d*\.?\d+)$/i))) {
            const c = clampEcon(parseFloat(m[1]), 0).x;
            a.ex = c;
            b.ex = c;
            return true;
          }
          if ((m = str.match(/^y\s*=\s*(-?\d*\.?\d+)$/i))) {
            const c = clampEcon(0, parseFloat(m[1])).y;
            a.ey = c;
            b.ey = c;
            return true;
          }
          m = str.match(/^y\s*=\s*(-?\d*\.?\d*)\s*x\s*([+-]\s*\d*\.?\d+)?$/i);
          if (m) {
            const s = m[1];
            let slope;
            if (s === "" || s === "+") slope = 1;
            else if (s === "-") slope = -1;
            else slope = parseFloat(s);
            const intercept = m[2] !== undefined ? parseFloat(m[2].replace(/\s+/g, "")) : 0;
            const p1 = clampEcon(a.ex, slope * a.ex + intercept);
            const p2 = clampEcon(b.ex, slope * b.ex + intercept);
            a.ey = p1.y;
            b.ey = p2.y;
            return true;
          }
          return false;
        }
        if (elem.type === "curve") {
          const co = parseConicString(str);
          if (!co) return false;
          if (Math.abs(co.A) < 1e-9 && Math.abs(co.B) < 1e-9 && Math.abs(co.C) < 1e-9) {
            if (Math.abs(co.E) < 1e-9) {
              if (Math.abs(co.D) < 1e-9) return false;
              const cx = clampEcon(-co.F / co.D, 0).x;
              elem.x1 = cx;
              elem.x2 = cx;
            } else {
              const newY1 = -(co.D * elem.x1 + co.F) / co.E;
              const newY2 = -(co.D * elem.x2 + co.F) / co.E;
              const p1 = clampEcon(elem.x1, newY1),
                p2 = clampEcon(elem.x2, newY2);
              elem.y1 = p1.y;
              elem.y2 = p2.y;
            }
            delete elem.cpx;
            delete elem.cpy;
            delete elem.lineId;
            delete elem.t;
            delete elem.span;
            delete elem.pointId;
            elem.curvature = 0;
            return true;
          }
          const X0 = elem.x1,
            X2 = elem.x2,
            Xmid = (X0 + X2) / 2;
          const oldCp = econCurveCP(elem);
          const oldMidY = 0.25 * elem.y1 + 0.5 * oldCp.y + 0.25 * elem.y2;
          const Y0 = solveConicForY(co, X0, elem.y1);
          const Y2 = solveConicForY(co, X2, elem.y2);
          const Ymid = solveConicForY(co, Xmid, oldMidY);
          if (Y0 === null || Y2 === null || Ymid === null) return false;
          const P0 = clampEcon(X0, Y0),
            P2c = clampEcon(X2, Y2);
          const Mid = {
            x: Xmid,
            y: Ymid,
          };
          const Pc = {
            x: 2 * Mid.x - 0.5 * P0.x - 0.5 * P2c.x,
            y: 2 * Mid.y - 0.5 * P0.y - 0.5 * P2c.y,
          };
          elem.x1 = P0.x;
          elem.y1 = P0.y;
          elem.x2 = P2c.x;
          elem.y2 = P2c.y;
          elem.cpx = Pc.x;
          elem.cpy = Pc.y;
          delete elem.lineId;
          delete elem.t;
          delete elem.span;
          delete elem.pointId;
          return true;
        }
        if (elem.type === "tangent") {
          const m = str.match(/t\s*=\s*(-?\d*\.?\d+)/i);
          if (!m) return false;
          elem.t = Math.max(0.02, Math.min(0.98, parseFloat(m[1])));
          return true;
        }
        return false;
      }

      function normalizeLatex(str) {
        return String(str)
          .replace(/\\left/g, "")
          .replace(/\\right/g, "")
          .replace(/\\cdot/g, "*")
          .replace(/\\times/g, "*")
          .replace(/\^\{([^{}]*)\}/g, "^$1")
          .replace(/\\,/g, " ")
          .replace(/\\!/g, "")
          .trim();
      }

      function sec(title) {
        const d = document.createElement("div");
        d.className = "sb-section";
        const h = document.createElement("h3");
        h.textContent = title;
        d.appendChild(h);
        return d;
      }

      function ctrlRow(label, control) {
        const d = document.createElement("div");
        d.className = "ctrl-row";
        const l = document.createElement("label");
        l.textContent = label;
        d.appendChild(l);
        if (control) d.appendChild(control);
        return d;
      }

      function inputTxt(val, cb) {
        const i = document.createElement("input");
        i.type = "text";
        i.value = val;
        i.addEventListener("focus", () => pushUndo());
        i.addEventListener("input", (e) => cb(e.target.value));
        return i;
      }

      function inputColor(val, cb) {
        const i = document.createElement("input");
        i.type = "color";
        i.value = val;
        i.addEventListener("focus", () => pushUndo());
        i.addEventListener("input", (e) => cb(e.target.value));
        return i;
      }

      function inputNum(val, min, max, cb, step = 1) {
        const i = document.createElement("input");
        i.type = "number";
        i.value = val;
        i.min = min;
        i.max = max;
        i.step = step;
        i.addEventListener("focus", () => pushUndo());
        i.addEventListener("change", (e) =>
          cb(Math.max(min, Math.min(max, parseFloat(e.target.value) || val))),
        );
        return i;
      }

      function rangeCtrl(val, min, max, step, cb) {
        const wrap = document.createElement("div");
        wrap.className = "range-wrap";
        const r = document.createElement("input");
        r.type = "range";
        r.min = min;
        r.max = max;
        r.step = step;
        r.value = val;
        const lbl = document.createElement("span");
        lbl.className = "range-val";
        lbl.textContent = formatVal(val, step);
        r.addEventListener("pointerdown", () => pushUndo());
        r.addEventListener("input", (e) => {
          const v = parseFloat(e.target.value);
          lbl.textContent = formatVal(v, step);
          cb(v);
        });
        wrap.appendChild(r);
        wrap.appendChild(lbl);
        return wrap;
      }

      function rotateCtrl(elem) {
        const wrap = document.createElement("div");
        wrap.className = "range-wrap";
        const r = document.createElement("input");
        r.type = "range";
        r.min = -45;
        r.max = 45;
        r.step = 1;
        r.value = 0;
        const lbl = document.createElement("span");
        lbl.className = "range-val";
        lbl.textContent = "0°";
        let lastVal = 0;
        r.addEventListener("pointerdown", () => pushUndo());
        r.addEventListener("input", (e) => {
          const v = parseFloat(e.target.value);
          rotateElementBy(elem, v - lastVal);
          lastVal = v;
          lbl.textContent = Math.round(v) + "°";
          renderCanvas();
        });
        r.addEventListener("change", () => {
          r.value = 0;
          lbl.textContent = "0°";
          lastVal = 0;
        });
        wrap.appendChild(r);
        wrap.appendChild(lbl);
        return wrap;
      }

      function formatVal(v, step) {
        return step < 1 ? v.toFixed(2) : Math.round(v).toString();
      }

      function tplBudget() {
        clearCanvas();
        state.showGrid = true;
        state.gridColor = "#e0e0e0";
        state.bgColor = "#ffffff";
        state.xScale = 16;
        state.yScale = 16;
        state.xTicks = {
          enabled: true,
          start: 0,
          end: 16,
          step: 1,
        };
        state.yTicks = {
          enabled: true,
          start: 0,
          end: 16,
          step: 1,
        };
        state.xLabel = "Oranges (x)";
        state.yLabel = "Apples (y)";
        // Built the way a user would: draw each budget line, drop a point on it, then
        // "+ Add Tangent Curve" at that point so the IC stays tangent as things move.
        const budgetLine = (xIntercept, color, label, lox, loy) => {
          const a = uid(),
            b = uid(),
            id = uid();
          push({ id: a, type: "point", ex: 0, ey: 15, color: "#222", size: 5, label: "" });
          push({ id: b, type: "point", ex: xIntercept, ey: 0, color: "#222", size: 5, label: "" });
          push({
            id: id,
            type: "line",
            p1Id: a,
            p2Id: b,
            color: color,
            thickness: 2,
            dotted: false,
            label: label,
            hideHandles: true,
            lox: lox,
            loy: loy,
          });
          return id;
        };
        const tangentIC = (lineId, xIntercept, x, color, label) => {
          const pt = uid(),
            id = uid();
          push({
            id: pt,
            type: "point",
            ex: x,
            ey: 15 - (15 / xIntercept) * x,
            color: "#4400ff",
            size: 5,
            label: "",
            guides: true,
            guideColor: "#daa410",
          });
          const curve = {
            id: id,
            type: "curve",
            shape: "convex",
            lineId: lineId,
            t: x / xIntercept,
            pointId: pt,
            color: color,
            thickness: 2,
            dotted: false,
            label: label,
          };
          push(curve);
          resolveTangentCurveGeometry(curve);
        };
        const steep = budgetLine(5, "#29ae4a", "BL₁", -30, -4);
        const shallow = budgetLine(15, "#ac4c0c", "BL₂", 60, 42);
        tangentIC(steep, 5, 3, "#7800bd", "U₁");
        tangentIC(shallow, 15, 7, "#d41243", "U₂");
      }

      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "MATH-FIELD") return;
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key.toLowerCase() === "a") {
          e.preventDefault();
          setMode("select");
          selectAll();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "y") {
          e.preventDefault();
          redo();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "c") {
          e.preventDefault();
          copySelected();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "v") {
          e.preventDefault();
          pasteClipboard();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "d") {
          e.preventDefault();
          duplicateSelected();
          return;
        }
        if (
          ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key) &&
          state.selectedIds.size > 0
        ) {
          e.preventDefault();
          const step = Math.max(state.xScale, state.yScale) * 0.01 * (e.shiftKey ? 5 : 1);
          const dx = e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0;
          const dy = e.key === "ArrowUp" ? step : e.key === "ArrowDown" ? -step : 0;
          nudgeSelected(dx, dy, !e.repeat);
          return;
        }
        if (e.key === "Escape") {
          setMode("select");
          closePopup();
        }
        if ((e.key === "Delete" || e.key === "Backspace") && state.selectedIds.size > 0) {
          e.preventDefault();
          deleteSelected();
        }
        if (e.key === "p") setMode("point");
        if (e.key === "l") handleLineBtn();
        if (e.key === "c") handleCurveBtn();
        if (e.key === "s") setMode("select");
      });

      buildRightSidebar();
