<html lang="en">

    <title>cruxplot</title>
    <meta name="description" content="cruxplot draws economics diagrams in your browser. It is built for qualitative graphs, where shape matters and numbers do not. Tangencies hold, points snap to intersections, and templates come ready to edit." />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ink: #2b3038;
        --slate: #46525f;
        --marigold: #f2a541;
        --aqua: #5ec8bd;
        --coral: #d9573c;
        --cream: #ffffff;

        --desk: #f5f5f5;
        --text: #39434a;
        --sidebar-w: clamp(184px, 21vw, 264px);

        --sidebar-w-left: clamp(232px, 23vw, 300px);
      }
      html,
      body {
        height: 100%;
        font-family: "Prompt", sans-serif;
        background: var(--desk);
        color: var(--text);
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        height: 64px;
        background: var(--ink);
        flex-shrink: 0;
      }
      header .logo {
        height: 40px;
        width: auto;
        display: block;
      }

      header .mark {
        height: 30px;
        width: 30px;
        display: block;
        flex-shrink: 0;
      }
      header .tagline {
        color: var(--white);
        font-size: 0.8rem;
        margin-top: 2px;
      }
      main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      .sidebar {
        width: var(--sidebar-w);
        background: var(--cream);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        flex-shrink: 0;

        position: relative;
        z-index: 2;
      }
      #left-sidebar {
        width: var(--sidebar-w-left);
        box-shadow: 6px 0 18px rgba(18, 22, 28, 0.34);
      }
      #right-sidebar {
        box-shadow: -6px 0 18px rgba(18, 22, 28, 0.34);
      }

      .sidebar::-webkit-scrollbar {
        width: 11px;
      }
      .sidebar::-webkit-scrollbar-track {
        background: transparent;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #b3b8c2;
        border-radius: 6px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .sidebar::-webkit-scrollbar-thumb:hover {
        background: #949aa5;
        background-clip: content-box;
      }
      .sb-section {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .sb-section h3 {
        font-family: "Playwrite DE Grund", cursive;
        font-size: 0.8rem;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink);
        margin-bottom: 10px;
        -webkit-text-stroke: 0.35px currentColor;
      }
      .ctrl-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
        min-width: 0;
      }
      .ctrl-row label {
        font-size: 0.76rem;
        min-width: 60px;
        color: #555;
        flex-shrink: 0;
      }
      .ctrl-row input[type="text"] {
        flex: 1;
        min-width: 0;
        box-sizing: border-box;
        padding: 3px 7px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.78rem;
        font-family: inherit;
        background: #fff;
      }
      .ctrl-row input[type="text"]:focus {
        outline: none;
        border-color: var(--slate);
      }
      .ctrl-row input[type="color"] {
        width: 34px;
        height: 26px;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        padding: 1px;
        background: #fff;
      }
      .ctrl-row input[type="number"] {
        width: 58px;
        padding: 3px 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.78rem;
        font-family: inherit;
      }
      .ctrl-row input[type="checkbox"] {
        accent-color: var(--slate);
        cursor: pointer;
        width: 15px;
        height: 15px;
      }

      .range-wrap {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 1;
        min-width: 0;
      }
      .range-wrap input[type="range"] {
        flex: 1;
        min-width: 0;
        accent-color: var(--slate);
        cursor: pointer;
      }
      .range-val {
        font-size: 0.72rem;
        color: #888;
        min-width: 28px;
        text-align: right;
      }
      .no-sel {
        font-size: 0.78rem;
        color: #999;
        text-align: center;
        padding: 18px 12px;
        font-style: italic;
      }
      .eq-input {
        display: block;
        width: 100%;
        padding: 8px 9px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 0.8rem;
        background: #fff;
        box-sizing: border-box;
        --smart-fence-color: var(--slate);
      }
      .eq-input:focus,
      .eq-input:focus-within {
        outline: none;
        border-color: var(--slate);
      }
      .eq-input::part(virtual-keyboard-toggle),
      .eq-input::part(menu-toggle) {
        display: none;
      }
      .side-btn {
        display: block;
        width: 100%;
        padding: 7px 10px;
        margin-top: 6px;
        background: var(--slate);
        color: var(--cream);
        border: none;
        border-radius: 6px;
        font-family: "Prompt", sans-serif;
        font-size: 0.78rem;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s;
      }
      .side-btn:hover {
        background: var(--marigold);
        color: var(--ink);
      }
      .side-btn small {
        display: block;
        font-size: 0.68rem;
        opacity: 0.65;
        margin-top: 1px;
      }

      .tpl-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));

        grid-auto-rows: 1fr;
        gap: 10px;
        margin-top: 8px;
        margin-bottom: 12px;
      }

      @media (max-width: 1000px) {
        .tpl-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* 3D "learn-more" button, adapted from Uiverse.io by Madflows */
      .side-btn.tpl-btn {
        --tpl-face: #fff6ea;
        --tpl-face-hover: #ffecd2;
        --tpl-edge: var(--slate);
        --tpl-base: var(--marigold);
        --tpl-shadow: #fbe0b8;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 0 0.75em;
        padding: 0.9em 0.5em;
        font-family: "Nunito", sans-serif;
        font-weight: 600;
        font-size: 0.7rem;
        line-height: 1.3;
        text-transform: uppercase;
        text-align: center;
        color: var(--ink);
        background: var(--tpl-face);
        border: 2px solid var(--tpl-edge);
        border-radius: 0.75em;
        hyphens: auto;
        overflow-wrap: break-word;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        transform-style: preserve-3d;
        transition:
          transform 150ms cubic-bezier(0, 0, 0.58, 1),
          background 150ms cubic-bezier(0, 0, 0.58, 1);
      }
      .side-btn.tpl-btn::before {
        position: absolute;
        content: "";
        inset: 0;
        background: var(--tpl-base);
        border-radius: inherit;
        box-shadow:
          0 0 0 2px var(--tpl-edge),
          0 0.625em 0 0 var(--tpl-shadow);
        transform: translate3d(0, 0.75em, -1em);
        transition:
          transform 150ms cubic-bezier(0, 0, 0.58, 1),
          box-shadow 150ms cubic-bezier(0, 0, 0.58, 1);
      }
      .side-btn.tpl-btn:hover,
      .side-btn.tpl-btn:focus-visible {
        background: var(--tpl-face-hover);
        color: var(--ink);
        transform: translate(0, 0.25em);
      }
      .side-btn.tpl-btn:hover::before,
      .side-btn.tpl-btn:focus-visible::before {
        box-shadow:
          0 0 0 2px var(--tpl-edge),
          0 0.5em 0 0 var(--tpl-shadow);
        transform: translate3d(0, 0.5em, -1em);
      }
      .side-btn.tpl-btn:active {
        background: var(--tpl-face-hover);
        transform: translate(0, 0.75em);
      }
      .side-btn.tpl-btn:active::before {
        box-shadow:
          0 0 0 2px var(--tpl-edge),
          0 0 var(--tpl-shadow);
        transform: translate3d(0, 0, -1em);
      }
      .hint-text {
        font-size: 0.73rem;
        color: #666;
        line-height: 2;
        margin-top: 2px;
      }
      .hint-text b {
        color: var(--slate);
      }
      .shortcut-row {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .shortcut-row span {
        white-space: nowrap;
        font-size: 0.78rem;
      }
      .key-icon-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .shortcut-row .key-plus {
        display: inline-flex;
        width: 18px;
        height: 18px;
        color: var(--slate);
        flex-shrink: 0;
      }
      .key-plus svg {
        width: 100%;
        height: 100%;
      }
      .region-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .region-swatch {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        flex-shrink: 0;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .region-name {
        flex: 1;
        min-width: 0;
        font-size: 0.76rem;
        color: var(--text);
      }
      .region-row .side-btn {
        width: auto;
        margin-top: 0;
        padding: 3px 8px;
        font-size: 0.7rem;
        text-align: center;
        flex-shrink: 0;
      }
      .key-icon {
        height: 37px;
        width: auto;
        vertical-align: middle;
        border-radius: 3px;
        flex-shrink: 0;
      }

      #canvas-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

      #svg-wrapper {
        background: #fff;
        border-radius: 3px;
        min-height: 0;
        flex-shrink: 1;
        border: 1px solid rgba(20, 25, 32, 0.16);
        box-shadow: 0 6px 22px rgba(18, 22, 28, 0.3);
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #main-svg {
        display: block;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        max-width: 100%;
        max-height: calc(100vh - 132px);
        width: auto;
        height: auto;
      }
      #main-svg.mode-point,
      #main-svg.mode-line {
        cursor:
          url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCI+CjxsaW5lIHgxPSIxMiIgeTE9IjEiIHgyPSIxMiIgeTI9IjIzIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjMiLz4KPGxpbmUgeDE9IjEiIHkxPSIxMiIgeDI9IjIzIiB5Mj0iMTIiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMyIvPgo8bGluZSB4MT0iMTIiIHkxPSIxIiB4Mj0iMTIiIHkyPSIyMyIgc3Ryb2tlPSIjMjIyIiBzdHJva2Utd2lkdGg9IjEiLz4KPGxpbmUgeDE9IjEiIHkxPSIxMiIgeDI9IjIzIiB5Mj0iMTIiIHN0cm9rZT0iIzIyMiIgc3Ryb2tlLXdpZHRoPSIxIi8+Cjwvc3ZnPg==")
            12 12,
          crosshair;
      }
      #main-svg.mode-curve {
        cursor: default;
      }
      #main-svg.mode-text {
        cursor: text;
      }

      #main-svg[class*="mode-"] g[data-id],
      #main-svg[class*="mode-"] g[data-id] * {
        cursor: inherit !important;
      }

      #toolbar {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        background: rgba(255, 255, 255, 0.92);
        padding: 8px 14px;
        border-radius: 16px;
        backdrop-filter: blur(10px);
        flex-shrink: 0;
        max-width: 100%;
        box-shadow: 0 6px 20px rgba(18, 22, 28, 0.38);
      }
      .tool-btn {
        width: 44px;
        height: 44px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1.5px solid rgba(70, 82, 95, 0.25);
        border-radius: 12px;
        background: transparent;
        color: var(--slate);
        font-family: "Prompt", sans-serif;
        cursor: pointer;
        transition: all 0.14s;
      }
      .tool-btn:hover {
        background: rgba(70, 82, 95, 0.1);
        border-color: var(--slate);
      }
      .tool-btn.active {
        background: var(--marigold);
        color: var(--ink);
        border-color: var(--marigold);
      }
      .tool-btn.danger:hover {
        background: var(--coral);
        border-color: var(--coral);
        color: #fff;
      }
      .tool-sep {
        width: 3px;
        height: 28px;
        border-radius: 2px;
        background: rgba(70, 82, 95, 0.38);
        flex-shrink: 0;
      }
      .tool-icon {
        width: 27px;
        height: 23px;
        display: block;
        background: currentColor;
        -webkit-mask: var(--m) center/contain no-repeat;
        mask: var(--m) center/contain no-repeat;
      }

      #popup-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 200;
        align-items: center;
        justify-content: center;
      }
      #popup-overlay.open {
        display: flex;
      }
      #popup-box {
        background: var(--cream);
        border-radius: 12px;
        padding: 24px 26px;
        min-width: 290px;
        max-width: 380px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      }
      #popup-box h2 {
        font-size: 1.05rem;
        color: var(--slate);
        margin-bottom: 8px;
      }
      #popup-box p {
        font-size: 0.82rem;
        color: #555;
        margin-bottom: 18px;
        line-height: 1.5;
      }
      .pop-btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pop-btn {
        padding: 8px 18px;
        border-radius: 6px;
        font-family: "Prompt", sans-serif;
        font-size: 0.82rem;
        font-weight: 500;
        cursor: pointer;
        border: 2px solid var(--slate);
        transition: all 0.13s;
      }
      .pop-btn.primary {
        background: var(--slate);
        color: var(--cream);
      }
      .pop-btn.primary:hover {
        background: var(--marigold);
        border-color: var(--marigold);
        color: var(--ink);
      }
      .pop-btn.secondary {
        background: transparent;
        color: var(--slate);
      }
      .pop-btn.secondary:hover {
        background: var(--slate);
        color: var(--cream);
      }
      .pop-btn.ghost {
        border-color: #ccc;
        color: #888;
      }
      .pop-btn.ghost:hover {
        background: #eee;
        border-color: #aaa;
        color: #555;
      }
      .pop-btn-icon {
        width: 56px;
        height: 56px;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pop-btn-icon svg {
        width: 100%;
        height: 100%;
      }

      .svg-lbl {
        font-family: "Prompt", sans-serif;
        pointer-events: none;
        user-select: none;
      }
    </style>

    <script>
      const LINE_COLORS = ["#00aedb", "#a200ff", "#f47835", "#d41243", "#8ec127"];

      const SVG_W = 580,
        SVG_H = 560;

      const PL = 52,
        PR = 16,
        PT = 16,
        PB = 48;

      const GW = SVG_W - PL - PR;

      const GH = SVG_H - PT - PB;

      const DEFAULT_SCALE = 20;

      let state = {
        elements: [],
        selectedId: null,
        selectedIds: new Set(),
        mode: "select",
        lineFirstId: null,
        xScale: DEFAULT_SCALE,
        yScale: DEFAULT_SCALE,
        scaleLock: 1,
        gridColor: "#e0e0e0",
        bgColor: "#ffffff",
        xLabel: "X",
        yLabel: "Y",
        showGrid: true,
        xTicks: {
          enabled: false,
          start: 0,
          end: 10,
          step: 1,
        },
        yTicks: {
          enabled: false,
          start: 0,
          end: 10,
          step: 1,
        },
        nextId: 1,
        _mousePos: null,
        _crosshair: null,
      };

      let undoStack = [];

      let redoStack = [];

      let clipboard = null;

      const MAX_UNDO = 60;

      const SNAPSHOT_KEYS = [
        "elements",
        "xScale",
        "yScale",
        "scaleLock",
        "gridColor",
        "bgColor",
        "xLabel",
        "yLabel",
        "showGrid",
        "xTicks",
        "yTicks",
        "nextId",
      ];

      // Scale only sets how many grid units span each axis. Element coordinates are
      // stretched with it so the drawing stays where it is on the canvas.
      function rescaleElements(kx, ky) {
        if (kx === 1 && ky === 1) return;
        const ks = Math.sqrt(kx * ky);
        state.elements.forEach((e) => {
          if (e.ex !== undefined) e.ex *= kx;
          if (e.ey !== undefined) e.ey *= ky;
          if (e.x1 !== undefined) e.x1 *= kx;
          if (e.y1 !== undefined) e.y1 *= ky;
          if (e.x2 !== undefined) e.x2 *= kx;
          if (e.y2 !== undefined) e.y2 *= ky;
          if (e.cpx !== undefined) e.cpx *= kx;
          if (e.cpy !== undefined) e.cpy *= ky;
          if (e.span !== undefined) e.span *= ks;
        });
      }

      function setScaleKeepingDrawing(xs, ys) {
        const kx = xs / state.xScale,
          ky = ys / state.yScale;
        state.xScale = xs;
        state.yScale = ys;
        rescaleElements(kx, ky);
      }

      function setScale(axis, v) {
        if (!(v > 0)) return;
        const oldX = state.xScale,
          oldY = state.yScale;
        applyScale(axis, v);
        rescaleElements(state.xScale / oldX, state.yScale / oldY);
      }

      function applyScale(axis, v) {
        if (axis === "x") state.xScale = v;
        else state.yScale = v;
        if (state.scaleLock) {
          const other = axis === "x" ? v * state.scaleLock : v / state.scaleLock;
          const clamped = Math.min(1e6, Math.max(1, Math.round(other * 1000) / 1000));
          if (axis === "x") state.yScale = clamped;
          else state.xScale = clamped;
        }
      }

      function snapshotState() {
        const snap = {};
        SNAPSHOT_KEYS.forEach((k) => (snap[k] = state[k]));
        return JSON.stringify(snap);
      }

      function pushUndo() {
        undoStack.push(snapshotState());
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0;
      }

      function restoreSnapshot(json) {
        const snap = JSON.parse(json);
        Object.assign(state, snap);
        clearSelection();
        render();
      }

      function undo() {
        if (undoStack.length === 0) return;
        redoStack.push(snapshotState());
        restoreSnapshot(undoStack.pop());
      }

      function redo() {
        if (redoStack.length === 0) return;
        undoStack.push(snapshotState());
        restoreSnapshot(redoStack.pop());
      }

      function econToSVG(ex, ey) {
        return {
          x: PL + (ex / state.xScale) * GW,
          y: SVG_H - PB - (ey / state.yScale) * GH,
        };
      }

      function svgToEcon(sx, sy) {
        return {
          x: ((sx - PL) / GW) * state.xScale,
          y: ((SVG_H - PB - sy) / GH) * state.yScale,
        };
      }

      function clampEcon(ex, ey) {
        return {
          x: Math.max(0, Math.min(state.xScale, ex)),
          y: Math.max(0, Math.min(state.yScale, ey)),
        };
      }

      function inBoundsEcon(ex, ey) {
        return ex >= -1e-9 && ex <= state.xScale + 1e-9 && ey >= -1e-9 && ey <= state.yScale + 1e-9;
      }

      function rotatePointAround(px, py, cx, cy, angleDeg) {
        const rad = (angleDeg * Math.PI) / 180,
          cos = Math.cos(rad),
          sin = Math.sin(rad);
        const dx = px - cx,
          dy = py - cy;
        return {
          x: cx + dx * cos - dy * sin,
          y: cy + dx * sin + dy * cos,
        };
      }

      function rotateElementBy(elem, deg) {
        if (elem.type === "line") {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return;
          const cx = (a.ex + b.ex) / 2,
            cy = (a.ey + b.ey) / 2;
          const na = rotatePointAround(a.ex, a.ey, cx, cy, deg);
          const nb = rotatePointAround(b.ex, b.ey, cx, cy, deg);
          if (!inBoundsEcon(na.x, na.y) || !inBoundsEcon(nb.x, nb.y)) return;
          a.ex = na.x;
          a.ey = na.y;
          b.ex = nb.x;
          b.ey = nb.y;
        } else if (elem.type === "curve") {
          const cx = (elem.x1 + elem.x2) / 2,
            cy = (elem.y1 + elem.y2) / 2;
          const n1 = rotatePointAround(elem.x1, elem.y1, cx, cy, deg);
          const n2 = rotatePointAround(elem.x2, elem.y2, cx, cy, deg);
          if (!inBoundsEcon(n1.x, n1.y) || !inBoundsEcon(n2.x, n2.y)) return;
          elem.x1 = n1.x;
          elem.y1 = n1.y;
          elem.x2 = n2.x;
          elem.y2 = n2.y;
          if (elem.cpx !== undefined) {
            const nc = rotatePointAround(elem.cpx, elem.cpy, cx, cy, deg);
            elem.cpx = nc.x;
            elem.cpy = nc.y;
          }
        }
      }

      function snapToGrid(ex, ey) {
        return {
          x: Math.round(ex),
          y: Math.round(ey),
        };
      }

      function formatTickVal(v) {
        return Number(v.toFixed(4)).toString();
      }

      function isInGrid(sx, sy) {
        return sx >= PL && sx <= SVG_W - PR && sy >= PT && sy <= SVG_H - PB;
      }

      function nextColor() {
        const used = new Set(state.elements.map((e) => e.color));
        for (const c of LINE_COLORS) if (!used.has(c)) return c;
        return LINE_COLORS[state.elements.length % LINE_COLORS.length];
      }

      function uid() {
        return state.nextId++;
      }

      function qBez(p0, cp, p1, t) {
        const mt = 1 - t;
        return {
          x: mt * mt * p0.x + 2 * mt * t * cp.x + t * t * p1.x,
          y: mt * mt * p0.y + 2 * mt * t * cp.y + t * t * p1.y,
        };
      }

      function qBezTan(p0, cp, p1, t) {
        const mt = 1 - t;
        return {
          x: 2 * mt * (cp.x - p0.x) + 2 * t * (p1.x - cp.x),
          y: 2 * mt * (cp.y - p0.y) + 2 * t * (p1.y - cp.y),
        };
      }

      function qBezEcon(el, t) {
        return qBez(
          {
            x: el.x1,
            y: el.y1,
          },
          econCurveCP(el),
          {
            x: el.x2,
            y: el.y2,
          },
          t,
        );
      }

      function scaleCurve(el, factor) {
        if (!(factor > 0)) return;
        const c =
          el.tanT !== undefined
            ? qBezEcon(el, el.tanT)
            : {
                x: (el.x1 + el.x2) / 2,
                y: (el.y1 + el.y2) / 2,
              };
        const s = (x, y) => ({
          x: c.x + (x - c.x) * factor,
          y: c.y + (y - c.y) * factor,
        });
        const p1 = s(el.x1, el.y1),
          p2 = s(el.x2, el.y2);
        el.x1 = p1.x;
        el.y1 = p1.y;
        el.x2 = p2.x;
        el.y2 = p2.y;
        if (el.cpx !== undefined && el.cpy !== undefined) {
          const pc = s(el.cpx, el.cpy);
          el.cpx = pc.x;
          el.cpy = pc.y;
        }
      }

      function pointDotHidden(pt) {
        let referenced = false;
        for (const e of state.elements) {
          if (e.type !== "line" || (e.p1Id !== pt.id && e.p2Id !== pt.id)) continue;
          referenced = true;
          if (!e.hideHandles) return false;
        }
        return referenced;
      }

      function curveCP(el) {
        if (el.cpx !== undefined && el.cpy !== undefined) return econToSVG(el.cpx, el.cpy);
        if (el.shape === "parabola" || el.shape === "parabola-down") {
          const c = econCurveCP(el);
          return econToSVG(c.x, c.y);
        }
        const p1 = econToSVG(el.x1, el.y1);
        const p2 = econToSVG(el.x2, el.y2);
        const mid = {
          x: (p1.x + p2.x) / 2,
          y: (p1.y + p2.y) / 2,
        };
        let cx, cy;
        if (el.shape === "convex") {
          cx = Math.min(p1.x, p2.x);
          cy = Math.max(p1.y, p2.y);
        } else if (el.shape === "increasing-convex") {
          cx = Math.max(p1.x, p2.x);
          cy = Math.max(p1.y, p2.y);
        } else if (el.shape === "increasing-concave") {
          cx = Math.min(p1.x, p2.x);
          cy = Math.min(p1.y, p2.y);
        } else {
          cx = Math.max(p1.x, p2.x);
          cy = Math.min(p1.y, p2.y);
        }
        const curv = el.curvature !== undefined ? el.curvature : 0.72;
        return {
          x: mid.x + (cx - mid.x) * curv,
          y: mid.y + (cy - mid.y) * curv,
        };
      }

      function curveConicCoeffs(el) {
        const P0 = {
            x: el.x1,
            y: el.y1,
          },
          P2 = {
            x: el.x2,
            y: el.y2,
          },
          Pc = econCurveCP(el);
        const a1 = P0.x - 2 * Pc.x + P2.x,
          b1 = 2 * (Pc.x - P0.x),
          c1 = P0.x;
        const a2 = P0.y - 2 * Pc.y + P2.y,
          b2 = 2 * (Pc.y - P0.y),
          c2 = P0.y;
        const denom = a2 * b1 - a1 * b2;
        if (Math.abs(denom) < 1e-7) return null;
        const A_ = a2 / denom,
          B_ = -a1 / denom,
          C_ = -(a2 * c1 - a1 * c2) / denom;
        if (Math.abs(a1) >= Math.abs(a2)) {
          return {
            A: a1 * A_ * A_,
            B: 2 * a1 * A_ * B_,
            C: a1 * B_ * B_,
            D: 2 * a1 * A_ * C_ + b1 * A_ - 1,
            E: 2 * a1 * B_ * C_ + b1 * B_,
            F: a1 * C_ * C_ + b1 * C_ + c1,
          };
        }
        return {
          A: a2 * A_ * A_,
          B: 2 * a2 * A_ * B_,
          C: a2 * B_ * B_,
          D: 2 * a2 * A_ * C_ + b2 * A_,
          E: 2 * a2 * B_ * C_ + b2 * B_ - 1,
          F: a2 * C_ * C_ + b2 * C_ + c2,
        };
      }

      function econCurveCP(el) {
        if (el.cpx !== undefined && el.cpy !== undefined)
          return {
            x: el.cpx,
            y: el.cpy,
          };
        const p1 = {
          x: el.x1,
          y: el.y1,
        };
        const p2 = {
          x: el.x2,
          y: el.y2,
        };
        const mid = {
          x: (p1.x + p2.x) / 2,
          y: (p1.y + p2.y) / 2,
        };
        let cx, cy;
        if (el.shape === "convex") {
          cx = Math.min(p1.x, p2.x);
          cy = Math.min(p1.y, p2.y);
        } else if (el.shape === "increasing-convex") {
          cx = Math.max(p1.x, p2.x);
          cy = Math.min(p1.y, p2.y);
        } else if (el.shape === "increasing-concave") {
          cx = Math.min(p1.x, p2.x);
          cy = Math.max(p1.y, p2.y);
        } else if (el.shape === "parabola" || el.shape === "parabola-down") {
          cx = mid.x;
          cy =
            mid.y +
            (el.shape === "parabola" ? -1 : 1) *
              2 *
              Math.abs(p1.x - p2.x) *
              (state.yScale / state.xScale);
        } else {
          cx = Math.max(p1.x, p2.x);
          cy = Math.max(p1.y, p2.y);
        }
        const curv = el.curvature !== undefined ? el.curvature : 0.72;
        return {
          x: mid.x + (cx - mid.x) * curv,
          y: mid.y + (cy - mid.y) * curv,
        };
      }

      function resolveBound(id) {
        if (id === "xaxis" || id === "yaxis") return id;
        return state.elements.find((e) => e.id === id);
      }

      function isShadeable(id) {
        if (id === "xaxis" || id === "yaxis") return true;
        const e = state.elements.find((x) => x.id === id);
        return !!e && (e.type === "line" || e.type === "curve");
      }

      function elemXRangeEcon(e) {
        if (e.type === "line") {
          const a = state.elements.find((p) => p.id === e.p1Id),
            b = state.elements.find((p) => p.id === e.p2Id);
          if (!a || !b) return null;
          return [Math.min(a.ex, b.ex), Math.max(a.ex, b.ex)];
        }
        if (e.type === "curve") return [Math.min(e.x1, e.x2), Math.max(e.x1, e.x2)];
        return null;
      }

      function elemYRangeEcon(e) {
        if (e.type === "line") {
          const a = state.elements.find((p) => p.id === e.p1Id),
            b = state.elements.find((p) => p.id === e.p2Id);
          if (!a || !b) return null;
          return [Math.min(a.ey, b.ey), Math.max(a.ey, b.ey)];
        }
        if (e.type === "curve") return [Math.min(e.y1, e.y2), Math.max(e.y1, e.y2)];
        return null;
      }

      function curveSamplesEcon(e) {
        const P0 = {
            x: e.x1,
            y: e.y1,
          },
          P2 = {
            x: e.x2,
            y: e.y2,
          },
          Pc = econCurveCP(e);
        const N = 100,
          pts = [];
        for (let i = 0; i <= N; i++) {
          const t = i / N,
            mt = 1 - t;
          pts.push({
            x: mt * mt * P0.x + 2 * mt * t * Pc.x + t * t * P2.x,
            y: mt * mt * P0.y + 2 * mt * t * Pc.y + t * t * P2.y,
          });
        }
        return pts;
      }

      function yAtX(boundRef, x) {
        if (boundRef === "xaxis") return 0;
        if (boundRef === "yaxis") return null;
        const e = boundRef;
        if (e.type === "line") {
          const a = state.elements.find((p) => p.id === e.p1Id),
            b = state.elements.find((p) => p.id === e.p2Id);
          if (!a || !b) return null;
          if (Math.abs(b.ex - a.ex) < 1e-9) return null;
          const t = (x - a.ex) / (b.ex - a.ex);
          if (t < -0.001 || t > 1.001) return null;
          return a.ey + (b.ey - a.ey) * t;
        }
        if (e.type === "curve") {
          const pts = curveSamplesEcon(e).sort((p, q) => p.x - q.x);
          if (x < pts[0].x - 1e-6 || x > pts[pts.length - 1].x + 1e-6) return null;
          for (let i = 0; i < pts.length - 1; i++) {
            if (x >= pts[i].x && x <= pts[i + 1].x) {
              const dxp = pts[i + 1].x - pts[i].x;
              const t = dxp > 1e-9 ? (x - pts[i].x) / dxp : 0;
              return pts[i].y + (pts[i + 1].y - pts[i].y) * t;
            }
          }
          return null;
        }
        return null;
      }

      function xAtY(boundRef, y) {
        if (boundRef === "yaxis") return 0;
        if (boundRef === "xaxis") return null;
        const e = boundRef;
        if (e.type === "line") {
          const a = state.elements.find((p) => p.id === e.p1Id),
            b = state.elements.find((p) => p.id === e.p2Id);
          if (!a || !b) return null;
          if (Math.abs(b.ey - a.ey) < 1e-9) return null;
          const t = (y - a.ey) / (b.ey - a.ey);
          if (t < -0.001 || t > 1.001) return null;
          return a.ex + (b.ex - a.ex) * t;
        }
        if (e.type === "curve") {
          const pts = curveSamplesEcon(e).sort((p, q) => p.y - q.y);
          if (y < pts[0].y - 1e-6 || y > pts[pts.length - 1].y + 1e-6) return null;
          for (let i = 0; i < pts.length - 1; i++) {
            if (y >= pts[i].y && y <= pts[i + 1].y) {
              const dyp = pts[i + 1].y - pts[i].y;
              const t = dyp > 1e-9 ? (y - pts[i].y) / dyp : 0;
              return pts[i].x + (pts[i + 1].x - pts[i].x) * t;
            }
          }
          return null;
        }
        return null;
      }

      function computeShadePolygonEcon(shade) {
        if (shade.region) {
          const r = computeRegion(shade.region);
          return r.poly || null;
        }
        const A = resolveBound(shade.boundA),
          B = resolveBound(shade.boundB);
        if (!A || !B) return null;
        const useY = A === "yaxis" || B === "yaxis";
        const N = 60,
          top = [],
          bot = [];
        if (useY) {
          const rA = A === "yaxis" ? [0, state.yScale] : elemYRangeEcon(A);
          const rB = B === "yaxis" ? [0, state.yScale] : elemYRangeEcon(B);
          if (!rA || !rB) return null;
          const lo = Math.max(rA[0], rB[0]),
            hi = Math.min(rA[1], rB[1]);
          if (hi <= lo) return null;
          for (let i = 0; i <= N; i++) {
            const y = lo + ((hi - lo) * i) / N;
            const xA = xAtY(A, y),
              xB = xAtY(B, y);
            if (xA == null || xB == null) continue;
            top.push({
              x: xA,
              y: y,
            });
            bot.push({
              x: xB,
              y: y,
            });
          }
        } else {
          const rA = A === "xaxis" ? [0, state.xScale] : elemXRangeEcon(A);
          const rB = B === "xaxis" ? [0, state.xScale] : elemXRangeEcon(B);
          if (!rA || !rB) return null;
          const lo = Math.max(rA[0], rB[0]),
            hi = Math.min(rA[1], rB[1]);
          if (hi <= lo) return null;
          for (let i = 0; i <= N; i++) {
            const x = lo + ((hi - lo) * i) / N;
            const yA = yAtX(A, x),
              yB = yAtX(B, x);
            if (yA == null || yB == null) continue;
            top.push({
              x: x,
              y: yA,
            });
            bot.push({
              x: x,
              y: yB,
            });
          }
        }
        if (top.length < 2) return null;
        return top.concat(bot.reverse());
      }

      function addShade(boundA, boundB) {
        pushUndo();
        const id = uid();
        state.elements.push({
          id: id,
          type: "shade",
          boundA: boundA,
          boundB: boundB,
          color: nextColor(),
          opacity: 0.3,
          label: "",
        });
        state.selectedId = id;
        state.selectedIds = new Set([id]);
        render();
      }

      // Auto regions: shades whose outline is derived from curves identified by their Name
      // (falling back to Label), recomputed on every render so they follow edits.
      const REGION_TYPES = {
        cs: { name: "Consumer surplus", label: "CS", color: "#3b82f6" },
        ps: { name: "Producer surplus", label: "PS", color: "#22a35a" },
        dwl: { name: "Deadweight loss", label: "DWL", color: "#f0a202" },
        tax: { name: "Tax revenue", label: "Tax revenue", color: "#8b5cf6" },
        profit: { name: "Profit", label: "Profit", color: "#e8575a" },
      };

      const ROLE_NAMES = ["Demand", "Supply", "Supply + tax", "MR", "MC", "AC", "Price"];

      const ROLE_ALIASES = {
        demand: ["demand", "d", "ar", "d=ar", "ar=d", "averagerevenue"],
        supply: ["supply", "s"],
        tax: ["supply+tax", "s+tax", "s+t", "tax", "taxedsupply", "supplywithtax", "s(tax)"],
        mr: ["mr", "marginalrevenue"],
        mc: ["mc", "marginalcost"],
        ac: ["ac", "atc", "averagecost", "averagetotalcost"],
        price: ["price", "p", "p=mr", "p=mr=ar", "p=ar=mr", "pricefloor", "priceceiling"],
      };

      function roleKey(s) {
        return (s || "")
          .toLowerCase()
          .replace(/[\s₀-₉]/g, "")
          .replace(/\d+$/, "");
      }

      function findRole(role) {
        const aliases = ROLE_ALIASES[role];
        const cands = state.elements.filter((e) => e.type === "line" || e.type === "curve");
        return (
          cands.find((e) => aliases.includes(roleKey(e.name))) ||
          cands.find((e) => !e.name && aliases.includes(roleKey(e.label))) ||
          null
        );
      }

      function priceLevel(e) {
        if (e.type === "curve") return (e.y1 + e.y2) / 2;
        const r = elemYRangeEcon(e);
        return r ? (r[0] + r[1]) / 2 : null;
      }

      // x where A and B cross, preferring the crossing where A falls below B
      // (demand/MR/price cutting supply/MC from above).
      function crossX(A, B) {
        const rA = elemXRangeEcon(A),
          rB = elemXRangeEcon(B);
        if (!rA || !rB) return null;
        const lo = Math.max(rA[0], rB[0]),
          hi = Math.min(rA[1], rB[1]);
        if (!(hi > lo)) return null;
        const diff = (x) => {
          const a = yAtX(A, x),
            b = yAtX(B, x);
          return a == null || b == null ? null : a - b;
        };
        const N = 400;
        let prevX = null,
          prevD = null,
          any = null;
        for (let i = 0; i <= N; i++) {
          const x = lo + ((hi - lo) * i) / N,
            d = diff(x);
          if (d == null) {
            prevD = null;
            continue;
          }
          if (prevD != null && Math.sign(prevD) !== Math.sign(d)) {
            let a = prevX,
              b = x,
              da = prevD;
            for (let k = 0; k < 40; k++) {
              const m = (a + b) / 2,
                dm = diff(m);
              if (dm == null) break;
              if (Math.sign(dm) === Math.sign(da)) {
                a = m;
                da = dm;
              } else b = m;
            }
            const root = (a + b) / 2;
            if (prevD > 0) return root;
            if (any == null) any = root;
          }
          prevX = x;
          prevD = d;
        }
        return any;
      }

      function analyzeMarket() {
        const D = findRole("demand"),
          S = findRole("supply"),
          T = findRole("tax"),
          MR = findRole("mr"),
          MC = findRole("mc"),
          AC = findRole("ac"),
          P = findRole("price");
        if (MC && (MR || P)) {
          const Q = MR ? crossX(MR, MC) : crossX(P, MC);
          if (Q == null) return { error: `${MR ? "MR" : "Price"} and MC don't intersect.` };
          const price = D ? yAtX(D, Q) : priceLevel(P);
          if (price == null)
            return { error: "Demand isn't defined at the profit-maximising quantity." };
          return { kind: "firm", Q, price, Pp: price, sup: MC, D, AC, Qo: D ? crossX(D, MC) : null };
        }
        if (D && S) {
          const Qe = crossX(D, S);
          if (Qe == null) return { error: "Demand and Supply don't intersect." };
          if (T) {
            const Qt = crossX(D, T);
            if (Qt == null) return { error: "Demand and Supply + tax don't intersect." };
            const Pc = yAtX(D, Qt),
              Pp = yAtX(S, Qt);
            if (Pp == null) return { error: "Supply isn't defined at the taxed quantity." };
            return { kind: "tax", Q: Qt, price: Pc, Pp, sup: S, D, Qo: Qe };
          }
          if (P) {
            const pl = priceLevel(P),
              qd = xAtY(D, pl),
              qs = xAtY(S, pl);
            if (qd == null || qs == null)
              return { error: "The Price line must cross both Demand and Supply." };
            return { kind: "control", Q: Math.min(qd, qs), price: pl, Pp: pl, sup: S, D, Qo: Qe };
          }
          return { kind: "market", Q: Qe, price: yAtX(D, Qe), Pp: yAtX(D, Qe), sup: S, D, Qo: Qe };
        }
        return {
          error:
            "Couldn't find the curves this region needs. Select each line or curve and set its Name (Element Properties) to Demand and Supply, or MR, MC and AC.",
        };
      }

      function computeRegion(type) {
        const m = analyzeMarket();
        if (m.error) return m;
        const band = (top, bot, x0, x1, clamp = true) => {
          const N = 60,
            T = [],
            B = [];
          for (let i = 0; i <= N; i++) {
            const x = x0 + ((x1 - x0) * i) / N;
            const yt = top(x);
            let yb = bot(x);
            if (yt == null || yb == null) continue;
            if (clamp && yb > yt) yb = yt;
            T.push({ x, y: yt });
            B.push({ x, y: yb });
          }
          return T.length < 2 ? null : T.concat(B.reverse());
        };
        const rect = (x0, x1, y0, y1) => [
          { x: x0, y: y0 },
          { x: x1, y: y0 },
          { x: x1, y: y1 },
          { x: x0, y: y1 },
        ];
        // Start where demand starts so bands and rectangles share a left edge.
        const x0 = m.D ? Math.max(0, elemXRangeEcon(m.D)[0]) : 0;
        let poly = null;
        if (type === "cs") {
          if (!m.D) return { error: "Consumer surplus needs a curve named Demand." };
          poly = band((x) => yAtX(m.D, x), () => m.price, x0, m.Q);
        } else if (type === "ps") {
          poly = band(() => m.Pp, (x) => yAtX(m.sup, x), x0, m.Q);
        } else if (type === "dwl") {
          if (m.kind === "market")
            return {
              error:
                "There's no deadweight loss at the free-market equilibrium. Add a line named Supply + tax or Price, or use MR and MC.",
            };
          if (!m.D || m.Qo == null)
            return {
              error: `Deadweight loss needs Demand to cross ${m.kind === "firm" ? "MC" : "Supply"}.`,
            };
          const lo = Math.min(m.Q, m.Qo),
            hi = Math.max(m.Q, m.Qo);
          if (hi - lo < 1e-6) return { error: "No deadweight loss: output is already efficient." };
          poly = band((x) => yAtX(m.D, x), (x) => yAtX(m.sup, x), lo, hi, false);
        } else if (type === "tax") {
          if (m.kind !== "tax")
            return {
              error: "Tax revenue needs curves named Demand, Supply and Supply + tax.",
            };
          poly = rect(x0, m.Q, m.Pp, m.price);
        } else if (type === "profit") {
          if (m.kind !== "firm" || !m.AC)
            return { error: "Profit needs curves named MC, AC and either MR (with Demand) or Price." };
          const ac = yAtX(m.AC, m.Q);
          if (ac == null) return { error: "AC isn't defined at the profit-maximising quantity." };
          poly = rect(x0, m.Q, ac, m.price);
        }
        return poly ? { poly } : { error: "This region is empty for the current graph." };
      }

      function addRegion(type, hatch) {
        const info = REGION_TYPES[type];
        const r = computeRegion(type);
        if (!r.poly) {
          showPopup(info.name, r.error, [{ label: "OK", cls: "primary", fn: closePopup }]);
          return;
        }
        pushUndo();
        const id = uid();
        state.elements.push({
          id: id,
          type: "shade",
          region: type,
          color: info.color,
          opacity: hatch ? 0.4 : 0.3,
          hatch: !!hatch,
          label: info.label,
        });
        setMode("select");
        selectEl(id);
      }

      function drawShade(elem) {
        const poly = computeShadePolygonEcon(elem);
        if (!poly) return;
        const sel = state.selectedIds.has(elem.id);
        const svgPts = poly.map((p) => econToSVG(p.x, p.y));
        const d = "M" + svgPts.map((p) => `${p.x},${p.y}`).join("L") + "Z";
        const g = el("g", {
          "data-id": elem.id,
          cursor: "pointer",
        });
        const col = elem.color || "#00aedb";
        const op = elem.opacity !== undefined ? elem.opacity : 0.3;
        if (elem.hatch) {
          const pid = `hatch-${elem.id}`;
          const defs = el("defs");
          const pat = el("pattern", {
            id: pid,
            patternUnits: "userSpaceOnUse",
            width: 8,
            height: 8,
            patternTransform: "rotate(45)",
          });
          pat.appendChild(
            el("line", {
              x1: 0,
              y1: 0,
              x2: 0,
              y2: 8,
              stroke: col,
              "stroke-width": 1.6,
              "stroke-opacity": Math.min(1, op * 2.5),
            }),
          );
          defs.appendChild(pat);
          g.appendChild(defs);
          g.appendChild(
            el("path", {
              d: d,
              fill: `url(#${pid})`,
              stroke: col,
              "stroke-opacity": Math.min(1, op * 2.5),
              "stroke-width": 1,
              "pointer-events": "all",
            }),
          );
        } else {
          g.appendChild(
            el("path", {
              d: d,
              fill: col,
              "fill-opacity": op,
              stroke: "none",
              "pointer-events": "all",
            }),
          );
        }
        if (sel) {
          g.appendChild(
            el("path", {
              d: d,
              fill: "none",
              stroke: "rgba(30,130,255,0.7)",
              "stroke-width": 2,
              "pointer-events": "none",
            }),
          );
        }
        if (elem.label) {
          const cx = svgPts.reduce((s, p) => s + p.x, 0) / svgPts.length;
          const cy = svgPts.reduce((s, p) => s + p.y, 0) / svgPts.length;
          const lox = elem.lox !== undefined ? elem.lox : 0,
            loy = elem.loy !== undefined ? elem.loy : 0;
          const lx = cx + lox,
            ly = cy + loy;
          const lbl = txt(
            "text",
            {
              x: lx,
              y: ly,
              class: "svg-lbl",
              "font-size": 13,
              fill: elem.color || "#00aedb",
              "text-anchor": "middle",
              style: "cursor:move;pointer-events:all",
              ...labelAttrs(elem, lx, ly),
            },
            elem.label,
          );
          lbl.addEventListener("mousedown", (e) => startLabelDrag(elem, 0, 0, e));
          g.appendChild(lbl);
        }
        g.addEventListener("click", (e) => {
          if (state.mode !== "select") return;
          e.stopPropagation();
          if (e.ctrlKey || e.metaKey) return;
          selectEl(elem.id);
        });
        svg.appendChild(g);
      }

      function curvePath(el) {
        const p1 = econToSVG(el.x1, el.y1);
        const p2 = econToSVG(el.x2, el.y2);
        const cp = curveCP(el);
        return `M${p1.x},${p1.y} Q${cp.x},${cp.y} ${p2.x},${p2.y}`;
      }

      const SVGNS = "http://www.w3.org/2000/svg";

      function el(tag, attrs = {}) {
        const e = document.createElementNS(SVGNS, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
        return e;
      }

      function txt(tag, attrs, content) {
        const e = el(tag, attrs);
        e.textContent = content;
        return e;
      }

      const svg = document.getElementById("main-svg");

      svg.setAttribute("width", SVG_W);

      svg.setAttribute("height", SVG_H);

      svg.setAttribute("viewBox", `0 0 ${SVG_W} ${SVG_H}`);

      function render() {
        renderCanvas();
        renderLeftSidebar();
        syncToolbarButtons();
      }

      function renderCanvas() {
        svg.innerHTML = "";
        svg.appendChild(
          el("rect", {
            x: 0,
            y: 0,
            width: SVG_W,
            height: SVG_H,
            fill: "transparent",
          }),
        );
        svg.appendChild(
          el("rect", {
            x: PL,
            y: PT,
            width: GW,
            height: GH,
            fill: state.bgColor,
          }),
        );
        if (state.showGrid) {
          const g = el("g");
          const xs = state.xScale;
          const ys = state.yScale;
          for (let i = 0; i <= xs; i++) {
            const x = PL + (i / state.xScale) * GW;
            g.appendChild(
              el("line", {
                x1: x,
                y1: PT,
                x2: x,
                y2: SVG_H - PB,
                stroke: state.gridColor,
                "stroke-width": 1,
              }),
            );
          }
          for (let i = 0; i <= ys; i++) {
            const y = PT + (i / state.yScale) * GH;
            g.appendChild(
              el("line", {
                x1: PL,
                y1: y,
                x2: SVG_W - PR,
                y2: y,
                stroke: state.gridColor,
                "stroke-width": 1,
              }),
            );
          }
          svg.appendChild(g);
        }
        if (state.selectedIds.has("xaxis")) {
          svg.appendChild(
            el("line", {
              x1: PL,
              y1: SVG_H - PB,
              x2: SVG_W - PR,
              y2: SVG_H - PB,
              stroke: "rgba(30,130,255,0.35)",
              "stroke-width": 9,
              "stroke-linecap": "round",
            }),
          );
        }
        if (state.selectedIds.has("yaxis")) {
          svg.appendChild(
            el("line", {
              x1: PL,
              y1: PT,
              x2: PL,
              y2: SVG_H - PB,
              stroke: "rgba(30,130,255,0.35)",

              "stroke-linecap": "round",
            }),
          );
        }
        svg.appendChild(
          el("line", {
            x1: PL,
            y1: SVG_H - PB,
            x2: SVG_W - PR,
            y2: SVG_H - PB,

            "stroke-width": 2,
          }),
        );
        svg.appendChild(
          el("line", {
            x1: PL,
            y1: PT,
            x2: PL,
            y2: SVG_H - PB,
            stroke: "#222",
            "stroke-width": 2,
          }),
        );
        svg.appendChild(
          el("polygon", {
            points: `${SVG_W - PR},${SVG_H - PB} ${SVG_W - PR - 7},${SVG_H - PB - 4} ${SVG_W - PR - 7},${SVG_H - PB + 4}`,
            fill: "#222",
          }),
        );
        svg.appendChild(
          el("polygon", {
            points: `${PL},${PT} ${PL - 4},${PT + 7} ${PL + 4},${PT + 7}`,
            fill: "#222",
          }),
        );
        const xLabelY = state.xTicks.enabled ? SVG_H - PB + 31 : SVG_H - PB + 18;
        svg.appendChild(
          txt(
            "text",
            {
              x: (PL + SVG_W - PR) / 2,
              y: xLabelY,
              "text-anchor": "middle",
              "font-family": "Prompt,sans-serif",
              "font-size": 14,
              "font-style": "italic",
              fill: "#333",
            },
            state.xLabel,
          ),
        );
        const yLabelX = state.yTicks.enabled ? 18 : 36;
        svg.appendChild(
          txt(
            "text",
            {
              x: yLabelX,
              y: SVG_H / 2,
              "text-anchor": "middle",
              "font-family": "Prompt,sans-serif",
              "font-size": 14,
              "font-style": "italic",
              fill: "#333",
              transform: `rotate(-90,${yLabelX},${SVG_H / 2})`,
            },
            state.yLabel,
          ),
        );
        if (state.xTicks.enabled) {
          const { start: start, end: end, step: step } = state.xTicks;
          if (step > 0 && end > start) {
            const n = Math.floor((end - start) / step + 1e-9);
            for (let i = 0; i <= n; i++) {
              const val = start + i * step;
              const ex = ((val - start) / (end - start)) * state.xScale;
              const sx = econToSVG(ex, 0).x;
              svg.appendChild(
                el("line", {
                  x1: sx,
                  y1: SVG_H - PB,
                  x2: sx,
                  y2: SVG_H - PB + 5,
                  stroke: "#222",
                  "stroke-width": 1,
                }),
              );
              svg.appendChild(
                txt(
                  "text",
                  {
                    x: sx,
                    y: SVG_H - PB + 17,
                    "text-anchor": "middle",
                    "font-size": 10,
                    fill: "#555",
                    "font-family": "Prompt,sans-serif",
                  },
                  formatTickVal(val),
                ),
              );
            }
          }
        }
        if (state.yTicks.enabled) {
          const { start: start, end: end, step: step } = state.yTicks;
          if (step > 0 && end > start) {
            const n = Math.floor((end - start) / step + 1e-9);
            for (let i = 0; i <= n; i++) {
              const val = start + i * step;
              const ey = ((val - start) / (end - start)) * state.yScale;
              const sy = econToSVG(0, ey).y;
              svg.appendChild(
                el("line", {
                  x1: PL - 5,
                  y1: sy,
                  x2: PL,
                  y2: sy,
                  stroke: "#222",
                  "stroke-width": 1,
                }),
              );
              svg.appendChild(
                txt(
                  "text",
                  {
                    x: PL - 8,
                    y: sy + 3,
                    "text-anchor": "end",
                    "font-size": 10,
                    fill: "#555",
                    "font-family": "Prompt,sans-serif",
                  },
                  formatTickVal(val),
                ),
              );
            }
          }
        }
        state.elements.forEach((elem) => {
          if (elem.type === "curve" && elem.lineId !== undefined) resolveTangentCurveGeometry(elem);
        });
        state.elements.filter((e) => e.type === "shade").forEach(drawShade);
        state.elements.filter((e) => e.type === "point" && e.guides).forEach(drawPointGuides);
        const order = ["curve", "line", "tangent", "point", "text"];
        const sorted = [...state.elements]
          .filter((e) => e.type !== "shade")
          .sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));
        sorted.forEach(drawElement);
        if (state.mode === "line" && state.lineFirstId && state._mousePos) {
          const fp = state.elements.find((e) => e.id === state.lineFirstId);
          if (fp && fp.type === "point") {
            const p1 = econToSVG(fp.ex, fp.ey);
            const g = el("g", {
              opacity: 0.5,
              "pointer-events": "none",
            });
            const end = state._crosshair || state._mousePos;
            g.appendChild(
              el("line", {
                x1: p1.x,
                y1: p1.y,
                x2: end.x,
                y2: end.y,
                stroke: "#888",
                "stroke-width": 1.5,
                "stroke-dasharray": "6 4",
              }),
            );
            svg.appendChild(g);
          }
        }
        if (state._crosshair && isInGrid(state._crosshair.x, state._crosshair.y)) {
          const { x: x, y: y } = state._crosshair;
          const g = el("g", {
            opacity: 0.4,
            "pointer-events": "none",
          });
          g.appendChild(
            el("line", {
              x1: x,
              y1: PT,
              x2: x,
              y2: SVG_H - PB,
              stroke: "#46525f",
              "stroke-width": 1,
              "stroke-dasharray": "4 3",
            }),
          );
          g.appendChild(
            el("line", {
              x1: PL,
              y1: y,
              x2: SVG_W - PR,
              y2: y,
              stroke: "#46525f",
              "stroke-width": 1,
              "stroke-dasharray": "4 3",
            }),
          );
          svg.appendChild(g);
        }
        if (marquee) {
          const x = Math.min(marquee.startSP.x, marquee.curSP.x),
            y = Math.min(marquee.startSP.y, marquee.curSP.y);
          const w = Math.abs(marquee.curSP.x - marquee.startSP.x),
            h = Math.abs(marquee.curSP.y - marquee.startSP.y);
          svg.appendChild(
            el("rect", {
              x: x,
              y: y,
              width: w,
              height: h,
              fill: "rgba(70,82,95,0.15)",
              stroke: "#46525f",
              "stroke-width": 1,
              "stroke-dasharray": "4 3",
              "pointer-events": "none",
            }),
          );
        }
        refreshEquationBox();
      }

      function drawPointGuides(elem) {
        const p = econToSVG(elem.ex, elem.ey);
        const o = econToSVG(0, 0);
        const g = el("g", {
          stroke: elem.guideColor || "#8a8a8a",
          "stroke-width": 1.2,
          "stroke-dasharray": "5 4",
          "pointer-events": "none",
        });
        if (elem.ey > 1e-9) g.appendChild(el("line", { x1: p.x, y1: p.y, x2: p.x, y2: o.y }));
        if (elem.ex > 1e-9) g.appendChild(el("line", { x1: p.x, y1: p.y, x2: o.x, y2: p.y }));
        svg.appendChild(g);
      }

      function labelAttrs(elem, x, y) {
        const rot = elem.labelRotation || 0;
        return rot
          ? {
              transform: `rotate(${rot},${x},${y})`,
            }
          : {};
      }

      function drawElement(elem) {
        const sel = state.selectedIds.has(elem.id);
        if (elem.type === "curve") {
          const isTangentCurve = elem.lineId !== undefined;
          const g = el("g", {
            "data-id": elem.id,
            cursor: isTangentCurve ? "ew-resize" : "move",
            "pointer-events": "all",
          });
          const d = curvePath(elem);
          const col = elem.color || "#00aedb";
          const th = elem.thickness || 2;
          const da = elem.dotted ? "8 5" : "none";
          if (sel) {
            g.appendChild(
              el("path", {
                d: d,
                stroke: "rgba(30,130,255,0.28)",
                "stroke-width": th + 10,
                fill: "none",
                "stroke-linecap": "round",
              }),
            );
          }
          g.appendChild(
            el("path", {
              d: d,
              stroke: "rgba(0,0,0,0)",
              "stroke-width": 14,
              fill: "none",
              "pointer-events": "stroke",
            }),
          );
          g.appendChild(
            el("path", {
              d: d,
              stroke: col,
              "stroke-width": th,
              fill: "none",
              "stroke-dasharray": da,
              "stroke-linecap": "round",
            }),
          );
          g.addEventListener("mousedown", handleMousedown);
          const p1s = econToSVG(elem.x1, elem.y1),
            p2s = econToSVG(elem.x2, elem.y2);
          if (!isTangentCurve && !elem.hideHandles) {
            [
              [p1s, "h1"],
              [p2s, "h2"],
            ].forEach(([p, hid]) => {
              const hg = el("g", {
                "data-id": elem.id,
                "data-h": hid,
                cursor: "grab",
              });
              hg.appendChild(
                el("circle", {
                  cx: p.x,
                  cy: p.y,
                  r: 8,
                  fill: "rgba(255,255,255,0.8)",
                  stroke: col,
                  "stroke-width": 1.5,
                }),
              );
              hg.appendChild(
                el("circle", {
                  cx: p.x,
                  cy: p.y,
                  r: 3,
                  fill: col,
                }),
              );
              hg.addEventListener("mousedown", handleMousedown);
              g.appendChild(hg);
            });
          }
          if (elem.label) {
            const mid = qBez(p1s, curveCP(elem), p2s, 0.5);
            const lox = elem.lox !== undefined ? elem.lox : 10,
              loy = elem.loy !== undefined ? elem.loy : -7;
            const lx = mid.x + lox,
              ly = mid.y + loy;
            const lbl = txt(
              "text",
              {
                x: lx,
                y: ly,
                class: "svg-lbl",
                "font-size": 13,
                fill: elem.labelColor || col,
                style: "cursor:move;pointer-events:all",
                ...labelAttrs(elem, lx, ly),
              },
              elem.label,
            );
            lbl.addEventListener("mousedown", (e) => startLabelDrag(elem, 10, -7, e));
            g.appendChild(lbl);
          }
          g.addEventListener("click", (e) => {
            if (state.mode !== "select") return;
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) return;
            selectEl(elem.id);
          });
          svg.appendChild(g);
        } else if (elem.type === "line") {
          const a = state.elements.find((e) => e.id === elem.p1Id);
          const b = state.elements.find((e) => e.id === elem.p2Id);
          if (!a || !b) return;
          const p1 = econToSVG(a.ex, a.ey),
            p2 = econToSVG(b.ex, b.ey);
          const col = elem.color || "#00aedb",
            th = elem.thickness || 2;
          const da = elem.dotted ? "8 5" : "none";
          const g = el("g", {
            "data-id": elem.id,
            cursor: "move",
            "pointer-events": "all",
          });
          if (sel) {
            g.appendChild(
              el("line", {
                x1: p1.x,
                y1: p1.y,
                x2: p2.x,
                y2: p2.y,
                stroke: "rgba(30,130,255,0.28)",
                "stroke-width": th + 10,
                "stroke-linecap": "round",
              }),
            );
          }
          g.appendChild(
            el("line", {
              x1: p1.x,
              y1: p1.y,
              x2: p2.x,
              y2: p2.y,
              stroke: "rgba(0,0,0,0)",
              "stroke-width": 14,
              "pointer-events": "stroke",
            }),

          g.appendChild(
            el("line", {
              x1: p1.x,
              y1: p1.y,
              x2: p2.x,

              stroke: col,
              "stroke-width": th,
              "stroke-dasharray": da,
              "stroke-linecap": "round",
            }),
          );
          g.addEventListener("mousedown", handleMousedown);
          if (elem.label) {
            const lox = elem.lox !== undefined ? elem.lox : 8,
              loy = elem.loy !== undefined ? elem.loy : -6;
            const mx = (p1.x + p2.x) / 2 + lox,
              my = (p1.y + p2.y) / 2 + loy;
            const lbl = txt(
              "text",
              {
                x: mx,
                y: my,
                class: "svg-lbl",
                "font-size": 13,
                fill: elem.labelColor || col,
                style: "cursor:move;pointer-events:all",
                ...labelAttrs(elem, mx, my),
              },
              elem.label,

              loy = elem.loy !== undefined ? elem.loy : -8;

          g.addEventListener("click", (e) => {

            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) return;

        } else if (elem.type === "point") {
          const p = econToSVG(elem.ex, elem.ey);

            sz = elem.size || 5;
          const g = el("g", {
            "data-id": elem.id,
            cursor: "move",

          if (sel) {
            g.appendChild(
              el("circle", {

          if (!pointDotHidden(elem)) {
            g.appendChild(
              el("circle", {
                cx: p.x,
                cy: p.y,
                r: sz,
                fill: col,
                stroke: "white",
                "stroke-width": 1.8,
              }),
            );
          }
          if (elem.label) {
            const ox = elem.lox !== undefined ? elem.lox : 9,
              oy = elem.loy !== undefined ? elem.loy : -9;
            const lx = p.x + ox,
              ly = p.y + oy;
            const lbl = txt(
              "text",
              {
                x: lx,
                y: ly,
                class: "svg-lbl",
                "font-size": 13,
                fill: elem.labelColor || col,
                style: "cursor:move;pointer-events:all",

          g.addEventListener("mousedown", handleMousedown);
          g.addEventListener("click", (e) => {
            if (state.mode !== "select") return;
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) return;

          });
          svg.appendChild(g);
        } else if (elem.type === "text") {
          const p = econToSVG(elem.ex, elem.ey);
          const g = el("g", {
            "data-id": elem.id,
            cursor: "move",
          });
          const rot = elem.labelRotation || 0;
          const attrs = {
            x: p.x,
            y: p.y,

            style: "cursor:move;pointer-events:all",

      let drag = null;

      let marquee = null;

      function handleMousedown(e) {
        if (e.button !== 0) return;
        if (state.mode !== "select") return;
        e.stopPropagation();
        const sp = getSVGPt(e);
        const tid = parseInt(e.currentTarget.getAttribute("data-id"));
        const h = e.currentTarget.getAttribute("data-h");
        const elem = state.elements.find((x) => x.id === tid);
        if (!elem) return;
        if (e.ctrlKey || e.metaKey) {
          selectElMaybeAdd(tid, e);
          e.preventDefault();
          return;
        }

          drag = {
            type: "point",
            id: tid,
            startSP: sp,
            origEx: elem.ex,
            origEy: elem.ey,
          };
        } else if (elem.type === "curve" && h) {
          drag = {
            type: "curve-h",
            id: tid,
            h: h,
            startSP: sp,
            ox1: elem.x1,
            oy1: elem.y1,
            ox2: elem.x2,
            oy2: elem.y2,
          };
        } else if (elem.type === "curve" && !h && elem.lineId !== undefined) {
          drag = {
            type: "tangentcurve-slide",
            id: tid,
          };
        } else if (elem.type === "curve" && !h && elem.slideLineId !== undefined) {
          drag = {
            type: "curve-slide",
            id: tid,
          };
        } else if (elem.type === "curve" && !h) {
          drag = {
            type: "curve-body",
            id: tid,
            startSP: sp,
            ox1: elem.x1,
            oy1: elem.y1,
            ox2: elem.x2,
            oy2: elem.y2,
            ocpx: elem.cpx,
            ocpy: elem.cpy,
          };
        } else if (elem.type === "line" && !h) {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return;
          drag = {
            type: "line-body",
            id: tid,
            startSP: sp,
            origAex: a.ex,
            origAey: a.ey,
            origBex: b.ex,
            origBey: b.ey,
          };
        } else if (elem.type === "tangent" && h === "t") {
          drag = {
            type: "tangent-t",
            id: tid,
            startSP: sp,
          };
        } else if (elem.type === "tangent" && (h === "eA" || h === "eB")) {
          drag = {
            type: "tangent-ext",
            id: tid,
            h: h,
          };
        }
        selectEl(tid);
        e.preventDefault();
      }

      function startLabelDrag(elem, defOx, defOy, e) {
        if (e.button !== 0) return;
        if (state.mode !== "select") return;
        e.stopPropagation();
        const sp = getSVGPt(e);
        drag = {
          type: "label",
          id: elem.id,
          startSP: sp,
          origLox: elem.lox !== undefined ? elem.lox : defOx,
          origLoy: elem.loy !== undefined ? elem.loy : defOy,
        };
        selectEl(elem.id);
        e.preventDefault();
      }

      function lineIntersect(p1, p2, p3, p4) {
        const d1x = p2.x - p1.x,
          d1y = p2.y - p1.y;
        const d2x = p4.x - p3.x,
          d2y = p4.y - p3.y;
        const denom = d1x * d2y - d1y * d2x;
        if (Math.abs(denom) < 1e-9) return null;
        const t = ((p3.x - p1.x) * d2y - (p3.y - p1.y) * d2x) / denom;
        const u = ((p3.x - p1.x) * d1y - (p3.y - p1.y) * d1x) / denom;
        if (t < 0 || t > 1 || u < 0 || u > 1) return null;
        return {
          x: p1.x + t * d1x,
          y: p1.y + t * d1y,
        };
      }

      function polySegs(pts) {
        const out = [];
        for (let i = 0; i < pts.length - 1; i++) out.push([pts[i], pts[i + 1]]);
        return out;
      }

      function elemGeo(elem) {
        if (elem.type === "line") {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return null;
          return {
            kind: "segment",
            p1: econToSVG(a.ex, a.ey),
            p2: econToSVG(b.ex, b.ey),
          };
        }
        if (elem.type === "curve") {
          const p1 = econToSVG(elem.x1, elem.y1),
            p2 = econToSVG(elem.x2, elem.y2);
          const cp = curveCP(elem);
          const pts = [];
          for (let t = 0; t <= 1; t += 0.05) pts.push(qBez(p1, cp, p2, t));
          return {
            kind: "poly",
            pts: pts,
          };
        }
        return null;
      }

      function findIntersections() {
        const geos = state.elements.map(elemGeo).filter(Boolean);
        const pts = [];
        for (let i = 0; i < geos.length; i++) {
          for (let j = i + 1; j < geos.length; j++) {
            const A = geos[i],
              B = geos[j];
            const segsA = A.kind === "segment" ? [[A.p1, A.p2]] : polySegs(A.pts);
            const segsB = B.kind === "segment" ? [[B.p1, B.p2]] : polySegs(B.pts);
            for (const [a1, a2] of segsA) {
              for (const [b1, b2] of segsB) {
                const ip = lineIntersect(a1, a2, b1, b2);
                if (ip) pts.push(ip);
              }
            }
          }
        }
        return pts;
      }

      function nearestPointOnSeg(px, py, ax, ay, bx, by) {
        const dx = bx - ax,
          dy = by - ay,
          l2 = dx * dx + dy * dy;
        if (!l2)
          return {
            x: ax,
            y: ay,
          };
        const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
        return {
          x: ax + t * dx,
          y: ay + t * dy,
        };
      }

      function computeSnapTarget(sx, sy, excludeId) {
        const r = svg.getBoundingClientRect();
        const scale = r.width ? r.width / SVG_W : 1;
        const thresh = 20 / scale;
        const nearestOf = (cands) => {
          let best = null,
            bestD = thresh;
          for (const c of cands) {
            const d = Math.hypot(c.x - sx, c.y - sy);
            if (d < bestD) {
              bestD = d;
              best = c;
            }
          }
          return best;
        };
        const xing = nearestOf(findIntersections());
        if (xing)
          return {
            x: xing.x,
            y: xing.y,
          };
        const named = nearestOf(
          state.elements
            .filter((pe) => pe.type === "point" && pe.id !== excludeId)
            .map((pe) => econToSVG(pe.ex, pe.ey)),
        );
        if (named)
          return {
            x: named.x,
            y: named.y,
          };
        let bestPt = null,
          bestD = thresh;
        state.elements.forEach((elem) => {
          if (elem.id === excludeId) return;
          if (elem.type === "line") {
            const a = state.elements.find((x) => x.id === elem.p1Id);
            const b = state.elements.find((x) => x.id === elem.p2Id);
            if (!a || !b) return;
            const p1 = econToSVG(a.ex, a.ey),
              p2 = econToSVG(b.ex, b.ey);
            const proj = nearestPointOnSeg(sx, sy, p1.x, p1.y, p2.x, p2.y);
            const d = Math.hypot(proj.x - sx, proj.y - sy);
            if (d < bestD) {
              bestD = d;
              bestPt = proj;
            }
          } else if (elem.type === "curve") {
            const p1 = econToSVG(elem.x1, elem.y1),
              p2 = econToSVG(elem.x2, elem.y2);
            const cp = curveCP(elem);
            for (let t = 0; t <= 1; t += 0.01) {
              const pt = qBez(p1, cp, p2, t);
              const d = Math.hypot(pt.x - sx, pt.y - sy);
              if (d < bestD) {
                bestD = d;
                bestPt = pt;
              }
            }
          }
        });
        return bestPt
          ? {
              x: bestPt.x,
              y: bestPt.y,
            }
          : null;
      }

      function resolveSnap(sx, sy, e, excludeId) {
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && state.mode === "line" && state.lineFirstId) {
          const fp = state.elements.find((x) => x.id === state.lineFirstId);
          if (fp && fp.type === "point") {
            const a = econToSVG(fp.ex, fp.ey);
            return Math.abs(sx - a.x) >= Math.abs(sy - a.y)

                  y: a.y,

                  y: sy,
                };

          return (
            computeSnapTarget(sx, sy, excludeId) || {

          const ep = svgToEcon(sx, sy);
          const g = snapToGrid(ep.x, ep.y);
          return econToSVG(g.x, g.y);

        return {
          x: sx,
          y: sy,
        };

      svg.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        // Shift/Ctrl+Shift clicks while drawing would otherwise extend the page's text
        // selection across the axis labels.
        if (state.mode !== "select") {
          e.preventDefault();
          return;
        }

        const near = nearestElement(sp.x, sp.y);

          curSP: sp,
          additive: additive,

        e.preventDefault();
        if (drag.type === "point") {

          if (!elem) return;
          const placeSVG = e.shiftKey && state._crosshair ? state._crosshair : targetSVG;

          elem.ey = ep.y;

        } else if (drag.type === "curve-h") {
          const elem = state.elements.find((x) => x.id === drag.id);

          const isH1 = drag.h === "h1";
          const placeSVG = e.shiftKey && state._crosshair ? state._crosshair : targetSVG;

          a.ey = epA.y;
          b.ex = epB.x;
          b.ey = epB.y;

          const elem = state.elements.find((x) => x.id === drag.id);

            origP2 = econToSVG(drag.ox2, drag.oy2);

            dy = sp.y - drag.startSP.y;

          ep2 = clampEcon(ep2.x, ep2.y);

              dey = ep1.y - drag.oy1;
            elem.cpx = drag.ocpx + dex;
            elem.cpy = drag.ocpy + dey;
