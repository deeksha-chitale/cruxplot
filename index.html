function doExport(transparent) {
  const scale=2;
  const origBg=state.bgColor;
  const origGrid=state.showGrid;
  if (transparent) { state.bgColor='transparent'; }

  // Temporarily deselect for clean export
  const origSel=state.selectedId;
  const origSelIds=state.selectedIds;
  clearSelection();
  render();

  const serializer=new XMLSerializer();
  // Add xmlns for fonts
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');

  const svgStr=`<?xml version="1.0" encoding="UTF-8"?>` + serializer.serializeToString(clone);
  const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);

  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=SVG_W*scale; canvas.height=SVG_H*scale;
    const ctx=canvas.getContext('2d');
    if (!transparent) { ctx.fillStyle=origBg; ctx.fillRect(0,0,canvas.width,canvas.height); }
    ctx.scale(scale,scale);
    ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    const link=document.createElement('a');
    link.download='cruxplot-graph.png';
    link.href=canvas.toDataURL('image/png');
    link.click();

    // Restore
    state.bgColor=origBg;
    state.selectedId=origSel;
    state.selectedIds=origSelIds;
    render();
  };
  img.onerror=()=>{
    URL.revokeObjectURL(url);
    state.bgColor=origBg;
    state.selectedId=origSel;
    state.selectedIds=origSelIds;
    render();
    alert('Export failed. Try right-clicking the graph and "Save as image".');
  };
  img.src=url;
}

/* =====================================================================
   EQUATION EDITOR (per-element, editable, live-synced with geometry)
   ===================================================================== */
function numFmt(v) {
  return (Math.round(v*100)/100).toString();
}
function numFmtSig(v, sig=4) {
  if (Math.abs(v) < 1e-9) return '0';
  return parseFloat(v.toPrecision(sig)).toString();
}
function buildConicString(co) {
  const terms = [[co.A,'x^2'],[co.B,'xy'],[co.C,'y^2'],[co.D,'x'],[co.E,'y']];
  let out='';
  terms.forEach(([coef,label])=>{
    if (Math.abs(coef) < 1e-9) return;
    const absC=Math.abs(coef);
    const coefStr = Math.abs(absC-1)<1e-6 ? '' : numFmtSig(absC);
    if (out==='') {
      out = (coef<0?'-':'') + coefStr + label;
    } else {
      out += ` ${coef<0?'-':'+'} ${coefStr}${label}`;
    }
  });
  if (Math.abs(co.F) > 1e-9 || out==='') {
    const val=numFmtSig(Math.abs(co.F));
    out += out==='' ? ((co.F<0?'-':'')+val) : ` ${co.F<0?'-':'+'} ${val}`;
  }
  return out + ' = 0';
}
function parseConicSide(s) {
  s = s.replace(/\s+/g,'');
  if (s==='') return {A:0,B:0,C:0,D:0,E:0,F:0};
  if (s[0]!=='+' && s[0]!=='-') s='+'+s;
  const termRe=/([+-])(\d*\.?\d*)(x\^2|y\^2|xy|yx|x|y)?/g;
  const co={A:0,B:0,C:0,D:0,E:0,F:0};
  let m;
  while ((m=termRe.exec(s))!==null) {
    if (m[0]==='') { termRe.lastIndex++; continue; }
    const sign=m[1]==='-'?-1:1;
    const coef=(m[2]===''?1:parseFloat(m[2]))*sign;
    const v=m[3];
    if (!v) co.F+=coef;
    else if (v==='x^2') co.A+=coef;
    else if (v==='y^2') co.C+=coef;
    else if (v==='xy'||v==='yx') co.B+=coef;
    else if (v==='x') co.D+=coef;
    else if (v==='y') co.E+=coef;
  }
  return co;
}
function parseConicString(str) {
  const s=str.trim();
  if (!s) return null;
  let lhsStr=s, rhsStr='0';
  if (s.includes('=')) {
    const parts=s.split('=');
    if (parts.length!==2) return null;
    lhsStr=parts[0]; rhsStr=parts[1];
  }
  const lhs=parseConicSide(lhsStr), rhs=parseConicSide(rhsStr);
  const co={};
  ['A','B','C','D','E','F'].forEach(k=>co[k]=lhs[k]-rhs[k]);
  const anyNonzero=Object.values(co).some(v=>Math.abs(v)>1e-12);
  return anyNonzero ? co : null;
}
function solveConicForY(co, x, preferNearY) {
  const a=co.C, b=co.B*x+co.E, c=co.A*x*x+co.D*x+co.F;
  if (Math.abs(a) < 1e-9) {
    if (Math.abs(b) < 1e-9) return null;
    return -c/b;
  }
  const disc=b*b-4*a*c;
  if (disc < 0) return null;
  const sq=Math.sqrt(disc);
  const y1=(-b+sq)/(2*a), y2=(-b-sq)/(2*a);
  if (preferNearY===undefined) return y1;
  return Math.abs(y1-preferNearY) <= Math.abs(y2-preferNearY) ? y1 : y2;
}
function equationFor(elem) {
  if (!elem) return '';
  if (elem.type==='point') {
    return `(${numFmt(elem.ex)}, ${numFmt(elem.ey)})`;
  }
  if (elem.type==='line') {
    const a=state.elements.find(x=>x.id===elem.p1Id);
    const b=state.elements.find(x=>x.id===elem.p2Id);
    if (!a||!b) return '';
    if (Math.abs(b.ex-a.ex) < 1e-9) return `x = ${numFmt(a.ex)}`;
    const m=(b.ey-a.ey)/(b.ex-a.ex);
    const c=a.ey-m*a.ex;
    return `y = ${numFmt(m)}x ${c>=0?'+':'-'} ${numFmt(Math.abs(c))}`;
  }
  if (elem.type==='curve') {
    const co=curveConicCoeffs(elem);
    if (co) return buildConicString(co);
    // near-degenerate (control point ~collinear with endpoints): straight-line form
    if (Math.abs(elem.x2-elem.x1) < 1e-9) return `x = ${numFmt(elem.x1)}`;
    const m=(elem.y2-elem.y1)/(elem.x2-elem.x1);
    const c=elem.y1-m*elem.x1;
    return `y = ${numFmt(m)}x ${c>=0?'+':'-'} ${numFmt(Math.abs(c))}`;
  }
  if (elem.type==='tangent') {
    return `t = ${numFmt(elem.t)}`;
  }
  return '';
}
function parseEquation(elem, str) {
  str = (str||'').trim();
  if (!elem || !str) return false;
  if (elem.type==='point') {
    const m=str.match(/^\(\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*\)$/);
    if (!m) return false;
    const ep=clampEcon(parseFloat(m[1]), parseFloat(m[2]));
    elem.ex=ep.x; elem.ey=ep.y;
    return true;
  }
  if (elem.type==='line') {
    const a=state.elements.find(x=>x.id===elem.p1Id);
    const b=state.elements.find(x=>x.id===elem.p2Id);
    if (!a||!b) return false;
    let m;
    if ((m=str.match(/^x\s*=\s*(-?\d*\.?\d+)$/i))) {
      const c=clampEcon(parseFloat(m[1]), 0).x;
      a.ex=c; b.ex=c;
      return true;
    }
    if ((m=str.match(/^y\s*=\s*(-?\d*\.?\d+)$/i))) {
      const c=clampEcon(0, parseFloat(m[1])).y;
      a.ey=c; b.ey=c;
      return true;
    }
    m=str.match(/^y\s*=\s*(-?\d*\.?\d*)\s*x\s*([+-]\s*\d*\.?\d+)?$/i);
    if (m) {
      const s=m[1];
      let slope;
      if (s===''||s==='+') slope=1;
      else if (s==='-') slope=-1;
      else slope=parseFloat(s);
      const intercept=m[2]!==undefined ? parseFloat(m[2].replace(/\s+/g,'')) : 0;
      const p1=clampEcon(a.ex, slope*a.ex+intercept);
      const p2=clampEcon(b.ex, slope*b.ex+intercept);
      a.ey=p1.y; b.ey=p2.y;
      return true;
    }
    return false;
  }
  if (elem.type==='curve') {
    const co=parseConicString(str);
    if (!co) return false;
    if (Math.abs(co.A)<1e-9 && Math.abs(co.B)<1e-9 && Math.abs(co.C)<1e-9) {
      // No quadratic terms typed — treat as redefining a (currently straight) curve via a line.
      if (Math.abs(co.E) < 1e-9) {
        if (Math.abs(co.D) < 1e-9) return false;
        const cx=clampEcon(-co.F/co.D, 0).x;
        elem.x1=cx; elem.x2=cx;
      } else {
        const newY1=-(co.D*elem.x1+co.F)/co.E;
        const newY2=-(co.D*elem.x2+co.F)/co.E;
        const p1=clampEcon(elem.x1,newY1), p2=clampEcon(elem.x2,newY2);
        elem.y1=p1.y; elem.y2=p2.y;
      }
      delete elem.cpx; delete elem.cpy;
      delete elem.lineId; delete elem.t; delete elem.span; delete elem.pointId;
      elem.curvature=0;
      return true;
    }
    const X0=elem.x1, X2=elem.x2, Xmid=(X0+X2)/2;
    const oldCp=econCurveCP(elem);
    const oldMidY=0.25*elem.y1+0.5*oldCp.y+0.25*elem.y2;
    const Y0=solveConicForY(co,X0,elem.y1);
    const Y2=solveConicForY(co,X2,elem.y2);
    const Ymid=solveConicForY(co,Xmid,oldMidY);
    if (Y0===null||Y2===null||Ymid===null) return false;
    const P0=clampEcon(X0,Y0), P2c=clampEcon(X2,Y2);
    const Mid={x:Xmid,y:Ymid};
    const Pc={x:2*Mid.x-0.5*P0.x-0.5*P2c.x, y:2*Mid.y-0.5*P0.y-0.5*P2c.y};
    elem.x1=P0.x; elem.y1=P0.y; elem.x2=P2c.x; elem.y2=P2c.y;
    elem.cpx=Pc.x; elem.cpy=Pc.y;
    delete elem.lineId; delete elem.t; delete elem.span; delete elem.pointId;
    return true;
  }
  if (elem.type==='tangent') {
    const m=str.match(/t\s*=\s*(-?\d*\.?\d+)/i);
    if (!m) return false;
    elem.t=Math.max(0.02, Math.min(0.98, parseFloat(m[1])));
    return true;
  }
  return false;
}
function normalizeLatex(str) {
  return String(str)
    .replace(/\\left/g, '')
    .replace(/\\right/g, '')
    .replace(/\\cdot/g, '*')
    .replace(/\\times/g, '*')
    .replace(/\^\{([^{}]*)\}/g, '^$1')
    .replace(/\\,/g, ' ')
    .replace(/\\!/g, '')
    .trim();
}
function refreshEquationBox() {
  const input=document.getElementById('equation-input');
  if (!input) return;
  const sel=state.elements.find(e=>e.id===state.selectedId);
  if (!sel) return;
  if (document.activeElement!==input) {
    input.value=equationFor(sel);
    input.style.borderColor='#ccc';
  }
}

/* =====================================================================
   LEFT SIDEBAR
   ===================================================================== */
function renderLeftSidebar() {
  const sb=document.getElementById('left-sidebar');
  sb.innerHTML='';

  const sel=state.elements.find(e=>e.id===state.selectedId);
  // The axes are selectable too; they are not entries in state.elements, so
  // they carry a string id rather than a numeric one.
  const axisSel = (state.selectedId==='xaxis'||state.selectedId==='yaxis') ? state.selectedId : null;

  //  equation editor
  const secEq=sec('Equation');
  if (sel && (sel.type==='text' || sel.type==='shade')) {
    const p=document.createElement('p');
    p.className='no-sel';
    p.textContent='No equation for this element.';
    secEq.appendChild(p);
  } else if (sel) {
    const input=document.createElement('math-field');
    input.id='equation-input'; input.className='eq-input';
    input.setAttribute('math-virtual-keyboard-policy','manual');
    input.value=equationFor(sel);
    let commitTimer=null;
    input.addEventListener('focus', ()=>pushUndo());
    function applyEquation(isFinal) {
      const ok=parseEquation(sel, normalizeLatex(input.value));
      input.style.borderColor = ok ? '#ccc' : '#c0392b';
      if (ok) { if (isFinal) render(); else renderCanvas(); }
    }
    input.addEventListener('input', ()=>{
      clearTimeout(commitTimer);
      commitTimer=setTimeout(()=>applyEquation(false), 300);
    });
    input.addEventListener('change', ()=>{
      clearTimeout(commitTimer);
      applyEquation(true);
    });
    secEq.appendChild(input);
  } else {
    const p=document.createElement('p');
    p.className='no-sel';
    p.textContent = axisSel
      ? (axisSel==='xaxis' ? 'y = 0   (the horizontal axis)' : 'x = 0   (the vertical axis)')
      : state.selectedIds.size>1
        ? `${state.selectedIds.size} elements selected.`
        : 'Select an element to view or edit its equation.';
    secEq.appendChild(p);
  }
  sb.appendChild(secEq);

  //  element properties
  const secEl=sec('Element Properties');
  if (axisSel) {
    const isX = axisSel==='xaxis';
    const p=document.createElement('p');
    p.className='hint-text';
    p.innerHTML = isX ? '<b>X axis</b> selected.' : '<b>Y axis</b> selected.';
    secEl.appendChild(p);
    secEl.appendChild(ctrlRow('Axis Label', inputTxt(isX?state.xLabel:state.yLabel,
      v=>{ if(isX) state.xLabel=v; else state.yLabel=v; renderCanvas(); })));
    secEl.appendChild(ctrlRow('Scale', inputNum(isX?state.xScale:state.yScale, 1, 1e6,
      v=>{ if(isX) state.xScale=v; else state.yScale=v; renderCanvas(); }, 'any')));
    const ticks = isX ? state.xTicks : state.yTicks;
    const tcb=document.createElement('input');
    tcb.type='checkbox'; tcb.checked=ticks.enabled;
    tcb.addEventListener('change',()=>{pushUndo();ticks.enabled=tcb.checked;render();});
    secEl.appendChild(ctrlRow('Tick Labels', tcb));
  } else if (sel) {
    if (sel.type==='text') {
      secEl.appendChild(ctrlRow('Text', inputTxt(sel.text||'', v=>{sel.text=v;renderCanvas();})));
      secEl.appendChild(ctrlRow('Font Size', rangeCtrl(sel.fontSize||14,10,36,1, v=>{sel.fontSize=v;renderCanvas();})));
    } else {
      secEl.appendChild(ctrlRow('Label', inputTxt(sel.label, v=>{sel.label=v;renderCanvas();})));
    }
    secEl.appendChild(ctrlRow('Label Angle', rangeCtrl(sel.labelRotation||0,-180,180,1, v=>{sel.labelRotation=v;renderCanvas();})));
    secEl.appendChild(ctrlRow('Color', inputColor(sel.color||'#333', v=>{sel.color=v;renderCanvas();})));

    if (sel.type==='shade') {
      secEl.appendChild(ctrlRow('Opacity', rangeCtrl(sel.opacity!==undefined?sel.opacity:0.3,0.05,0.8,0.05, v=>{sel.opacity=v;renderCanvas();})));
    }

    if (sel.type==='point') {
      secEl.appendChild(ctrlRow('Size', rangeCtrl(sel.size||5,2,14,0.5, v=>{sel.size=v;renderCanvas();})));

      const hostLine=findLineThroughPoint(sel.id);
      if (hostLine) {
        const btnTC=document.createElement('button');
        btnTC.className='side-btn'; btnTC.innerHTML='+ Add Tangent Curve<small>curve tangent to the line at this point</small>';
        btnTC.onclick=()=>handleAddTangentCurve(hostLine.id, {x:sel.ex,y:sel.ey}, sel.id);
        secEl.appendChild(btnTC);
      }

      const hostCurveInfo=findCurveThroughPoint(sel.id);
      if (hostCurveInfo) {
        const btnTL=document.createElement('button');
        btnTL.className='side-btn'; btnTL.innerHTML='+ Add Tangent Line<small>line tangent to the curve at this point</small>';
        btnTL.onclick=()=>addTangent(hostCurveInfo.curve.id, hostCurveInfo.t);
        secEl.appendChild(btnTL);
      }

    } else {
      secEl.appendChild(ctrlRow('Thickness', rangeCtrl(sel.thickness||2,0.5,8,0.5, v=>{sel.thickness=v;renderCanvas();})));
      const dottedRow=ctrlRow('Dotted');
      const cb=document.createElement('input');
      cb.type='checkbox'; cb.checked=!!sel.dotted; cb.addEventListener('change',()=>{pushUndo();sel.dotted=cb.checked;renderCanvas();});
      dottedRow.appendChild(cb);
      secEl.appendChild(dottedRow);
    }

    if ((sel.type==='line' || sel.type==='curve') && sel.lineId===undefined) {
      secEl.appendChild(ctrlRow('Rotate', rotateCtrl(sel)));
    }

    if (sel.type==='curve') {
      if (sel.lineId!==undefined) {
        secEl.appendChild(ctrlRow('Position', rangeCtrl(sel.t,0,1,0.01, v=>{sel.t=v;renderCanvas();})));
      } else if (sel.cpx===undefined) {
        secEl.appendChild(ctrlRow('Curvature', rangeCtrl(sel.curvature||0.72,0,1,0.02, v=>{sel.curvature=v;renderCanvas();})));
      }

      // Size is cumulative: the slider holds the total scale applied so far and
      // each change applies only the difference, so the geometry stays the
      // single source of truth and dragging back to 1 restores the original.
      if (sel.lineId===undefined) {
        secEl.appendChild(ctrlRow('Size', rangeCtrl(sel.scale||1, 0.2, 3, 0.05, v=>{
          const cur = sel.scale || 1;
          if (v>0 && Math.abs(v-cur) > 1e-9) { scaleCurve(sel, v/cur); sel.scale = v; }
          renderCanvas();
        })));
      }

      // The endpoints stay part of the curve; this only hides their handles.
      if (sel.lineId===undefined) {
        const epRow=ctrlRow('Hide Endpoints');
        const epCb=document.createElement('input');
        epCb.type='checkbox'; epCb.checked=!!sel.hideHandles;
        epCb.addEventListener('change',()=>{pushUndo();sel.hideHandles=epCb.checked;renderCanvas();});
        epRow.appendChild(epCb);
        secEl.appendChild(epRow);
      }

      const btn1=document.createElement('button');
      btn1.className='side-btn'; btn1.textContent='+ Add Tangent Line';
      btn1.onclick=()=>addTangent(sel.id);
      secEl.appendChild(btn1);

      const btn2=document.createElement('button');
      btn2.className='side-btn'; btn2.innerHTML='+ Add Parallel Curve<small>for IC sets, PPF shifts…</small>';
      btn2.onclick=()=>duplicateCurveShifted(sel);
      secEl.appendChild(btn2);
    }

    if (sel.type==='tangent') {
      secEl.appendChild(ctrlRow('Position', rangeCtrl(sel.t,0.02,0.98,0.01, v=>{sel.t=v;renderCanvas();})));

      const btnTC=document.createElement('button');
      btnTC.className='side-btn'; btnTC.innerHTML='+ Add Tangent Curve<small>curve tangent to this line, at its contact point</small>';
      btnTC.onclick=()=>handleAddTangentCurve(sel.id, tangentContactPoint(sel));
      secEl.appendChild(btnTC);
    }

  } else if (state.selectedIds.size>1) {
    const p=document.createElement('p');
    p.className='no-sel';
    p.textContent=`${state.selectedIds.size} elements selected.`;
    secEl.appendChild(p);
    const idsArr=[...state.selectedIds];
    if (idsArr.length===2 && idsArr.every(isShadeable)) {
      const btnShade=document.createElement('button');
      btnShade.className='side-btn'; btnShade.innerHTML='▨ Shade Region<small>fill the area between these two</small>';
      btnShade.onclick=()=>addShade(idsArr[0], idsArr[1]);
      secEl.appendChild(btnShade);
    }
  } else {
    const p=document.createElement('p');
    p.className='no-sel';
    p.textContent='Click an element to select it and edit its properties.';
    secEl.appendChild(p);
  }
  sb.appendChild(secEl);

  //  canvas settings
  const secC=sec('Canvas');
  secC.appendChild(ctrlRow('Background', inputColor(state.bgColor, v=>{state.bgColor=v;renderCanvas();})));
  secC.appendChild(ctrlRow('Grid Color', inputColor(state.gridColor, v=>{state.gridColor=v;renderCanvas();})));
  const gridRow=ctrlRow('Show Grid');
  const gcb=document.createElement('input');
  gcb.type='checkbox'; gcb.checked=state.showGrid;
  gcb.addEventListener('change',()=>{pushUndo();state.showGrid=gcb.checked;renderCanvas();});
  gridRow.appendChild(gcb);
  secC.appendChild(gridRow);
  sb.appendChild(secC);

  //  axes
  const secA=sec('Axes');
  secA.appendChild(ctrlRow('X Label', inputTxt(state.xLabel, v=>{state.xLabel=v;renderCanvas();})));
  secA.appendChild(ctrlRow('Y Label', inputTxt(state.yLabel, v=>{state.yLabel=v;renderCanvas();})));
  secA.appendChild(ctrlRow('X Scale', inputNum(state.xScale,1,50, v=>{state.xScale=v;renderCanvas();})));
  secA.appendChild(ctrlRow('Y Scale', inputNum(state.yScale,1,50, v=>{state.yScale=v;renderCanvas();})));
  sb.appendChild(secA);

  //  axis tick labels
  const secT=sec('Axis Tick Labels');
  const xtRow=ctrlRow('Label X Units');
  const xtcb=document.createElement('input');
  xtcb.type='checkbox'; xtcb.checked=state.xTicks.enabled;
  xtcb.addEventListener('change',()=>{pushUndo();state.xTicks.enabled=xtcb.checked;render();});
  xtRow.appendChild(xtcb);
  secT.appendChild(xtRow);
  if (state.xTicks.enabled) {
    secT.appendChild(ctrlRow('X Start', inputNum(state.xTicks.start,-1e6,1e6, v=>{state.xTicks.start=v;renderCanvas();},'any')));
    secT.appendChild(ctrlRow('X End', inputNum(state.xTicks.end,-1e6,1e6, v=>{state.xTicks.end=v;renderCanvas();},'any')));
    secT.appendChild(ctrlRow('X Increment', inputNum(state.xTicks.step,0.0001,1e6, v=>{state.xTicks.step=v;renderCanvas();},'any')));
  }
  const ytRow=ctrlRow('Label Y Units');
  const ytcb=document.createElement('input');
  ytcb.type='checkbox'; ytcb.checked=state.yTicks.enabled;
  ytcb.addEventListener('change',()=>{pushUndo();state.yTicks.enabled=ytcb.checked;render();});
  ytRow.appendChild(ytcb);
  secT.appendChild(ytRow);
  if (state.yTicks.enabled) {
    secT.appendChild(ctrlRow('Y Start', inputNum(state.yTicks.start,-1e6,1e6, v=>{state.yTicks.start=v;renderCanvas();},'any')));
    secT.appendChild(ctrlRow('Y End', inputNum(state.yTicks.end,-1e6,1e6, v=>{state.yTicks.end=v;renderCanvas();},'any')));
    secT.appendChild(ctrlRow('Y Increment', inputNum(state.yTicks.step,0.0001,1e6, v=>{state.yTicks.step=v;renderCanvas();},'any')));
  }
  sb.appendChild(secT);
}

/* Sidebar helpers */
function sec(title) {
  const d=document.createElement('div');
  d.className='sb-section';
  const h=document.createElement('h3');
  h.textContent=title;
  d.appendChild(h);
  return d;
}
function ctrlRow(label, control) {
  const d=document.createElement('div');
  d.className='ctrl-row';
  const l=document.createElement('label');
  l.textContent=label;
  d.appendChild(l);
  if (control) d.appendChild(control);
  return d;
}
function inputTxt(val,cb) {
  const i=document.createElement('input');
  i.type='text'; i.value=val;
  i.addEventListener('focus',()=>pushUndo());
  i.addEventListener('input',e=>cb(e.target.value));
  return i;
}
function inputColor(val,cb) {
  const i=document.createElement('input');
  i.type='color'; i.value=val;
  i.addEventListener('focus',()=>pushUndo());
  i.addEventListener('input',e=>cb(e.target.value));
  return i;
}
function inputNum(val,min,max,cb,step=1) {
  const i=document.createElement('input');
  i.type='number'; i.value=val; i.min=min; i.max=max; i.step=step;
  i.addEventListener('focus',()=>pushUndo());
  i.addEventListener('change',e=>cb(Math.max(min,Math.min(max,parseFloat(e.target.value)||val))));
  return i;
}
function rangeCtrl(val,min,max,step,cb) {
  const wrap=document.createElement('div');
  wrap.className='range-wrap';
  const r=document.createElement('input');
  r.type='range'; r.min=min; r.max=max; r.step=step; r.value=val;
  const lbl=document.createElement('span');
  lbl.className='range-val';
  lbl.textContent=formatVal(val,step);
  r.addEventListener('pointerdown',()=>pushUndo());
  r.addEventListener('input',e=>{
    const v=parseFloat(e.target.value);
    lbl.textContent=formatVal(v,step);
    cb(v);
  });
  wrap.appendChild(r); wrap.appendChild(lbl);
  return wrap;
}
function rotateCtrl(elem) {
  const wrap=document.createElement('div');
  wrap.className='range-wrap';
  const r=document.createElement('input');
  r.type='range'; r.min=-45; r.max=45; r.step=1; r.value=0;
  const lbl=document.createElement('span');
  lbl.className='range-val'; lbl.textContent='0°';
  let lastVal=0;
  r.addEventListener('pointerdown',()=>pushUndo());
  r.addEventListener('input',e=>{
    const v=parseFloat(e.target.value);
    rotateElementBy(elem, v-lastVal);
    lastVal=v;
    lbl.textContent=Math.round(v)+'°';
    renderCanvas();
  });
  r.addEventListener('change',()=>{
    r.value=0; lbl.textContent='0°'; lastVal=0;
  });
  wrap.appendChild(r); wrap.appendChild(lbl);
  return wrap;
}
function formatVal(v,step) {
  return step<1 ? v.toFixed(2) : Math.round(v).toString();
}

function clearCanvas() {
  pushUndo();
  state.elements=[]; state.selectedId=null; state.selectedIds=new Set(); state.nextId=1;
}


function tplSupplyDemand() {
  clearCanvas();
  state.showGrid=false;
  state.xScale=10; state.yScale=10;
  state.xTicks={enabled:false,start:0,end:10,step:1}; state.yTicks={enabled:false,start:0,end:10,step:1};
  state.xLabel='Quantity'; state.yLabel='Price ($)';
  // Market-shortage diagram: a below-equilibrium price P1 creates excess demand (Qd > Qs).
  // Both lines are centred on (5,5) so their natural crossing is exact, but the
  // marked points sit at P1 = 3 (below that crossing), not at equilibrium itself.

  // Demand D0: (0.5,9) -> (9.5,1)
  const d1=uid(),d2=uid();
  push({id:d1,type:'point',ex:0.5,ey:9,color:'transparent',size:0,label:''});
  push({id:d2,type:'point',ex:9.5,ey:1,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:d1,p2Id:d2,color:'#1a1a1a',thickness:2.5,dotted:false,label:'D₀',lox:-90,loy:-32});

  // Supply S0: (0.5,1) -> (9.5,9)
  const s1=uid(),s2=uid();
  push({id:s1,type:'point',ex:0.5,ey:1,color:'transparent',size:0,label:''});
  push({id:s2,type:'point',ex:9.5,ey:9,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:s1,p2Id:s2,color:'#1a1a1a',thickness:2.5,dotted:false,label:'S₀',lox:97,loy:-57});

  // P1 = 3 (below the D0/S0 crossing at price 5): A on S0 at Q1=2.75, B on D0 at Q2=7.25
  const zero=uid();
  push({id:zero,type:'point',ex:0,ey:3,color:'transparent',size:0,label:'P₁',labelColor:'#1a1a1a'});
  const ptA=uid(), ptB=uid();
  push({id:ptA,type:'point',ex:2.75,ey:3,color:'#a63a2b',size:6,label:'A',lox:-4,loy:-14});
  push({id:ptB,type:'point',ex:7.25,ey:3,color:'#a63a2b',size:6,label:'B',lox:6,loy:-14});
  push({id:uid(),type:'line',p1Id:zero,p2Id:ptB,color:'#a63a2b',thickness:1.5,dotted:true,label:''});

  // Vertical drop-lines to Q1 and Q2 on the x-axis
  const q1x=uid(), q2x=uid();
  push({id:q1x,type:'point',ex:2.75,ey:0,color:'transparent',size:0,label:'Q₁',labelColor:'#1a1a1a'});
  push({id:q2x,type:'point',ex:7.25,ey:0,color:'transparent',size:0,label:'Q₂',labelColor:'#1a1a1a'});
  push({id:uid(),type:'line',p1Id:q1x,p2Id:ptA,color:'#1f3a5f',thickness:1.5,dotted:true,label:''});
  push({id:uid(),type:'line',p1Id:q2x,p2Id:ptB,color:'#1f3a5f',thickness:1.5,dotted:true,label:''});

  push({id:uid(),type:'text',ex:3.4,ey:2.15,text:'Market Shortage',color:'#a63a2b',fontSize:14,label:''});
  push({id:uid(),type:'text',ex:4.05,ey:1.55,text:'Qd > Qs',color:'#a63a2b',fontSize:14,label:''});
}

function tplPPF() {
  clearCanvas();
  state.showGrid=false;
  state.xScale=10; state.yScale=10;
  state.xTicks={enabled:true,start:0,end:10,step:2.25}; state.yTicks={enabled:true,start:0,end:10,step:2.5};
  state.xLabel='Consumer goods'; state.yLabel='Capital goods';
  // Same curve as before, scaled down 20x (grid is 0-10 instead of 0-200) so
  // the shape and every tangency/passage relationship are identical.
  // Curve endpoints (0,10)-(10,0) with an explicit control point chosen so
  // the curve passes exactly through the Pareto-efficient point (6.75, 8).
  push({id:uid(),type:'curve',hideHandles:true,shape:'concave',x1:0,y1:10,x2:10,y2:0,cpx:8.5,cpy:11,
    curvature:0.75,color:'#1a1a1a',thickness:2.5,dotted:false,label:'PPF',lox:-243,loy:-60});

  // Pareto-efficient point, on the frontier, with dotted reference lines to both axes
  const eff=uid(), effX=uid(), effY=uid();
  push({id:effX,type:'point',ex:6.75,ey:0,color:'transparent',size:0,label:''});
  push({id:effY,type:'point',ex:0,ey:8,color:'transparent',size:0,label:''});
  push({id:eff,type:'point',ex:6.75,ey:8,color:'#a63a2b',size:6,label:'Pareto Efficiency',lox:10,loy:-8});
  push({id:uid(),type:'line',p1Id:effX,p2Id:eff,color:'#a63a2b',thickness:1.2,dotted:true,label:''});
  push({id:uid(),type:'line',p1Id:effY,p2Id:eff,color:'#a63a2b',thickness:1.2,dotted:true,label:''});

  // Attainable (inefficient) point inside the frontier, at the same capital-goods
  // level (5) as the frontier point further out (~8.7,5) - the horizontal
  // dotted line spans the full gap to show the "wasted" consumer goods.
  const att=uid(), attX=uid(), attY=uid(), frontierAtY=uid(), frontierAtX=uid();
  push({id:attX,type:'point',ex:4.5,ey:0,color:'transparent',size:0,label:''});
  push({id:attY,type:'point',ex:0,ey:5,color:'transparent',size:0,label:''});
  push({id:att,type:'point',ex:4.5,ey:5,color:'#a63a2b',size:6,label:'Attainable',lox:12,loy:-14});
  push({id:frontierAtY,type:'point',ex:8.7,ey:5,color:'transparent',size:0,label:''});
  push({id:frontierAtX,type:'point',ex:8.7,ey:0,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:attX,p2Id:att,color:'#a63a2b',thickness:1.2,dotted:true,label:''});
  push({id:uid(),type:'line',p1Id:attY,p2Id:frontierAtY,color:'#a63a2b',thickness:1.2,dotted:true,label:''});
  push({id:uid(),type:'line',p1Id:frontierAtX,p2Id:frontierAtY,color:'#a63a2b',thickness:1.2,dotted:true,label:''});

  // Unattainable point, outside the frontier
  push({id:uid(),type:'point',ex:7.5,ey:9.5,color:'#a63a2b',size:6,label:'Unattainable',lox:10,loy:-8});
}

function tplBudget() {
  clearCanvas();
  state.showGrid=false;
  state.xScale=16; state.yScale=16;
  state.xTicks={enabled:true,start:0,end:16,step:1}; state.yTicks={enabled:true,start:0,end:16,step:1};
  state.xLabel='Oranges (x)'; state.yLabel='Apples (y)';
  // Income & substitution effects: a fall in the price of oranges rotates the
  // budget line outward around the same y-intercept (income and the price of
  // apples are unchanged). Steep line is tangent at (3,6), shallow line at
  // (7,8) - matching quantity demanded of 3 at the higher price and 7 at the
  // lower price.
  //
  // Each indifference curve is built as a hyperbola-shaped quadratic Bezier:
  // start (a,h) at the top, control point at the corner (a,k), end (b,k) on
  // the right. That gives a near-vertical top and near-horizontal tail - the
  // classic IC shape. Given the left/bottom extents (a,k) and the required
  // tangency (Mx,My) with slope -mag, the remaining unknowns b, h and the
  // parameter t are fully determined, so the tangency is exact:
  //   x(t) = a + (b-a)t^2 , y(t) = k + (h-k)(1-t)^2
  // tanT is the curve parameter at the tangency, so the curve can be dragged
  // along its budget line while staying tangent (see the 'curve-slide' drag).
  const icCurve = (a,k,Mx,My,mag) => {
    const t = mag*(Mx-a) / ((My-k) + mag*(Mx-a));
    return {x1:a, y1:k + (My-k)/((1-t)*(1-t)), x2:a + (Mx-a)/(t*t), y2:k, cpx:a, cpy:k, tanT:t};
  };

  // Original (steeper) budget line: (0,15) -> (5,0)
  const b1=uid(), b2=uid(), steepLine=uid();
  push({id:b1,type:'point',ex:0,ey:15,color:'transparent',size:0,label:''});
  push({id:b2,type:'point',ex:5,ey:0,color:'transparent',size:0,label:''});
  push({id:steepLine,type:'line',p1Id:b1,p2Id:b2,color:'#a63a2b',thickness:2.5,dotted:false,label:''});

  // New (shallower) budget line after the price fall: (0,15) -> (15,0)
  const b3=uid(), b4=uid(), shallowLine=uid();
  push({id:b3,type:'point',ex:0,ey:15,color:'transparent',size:0,label:''});
  push({id:b4,type:'point',ex:15,ey:0,color:'transparent',size:0,label:''});
  push({id:shallowLine,type:'line',p1Id:b3,p2Id:b4,color:'#a63a2b',thickness:2.5,dotted:false,label:''});

  // Smaller indifference curve, tangent to the steep line (slope -3) at (3,6)
  push({id:uid(),type:'curve',hideHandles:true,...icCurve(2.2,1.5,3,6,3),curvature:0.5,slideLineId:steepLine,
    color:'#1a1a1a',thickness:2,dotted:false,label:''});
  const t1x=uid(), t1y=uid();
  push({id:t1x,type:'point',ex:3,ey:0,color:'transparent',size:0,label:''});
  push({id:t1y,type:'point',ex:0,ey:6,color:'transparent',size:0,label:''});
  const t1=uid();
  push({id:t1,type:'point',ex:3,ey:6,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:t1x,p2Id:t1,color:'#8a8a8a',thickness:1,dotted:true,label:''});
  push({id:uid(),type:'line',p1Id:t1y,p2Id:t1,color:'#8a8a8a',thickness:1,dotted:true,label:''});

  // Larger indifference curve, tangent to the shallow line (slope -1) at (7,8)
  push({id:uid(),type:'curve',hideHandles:true,...icCurve(4.5,5.2,7,8,1),curvature:0.5,slideLineId:shallowLine,
    color:'#1a1a1a',thickness:2,dotted:false,label:''});
  const t2x=uid(), t2y=uid();
  push({id:t2x,type:'point',ex:7,ey:0,color:'transparent',size:0,label:''});
  push({id:t2y,type:'point',ex:0,ey:8,color:'transparent',size:0,label:''});
  const t2=uid();
  push({id:t2,type:'point',ex:7,ey:8,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:t2x,p2Id:t2,color:'#8a8a8a',thickness:1,dotted:true,label:''});
  push({id:uid(),type:'line',p1Id:t2y,p2Id:t2,color:'#8a8a8a',thickness:1,dotted:true,label:''});
}

function tplPerfectComp() {
  clearCanvas();
  state.showGrid=false;
  state.xScale=10; state.yScale=10;
  state.xTicks={enabled:false,start:0,end:10,step:1}; state.yTicks={enabled:false,start:0,end:10,step:1};
  state.xLabel='Output/Sales'; state.yLabel='Cost/Revenue';
  // Long-run zero-economic-profit equilibrium: MC crosses AC exactly at AC's
  // minimum, and P = MR = AR passes through that same point (5,3).

  // P = MR = AR: horizontal line at the zero-profit price level.
  // Declared first so the AC curve can reference it as its slide host.
  const p1=uid(), p2=uid(), priceLine=uid();

  // AC (U-shaped, symmetric endpoints give a horizontal tangent at its t=0.5
  // minimum by construction) - minimum sits exactly at (5,3), on the price
  // line, so AC slides along that line while staying tangent to it.
  push({id:uid(),type:'curve',hideHandles:true,x1:1.5,y1:6,x2:8.5,y2:6,cpx:5,cpy:0,curvature:0.5,
    slideLineId:priceLine,tanT:0.5,
    color:'#a63a2b',thickness:2,dotted:false,label:'AC',lox:15,loy:26});

  // MC (rising), explicit control point so it crosses AC exactly at its minimum (5,3)
  push({id:uid(),type:'curve',hideHandles:true,x1:2,y1:0.5,x2:8.5,y2:9.5,cpx:4.75,cpy:1,curvature:0.5,
    color:'#1f3a5f',thickness:2,dotted:false,label:'MC',lox:-23,loy:-39});

  push({id:p1,type:'point',ex:0,ey:3,color:'transparent',size:0,label:''});
  push({id:p2,type:'point',ex:9.5,ey:3,color:'transparent',size:0,label:''});
  push({id:priceLine,type:'line',p1Id:p1,p2Id:p2,color:'#4a7c59',thickness:3,dotted:false,label:'P = MR = AR',lox:32,loy:55});
  // (offset chosen so this clears both the AC/MC curves and their own labels)

  // Q1 reference: drop-line from the tangency point down to the x-axis
  const eq=uid(), qx=uid();
  push({id:eq,type:'point',ex:5,ey:3,color:'#1a1a1a',size:5,label:''});
  push({id:qx,type:'point',ex:5,ey:0,color:'transparent',size:0,label:'Q₁',labelColor:'#1a1a1a',lox:20,loy:0});
  push({id:uid(),type:'line',p1Id:qx,p2Id:eq,color:'#8a8a8a',thickness:1.2,dotted:true,label:''});
}

function tplMonopoly() {
  clearCanvas();
  state.showGrid=false;
  state.xScale=10; state.yScale=10;
  state.xTicks={enabled:false,start:0,end:10,step:1}; state.yTicks={enabled:false,start:0,end:10,step:1};
  state.xLabel='Q'; state.yLabel='P';
  // Monopoly economic-profit diagram: profit-maximising quantity Qf=3 is where
  // MR=MC=4; price Pf=7 is read off demand at Qf; ATC(Qf)≈5.125, so the
  // shaded rectangle (Pf-ATC)×Qf is the economic profit.

  // D = AR = P
  const d1=uid(),d2=uid();
  push({id:d1,type:'point',ex:0,ey:10,color:'transparent',size:0,label:''});
  push({id:d2,type:'point',ex:10,ey:0,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:d1,p2Id:d2,color:'#1f3a5f',thickness:2,dotted:false,label:'D = AR = P',lox:68,loy:39});

  // MR (double slope, same intercept as AR)
  const mr1=uid(),mr2=uid();
  push({id:mr1,type:'point',ex:0,ey:10,color:'transparent',size:0,label:''});
  push({id:mr2,type:'point',ex:5,ey:0,color:'transparent',size:0,label:''});
  push({id:uid(),type:'line',p1Id:mr1,p2Id:mr2,color:'#1f3a5f',thickness:2,dotted:false,label:'MR',lox:-30,loy:25});

  // MC, explicit control point so it passes exactly through (3,4) at t=1/3
  push({id:uid(),type:'curve',hideHandles:true,x1:0,y1:1.5,x2:9,y2:9,cpx:4.5,cpy:5.25,curvature:0.5,
    color:'#4a7c59',thickness:2.5,dotted:false,label:'MC',lox:39,loy:0});

  // ATC, U-shaped (symmetric horizontal-tangent construction); ATC(3) ≈ 5.125
  push({id:uid(),type:'curve',hideHandles:true,x1:1,y1:7,x2:9,y2:7,cpx:5,cpy:2,curvature:0.5,
    color:'#8a6d1f',thickness:2.5,dotted:false,label:'ATC',lox:0,loy:31});

  // Profit-box boundaries: two short horizontal helper lines spanning Q=[0,3],
  // one at Pf=7 and one at ATC(3)=5.125, shaded between them.
  const pfL=uid(), pfR=uid(), atcL=uid(), atcR=uid();
  push({id:pfL,type:'point',ex:0,ey:7,color:'transparent',size:0,label:'Pf',labelColor:'#1a1a1a',lox:-9,loy:-16});
  push({id:pfR,type:'point',ex:3,ey:7,color:'transparent',size:0,label:''});
  push({id:atcL,type:'point',ex:0,ey:5.125,color:'transparent',size:0,label:''});
  push({id:atcR,type:'point',ex:3,ey:5.125,color:'transparent',size:0,label:''});
  const pfLine=uid(), atcLine=uid();
  push({id:pfLine,type:'line',p1Id:pfL,p2Id:pfR,color:'#a63a2b',thickness:1.2,dotted:true,label:''});
  push({id:atcLine,type:'line',p1Id:atcL,p2Id:atcR,color:'#a63a2b',thickness:1.2,dotted:true,label:''});
  push({id:uid(),type:'shade',boundA:pfLine,boundB:atcLine,color:'#4a7c59',opacity:0.35,label:''});
  push({id:uid(),type:'text',ex:0.6,ey:6.05,text:'Economic Profit',color:'#1a1a1a',fontSize:13,labelRotation:0});

  // Qf reference: drop-line from the MR=MC point down to the x-axis
  const mmc=uid(), qf=uid();
  push({id:mmc,type:'point',ex:3,ey:4,color:'#1a1a1a',size:5,label:''});
  push({id:qf,type:'point',ex:3,ey:0,color:'transparent',size:0,label:'Qf',labelColor:'#1a1a1a',lox:12,loy:0});
  push({id:uid(),type:'line',p1Id:qf,p2Id:mmc,color:'#8a8a8a',thickness:1.2,dotted:true,label:''});
}

function push(o){state.elements.push(o);}

/* =====================================================================
   KEYBOARD SHORTCUTS
   ===================================================================== */
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT' || e.target.tagName==='MATH-FIELD') return;
  const ctrl = e.ctrlKey||e.metaKey;
  if (ctrl && e.key.toLowerCase()==='a') {
    e.preventDefault(); setMode('select'); selectAll();
    return;
  }
  if (ctrl && e.key.toLowerCase()==='z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (ctrl && e.key.toLowerCase()==='y') {
    e.preventDefault(); redo();
    return;
  }
  if (ctrl && e.key.toLowerCase()==='c') {
    e.preventDefault(); copySelected();
    return;
  }
  if (ctrl && e.key.toLowerCase()==='v') {
    e.preventDefault(); pasteClipboard();
    return;
  }
  if (ctrl && e.key.toLowerCase()==='d') {
    e.preventDefault(); duplicateSelected();
    return;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key) && state.selectedIds.size>0) {
    e.preventDefault();
    const step = (Math.max(state.xScale,state.yScale)*0.01) * (e.shiftKey?5:1);
    const dx = e.key==='ArrowLeft'?-step : e.key==='ArrowRight'?step : 0;
    const dy = e.key==='ArrowUp'?step : e.key==='ArrowDown'?-step : 0;
    nudgeSelected(dx, dy, !e.repeat);
    return;
  }
  if (e.key==='Escape') { setMode('select'); closePopup(); }
  if ((e.key==='Delete'||e.key==='Backspace') && state.selectedIds.size>0) {
    e.preventDefault(); deleteSelected();
  }
  if (e.key==='p') setMode('point');
  if (e.key==='l') handleLineBtn();
  if (e.key==='c') handleCurveBtn();
  if (e.key==='s') setMode('select');
});

/* =====================================================================
   INIT
   ===================================================================== */
buildRightSidebar();
// Always open on a blank canvas. Work is kept via the explicit Save / Load
// buttons rather than being restored automatically.
render();
</script>
