          const needs = f0 !== f1 || (f0 && f1 && !offscreen && Math.abs(v1 - v0) > tol);
          if (needs && depth < 12 && budget-- > 0) {
            const um = (u0 + u1) / 2,
              vm = f(um);
            refine(u0, v0, um, vm, depth + 1);
            refine(um, vm, u1, v1, depth + 1);
            return;
          }
          if (needs && f0 && f1 && Math.abs(v1 - v0) > H * 0.05) flush();
          emit(u1, v1);
        };
        let u0 = a,
          v0 = f(a);
        emit(u0, v0);
        for (let k = 1; k <= N; k++) {
          const u1 = a + ((b - a) * k) / N,
            v1 = f(u1);
          refine(u0, v0, u1, v1, 0);
          u0 = u1;
          v0 = v1;
        }
        flush();
        return pieces;
      }

      // Marching squares for implicit curves F(x, y) = 0, joined into polylines.
      function importContour(F, W) {
        const n = 160,
          m = n + 2;
        const dx = (W.x1 - W.x0) / n,
          dy = (W.y1 - W.y0) / n;
        const X = (i) => W.x0 + (i - 1) * dx,
          Y = (j) => W.y0 + (j - 1) * dy;
        const vals = new Float64Array((m + 1) * (m + 1));
        for (let j = 0; j <= m; j++) for (let i = 0; i <= m; i++) vals[j * (m + 1) + i] = F(X(i), Y(j));
        const V = (i, j) => vals[j * (m + 1) + i];
        const cross = (i0, j0, i1, j1) => {
          const a = V(i0, j0),
            b = V(i1, j1),
            t = a / (a - b);
          return {
            x: X(i0) + (X(i1) - X(i0)) * t,
            y: Y(j0) + (Y(j1) - Y(j0)) * t,
            key: `${i0},${j0},${i1},${j1}`,
          };
        };
        const segs = [];
        for (let j = 0; j < m; j++) {
          for (let i = 0; i < m; i++) {
            const a = V(i, j),
              b = V(i + 1, j),
              c = V(i + 1, j + 1),
              d = V(i, j + 1);
            if (![a, b, c, d].every(Number.isFinite)) continue;
            const sa = a > 0,
              sb = b > 0,
              sc = c > 0,
              sd = d > 0;
            const e = [];
            if (sa !== sb) e.push(["B", cross(i, j, i + 1, j)]);
            if (sb !== sc) e.push(["R", cross(i + 1, j, i + 1, j + 1)]);
            if (sd !== sc) e.push(["T", cross(i, j + 1, i + 1, j + 1)]);
            if (sa !== sd) e.push(["L", cross(i, j, i, j + 1)]);
            let pairs = [];
            if (e.length === 2) pairs = [[e[0][1], e[1][1]]];
            else if (e.length === 4) {
              const at = (k) => e.find((q) => q[0] === k)[1];
              const centre = (a + b + c + d) / 4 > 0;
              pairs =
                centre === sa
                  ? [[at("B"), at("R")], [at("T"), at("L")]]
                  : [[at("L"), at("B")], [at("R"), at("T")]];
            }
            const big = Math.max(Math.abs(a), Math.abs(b), Math.abs(c), Math.abs(d));
            pairs.forEach(([p, q]) => {
              // A sign change through a pole (e.g. 1/x) isn't a real crossing.
              const mid = F((p.x + q.x) / 2, (p.y + q.y) / 2);
              if (Number.isFinite(mid) && Math.abs(mid) <= big) segs.push([p, q]);
            });
          }
        }
        const adj = new Map();
        segs.forEach((s, k) =>
          s.forEach((q) => {
            if (!adj.has(q.key)) adj.set(q.key, []);
            adj.get(q.key).push(k);
          }),
        );
        const used = new Uint8Array(segs.length),
          paths = [];
        for (let k = 0; k < segs.length; k++) {
          if (used[k]) continue;
          used[k] = 1;
          const path = [segs[k][0], segs[k][1]];
          [true, false].forEach((forward) => {
            for (;;) {
              const end = forward ? path[path.length - 1] : path[0];
              const nk = (adj.get(end.key) || []).find((q) => !used[q]);
              if (nk === undefined) break;
              used[nk] = 1;
              const nxt = segs[nk][0].key === end.key ? segs[nk][1] : segs[nk][0];
              if (forward) path.push(nxt);
              else path.unshift(nxt);
            }
          });
          paths.push(path.map((q) => ({ x: q.x, y: q.y })));
        }
        return paths;
      }

      function importClipSeg(p, q, W) {
        const dx = q.x - p.x,
          dy = q.y - p.y;
        let t0 = 0,
          t1 = 1;
        const checks = [
          [-dx, p.x - W.x0],
          [dx, W.x1 - p.x],
          [-dy, p.y - W.y0],
          [dy, W.y1 - p.y],
        ];
        for (const [pp, qq] of checks) {
          if (pp === 0) {
            if (qq < 0) return null;
          } else {
            const r = qq / pp;
            if (pp < 0) {
              if (r > t1) return null;
              if (r > t0) t0 = r;
            } else {
              if (r < t0) return null;
              if (r < t1) t1 = r;
            }
          }
        }
        // Unclipped ends are returned as-is: p + 1·(q − p) can differ from q in the last
        // bit, and importClip joins segments only where their ends match exactly.
        return [
          t0 === 0 ? p : { x: p.x + t0 * dx, y: p.y + t0 * dy },
          t1 === 1 ? q : { x: p.x + t1 * dx, y: p.y + t1 * dy },
        ];
      }

      function importClip(path, W) {
        const out = [];
        let cur = [];
        const flush = () => {
          if (cur.length > 1) out.push(cur);
          cur = [];
        };
        for (let k = 0; k < path.length - 1; k++) {
          const c = importClipSeg(path[k], path[k + 1], W);
          if (!c) {
            flush();
            continue;
          }
          const last = cur[cur.length - 1];
          if (!last || last.x !== c[0].x || last.y !== c[0].y) {
            flush();
            cur.push(c[0]);
          }
          cur.push(c[1]);
        }
        flush();
        return out;
      }

      // Outlines of the area where R(x, y) holds inside W. Each column is split into
      // runs of y where R holds; runs are matched to the previous column's runs to grow
      // polygons, and where a run starts or stops between columns the edge is refined.
      function importRegionPolys(R, W, n) {
        const dy = (W.y1 - W.y0) / n,
          dx = (W.x1 - W.x0) / n;
        // f(a) holds and f(b) doesn't: the crossing point, just inside a.
        const bisect = (f, a, b) => {
          for (let k = 0; k < 28; k++) {
            const c = (a + b) / 2;
            if (f(c)) a = c;
            else b = c;
          }
          return a;
        };
        const runsAt = (x) => {
          const runs = [];
          const inY = (t) => R(x, t);
          let start = null,
            prevIn = false,
            prevY = W.y0;
          for (let j = 0; j <= n; j++) {
            const y = j === n ? W.y1 : W.y0 + j * dy;
            const inside = inY(y);
            if (inside && !prevIn) start = j === 0 ? y : bisect(inY, y, prevY);
            if (!inside && prevIn) runs.push([start, bisect(inY, prevY, y)]);
            prevIn = inside;
            prevY = y;
          }
          if (prevIn) runs.push([start, W.y1]);
          return runs;
        };
        const overlaps = (a, b) => a[0] <= b[1] && b[0] <= a[1];
        const mid = (r) => (r[0] + r[1]) / 2;
        // The run through y0, found locally so runs thinner than a row aren't missed.
        const runAround = (x, y0) => {
          const f = (t) => R(x, t);
          if (!f(y0)) return [y0, y0];
          const a = Math.max(W.y0, y0 - 2 * dy),
            b = Math.min(W.y1, y0 + 2 * dy);
          if ((f(a) && a > W.y0) || (f(b) && b < W.y1)) {
            const r = runsAt(x).find((q) => q[0] <= y0 && y0 <= q[1]);
            if (r) return r;
          }
          return [f(a) ? a : bisect(f, y0, a), f(b) ? b : bisect(f, y0, b)];
        };
        const edgeAt = (a, x, y0) => {
          const r = runAround(x, y0);
          a.tops.push({ x: x, y: r[1] });
          a.bots.push({ x: x, y: r[0] });
        };
        // A region narrowing to a point (e.g. a surplus triangle at equilibrium) gets
        // thinner than the row spacing before it ends, so extend its edges to meet.
        const extendTip = (a, atEnd) => {
          const T = a.tops,
            B = a.bots;
          if (T.length < 2 || B.length < 2) return;
          // The last two columns (or first two), counted from each list's own end since
          // a tip added at the start sits on the top list only.
          const at = (L, k) => (atEnd ? L[L.length - 1 - k] : L[k]);
          const t0 = at(T, 0),
            t1 = at(T, 1),
            b0 = at(B, 0),
            b1 = at(B, 1);
          const w0 = t0.y - b0.y,
            w1 = t1.y - b1.y,
            step = t0.x - t1.x;
          if (!(w1 > w0) || !step) return;
          const s = w0 / (w1 - w0);
          if (s > 1.5) return;
          const tip = {
            x: Math.max(W.x0, Math.min(W.x1, t0.x + s * step)),
            y: t0.y + s * (t0.y - t1.y),
          };
          if (atEnd) T.push(tip);
          else T.unshift(tip);
        };
        const polys = [];
        const close = (a) => {
          extendTip(a, false);
          extendTip(a, true);
          polys.push(a.tops.concat(a.bots.slice().reverse()));
        };
        let active = [],
          prevX = null;
        for (let i = 0; i <= n; i++) {
          const x = i === n ? W.x1 : W.x0 + i * dx;
          const runs = runsAt(x);
          // Follow a region that has narrowed below the row spacing.
          active.forEach((a) => {
            const y0 = mid(a.last);
            if (!runs.some((r) => overlaps(a.last, r)) && R(x, y0)) runs.push(runAround(x, y0));
          });
          runs.sort((p, q) => p[0] - q[0]);
          const used = runs.map(() => false),
            next = [];
          active.forEach((a) => {
            const hits = runs.map((r, k) => (overlaps(a.last, r) ? k : -1)).filter((k) => k >= 0);
            const k = hits.length === 1 ? hits[0] : -1;
            if (k >= 0 && active.filter((b) => overlaps(b.last, runs[k])).length === 1) {
              a.tops.push({ x: x, y: runs[k][1] });
              a.bots.push({ x: x, y: runs[k][0] });
              a.last = runs[k];
              used[k] = true;
              next.push(a);
              return;
            }
            if (!hits.length) {
              const y0 = mid(a.last);
              edgeAt(a, bisect((t) => R(t, y0), prevX, x), y0);
            }
            close(a);
          });
          runs.forEach((r, k) => {
            if (used[k]) return;
            const a = { tops: [], bots: [], last: r };
            const y0 = mid(r);
            if (prevX !== null && !R(prevX, y0)) edgeAt(a, bisect((t) => R(t, y0), x, prevX), y0);
            a.tops.push({ x: x, y: r[1] });
            a.bots.push({ x: x, y: r[0] });
            next.push(a);
          });
          active = next;
          prevX = x;
        }
        active.forEach(close);
        return polys.filter((p) => p.length >= 3);
      }

      // Sutherland–Hodgman clip of a polygon to the window.
      function importClipPolygon(pts, W) {
        const cutX = (xv) => (p, q) => ({ x: xv, y: p.y + ((xv - p.x) * (q.y - p.y)) / (q.x - p.x) });
        const cutY = (yv) => (p, q) => ({ x: p.x + ((yv - p.y) * (q.x - p.x)) / (q.y - p.y), y: yv });
        const sides = [
          [(p) => p.x >= W.x0, cutX(W.x0)],
          [(p) => p.x <= W.x1, cutX(W.x1)],
          [(p) => p.y >= W.y0, cutY(W.y0)],
          [(p) => p.y <= W.y1, cutY(W.y1)],
        ];
        let out = pts.filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));
        for (const [inside, cut] of sides) {
          const src = out;
          out = [];
          src.forEach((cur, k) => {
            const prev = src[(k + src.length - 1) % src.length];
            if (inside(cur)) {
              if (!inside(prev)) out.push(cut(prev, cur));
              out.push(cur);
            } else if (inside(prev)) out.push(cut(prev, cur));
          });
        }
        return out.length >= 3 ? [out] : [];
      }

      // Every drawable item as polylines in source units, clipped to window W.
      // Shaded items (region, polygon) come back as closed outlines instead.
      function importSample(item, W, coarse) {
        if (item.kind === "region") return importRegionPolys(item.R, W, coarse ? 48 : 240);
        if (item.kind === "polygon") return importClipPolygon(item.pts, W);
        let paths = [];
        const span = Math.max(W.x1 - W.x0, W.y1 - W.y0);
        if (item.kind === "fx") {
          paths = importSampleExplicit(item.f, W.x0, W.x1, W.y0, W.y1).map((pc) =>
            pc.map((q) => ({ x: q.u, y: q.v })),
          );
        } else if (item.kind === "fy") {
          paths = importSampleExplicit(item.f, W.y0, W.y1, W.x0, W.x1).map((pc) =>
            pc.map((q) => ({ x: q.v, y: q.u })),
          );
        } else if (item.kind === "implicit") {
          paths = importContour(item.F, W);
        } else if (item.kind === "param") {
          const N = 1500,
            a = Number.isFinite(item.tmin) ? item.tmin : 0,
            b = Number.isFinite(item.tmax) ? item.tmax : 1;
          let cur = [];
          for (let k = 0; k <= N; k++) {
            const [x, y] = item.P(a + ((b - a) * k) / N);
            const last = cur[cur.length - 1];
            if (!Number.isFinite(x) || !Number.isFinite(y) || (last && Math.hypot(x - last.x, y - last.y) > span * 0.5)) {
              if (cur.length > 1) paths.push(cur);
              cur = [];
            }
            if (Number.isFinite(x) && Number.isFinite(y)) cur.push({ x: x, y: y });
          }
          if (cur.length > 1) paths.push(cur);
        } else if (item.kind === "polyline") {
          paths = [item.pts];
        } else if (item.kind === "seg") {
          paths = [[item.a, item.b]];
        } else if (item.kind === "line") {
          const { a, b, c } = item,
            L = span * 10;
          if (Math.abs(b) >= Math.abs(a)) {
            const xa = W.x0 - L,
              xb = W.x1 + L;
            paths = [[{ x: xa, y: -(a * xa + c) / b }, { x: xb, y: -(a * xb + c) / b }]];
          } else if (a) {
            const ya = W.y0 - L,
              yb = W.y1 + L;
            paths = [[{ x: -(b * ya + c) / a, y: ya }, { x: -(b * yb + c) / a, y: yb }]];
          }
        }
        return paths.flatMap((path) => importClip(path, W));
      }

      function importInWindow(q, W) {
        return q.x >= W.x0 - 1e-9 && q.x <= W.x1 + 1e-9 && q.y >= W.y0 - 1e-9 && q.y <= W.y1 + 1e-9;
      }

      function importExtents(items, W) {
        let x1 = -Infinity,
          y1 = -Infinity;
        items.forEach((it) => {
          const pts = it.kind === "point" ? [it].filter((q) => importInWindow(q, W)) : importSample(it, W, true).flat();
          pts.forEach((q) => {
            x1 = Math.max(x1, q.x);
            y1 = Math.max(y1, q.y);
          });
        });
        return x1 > -Infinity ? { x1: x1, y1: y1 } : null;
      }

      // How far right and up the graph's focal features reach inside W: points,
      // shaded areas and the places where two curves cross (e.g. an equilibrium).
      function importFeatureExtent(items, W) {
        let x1 = -Infinity,
          y1 = -Infinity;
        const bump = (q) => {
          if (!importInWindow(q, W)) return;
          x1 = Math.max(x1, q.x);
          y1 = Math.max(y1, q.y);
        };
        const sx = 500 / (W.x1 - W.x0),
          sy = 500 / (W.y1 - W.y0);
        const curves = [];
        items.forEach((it) => {
          if (it.kind === "point") bump(it);
          else if (it.kind === "region" || it.kind === "polygon") importSample(it, W, true).flat().forEach(bump);
          else if (it.kind !== "seg")
            curves.push(importSample(it, W).flatMap((path) => polySegs(importSimplify(path, 1, sx, sy))));
        });
        for (let i = 0; i < curves.length; i++)
          for (let j = i + 1; j < curves.length; j++)
            for (const [a, b] of curves[i])
              for (const [c, d] of curves[j]) {
                const q = lineIntersect(a, b, c, d);
                if (q) bump(q);
              }
        return x1 > -Infinity ? { x1: x1, y1: y1 } : null;
      }

      // Tick increment of 1, 2, 2.5 or 5 × 10^k giving 4–10 intervals, choosing the
      // one whose last tick lands closest past the content.
      function importTicks(lo, hi) {
        const clean = (v) => parseFloat(v.toPrecision(12));
        const mag = Math.pow(10, Math.floor(Math.log10((hi - lo) / 5)));
        let best = null;
        [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10].forEach((m) => {
          const step = m * mag;
          const start = Math.floor(lo / step + 1e-9) * step;
          const n = Math.ceil((hi - start) / step - 1e-9);
          if (n < 4 || n > 10) return;
          const span = n * step;
          if (!best || span < best.span - 1e-9 * span) best = { start: start, step: step, n: n, span: span };
        });
        if (!best) best = { start: lo, step: (hi - lo) / 5, n: 5, span: hi - lo };
        return {
          start: clean(best.start),
          end: clean(best.start + best.span),
          step: clean(best.step),
          n: best.n,
        };
      }

      // The window starts from the positive part of the source's view, then shrinks to
      // the content so the curve fills the canvas and its turns are easy to see.
      function importChooseWindow(viewport, items) {
        const vp = viewport || {};
        const fin = (v, d) => (Number.isFinite(v) ? v : d);
        let W = {
          x0: Math.max(0, fin(vp.xmin, 0)),
          x1: fin(vp.xmax, 10),
          y0: Math.max(0, fin(vp.ymin, 0)),
          y1: fin(vp.ymax, 10),
        };
        if (!(W.x1 > W.x0)) W = { ...W, x0: 0, x1: 10 };
        if (!(W.y1 > W.y0)) W = { ...W, y0: 0, y1: 10 };
        // Without a saved view, fit the window to the content from scratch.
        let ext = viewport ? importExtents(items, W) : null;
        if (!ext) {
          // Nothing in view: try wider windows, preferring the smallest one that holds
          // the content without it running off the top or right edge.
          const bx = Math.max(W.x1, 10),
            by = Math.max(W.y1, 10);
          const cands = [];
          [1, 10, 100, 1000].forEach((kx) =>
            [1, 10, 100, 1000].forEach((ky) => cands.push([kx, ky])),
          );
          cands.sort((a, b) => a[0] * a[1] - b[0] * b[1]);
          let first = null;
          for (const [kx, ky] of cands) {
            const Wc = { x0: 0, y0: 0, x1: bx * kx, y1: by * ky };
            const e = importExtents(items, Wc);
            if (!e) continue;
            if (!first) first = { W: Wc, ext: e };
            if (e.x1 < 0.95 * Wc.x1 && e.y1 < 0.95 * Wc.y1) {
              first = { W: Wc, ext: e };
              break;
            }
          }
          if (first) ({ W, ext } = first);
        }
        if (!ext) throw new Error("Nothing in this graph reaches the positive quadrant (x ≥ 0, y ≥ 0).");
        const shrink = (lo, hi, c) => (c > lo && c - lo < 0.9 * (hi - lo) ? lo + (c - lo) * 1.08 : hi);
        let hx = shrink(W.x0, W.x1, ext.x1),
          hy = shrink(W.y0, W.y1, ext.y1);
        // Keep what the graph is about (its points, shading and crossings) large: curves
        // may run on past them, but the axes stop at twice their extent. A tiny feature
        // near the origin doesn't count, or it would crop everything else away.
        const feat = importFeatureExtent(items, W);
        if (feat) {
          const fx = W.x0 + 2 * (feat.x1 - W.x0),
            fy = W.y0 + 2 * (feat.y1 - W.y0);
          if (fx - W.x0 > 0.3 * (hx - W.x0)) hx = Math.min(hx, fx);
          if (fy - W.y0 > 0.3 * (hy - W.y0)) hy = Math.min(hy, fy);
        }
        const xt = importTicks(W.x0, hx);
        const yt = importTicks(W.y0, hy);
        return { x0: xt.start, x1: xt.end, y0: yt.start, y1: yt.end, xt: xt, yt: yt };
      }

      // Grid squares per axis: a multiple of the tick count, so grid lines meet the ticks.
      function importGridScale(n) {
        let best = n;
        [1, 2, 4, 5].forEach((mult) => {
          const s = n * mult;
          if (s <= 50 && Math.abs(s - 20) < Math.abs(best - 20)) best = s;
        });
        return best;
      }

      // Douglas–Peucker in screen pixels, so saved graphs stay small.
      function importSimplify(path, tolPx = 0.3, sx = GW / state.xScale, sy = GH / state.yScale) {
        if (path.length < 3) return path;
        const keep = new Uint8Array(path.length);
        keep[0] = keep[path.length - 1] = 1;
        const stack = [[0, path.length - 1]];
        while (stack.length) {
          const [i0, i1] = stack.pop();
          const a = path[i0],
            b = path[i1];
          let worst = -1,
            wd = tolPx;
          for (let k = i0 + 1; k < i1; k++) {
            const q = path[k];
            const d = ptSegDist(q.x * sx, q.y * sy, a.x * sx, a.y * sy, b.x * sx, b.y * sy);
            if (d > wd) {
              wd = d;
              worst = k;
            }
          }
          if (worst > 0) {
            keep[worst] = 1;
            stack.push([i0, worst], [worst, i1]);
          }
        }
        return path.filter((q, k) => keep[k]);
      }

      function importApply(parsed) {
        const items = parsed.items.filter((it) => it.kind !== "point" || (Number.isFinite(it.x) && Number.isFinite(it.y)));
        if (!items.length) throw new Error("Nothing drawable was found in this graph.");
        const W = importChooseWindow(parsed.viewport, items);
        clearCanvas();
        state.xScale = importGridScale(W.xt.n);
        state.yScale = importGridScale(W.yt.n);
        state.scaleLock = null;
        state.xTicks = { enabled: true, start: W.xt.start, end: W.xt.end, step: W.xt.step };
        state.yTicks = { enabled: true, start: W.yt.start, end: W.yt.end, step: W.yt.step };
        state.xLabel = parsed.xLabel || "x";
        state.yLabel = parsed.yLabel || "y";
        state.showGrid = parsed.showGrid !== false;
        const toE = (q) => ({
          x: ((q.x - W.x0) / (W.x1 - W.x0)) * state.xScale,
          y: ((q.y - W.y0) / (W.y1 - W.y0)) * state.yScale,
        });
        const sx = GW / state.xScale,
          sy = GH / state.yScale;
        let count = 0;
        const pts = [],
          curves = [],
          shades = [];
        items.forEach((it) => {
          const st = it.style || {};
          if (it.kind === "region" || it.kind === "polygon") {
            const polys = importSample(it, W)
              .map((poly) => importSimplify(poly.map(toE)))
              .filter((poly) => {
                // Drop slivers too small to see.
                const b = plotBounds([poly]);
                return poly.length >= 3 && ((b.x1 - b.x0) * sx > 2 || (b.y1 - b.y0) * sy > 2);
              });
            polys.forEach((poly, k) =>
              shades.push({
                id: uid(),
                type: "shade",
                poly: poly,
                color: st.color || "#2d70b3",
                // Hatch lines are drawn at 2.5× the fill opacity, so a faint GeoGebra
                // fill would make them nearly invisible; use CruxPlot's hatched default.
                opacity: st.hatch
                  ? Math.max(0.4, clampNum(st.fill, 0.05, 0.8, 0.4))
                  : Math.round(clampNum(st.fill, 0.05, 0.8, 0.3) * 100) / 100,
                ...(st.hatch ? { hatch: true, hatchStyle: st.hatch } : {}),
                label: k === 0 ? st.label || "" : "",
              }),
            );
            if (polys.length) count++;
            return;
          }
          if (it.kind === "point") {
            if (!importInWindow(it, W)) return;
            const q = toE(it);
            pts.push({
              id: uid(),
              type: "point",
              ex: q.x,
              ey: q.y,
              color: st.color || "#222",
              size: st.size || 5,
              label: st.label || "",
            });
            count++;
            return;
          }
          const paths = importSample(it, W)
            .map((path) => importSimplify(path.map(toE)))
            .filter((path) => path.length > 1);
          if (!paths.length) return;
          const common = {
            color: st.color || "#2d70b3",
            thickness: st.thickness || 2,
            dotted: !!st.dashed,
            label: st.label || "",
          };
          if (st.name) common.name = st.name;
          count++;
          // Straight lines become ordinary CruxPlot lines so they stay fully editable.
          const only = paths[0];
          const a = only[0],
            b = only[only.length - 1];
          const straight =
            paths.length === 1 &&
            Math.hypot((b.x - a.x) * sx, (b.y - a.y) * sy) > 2 &&
            only.every((q) => ptSegDist(q.x * sx, q.y * sy, a.x * sx, a.y * sy, b.x * sx, b.y * sy) < 0.5);
          if (straight) {
            const p1 = uid(),
              p2 = uid();
            curves.push(
              { id: p1, type: "point", ex: a.x, ey: a.y, color: "#222", size: 5, label: "" },
              { id: p2, type: "point", ex: b.x, ey: b.y, color: "#222", size: 5, label: "" },
              { id: uid(), type: "line", p1Id: p1, p2Id: p2, hideHandles: true, ...common },
            );
          } else {
            curves.push({
              id: uid(),
              type: "plot",
              paths: paths,
              source: it.source || "",
              importedFrom: parsed.source,
              ...common,
            });
          }
        });
        state.elements = shades.concat(curves, pts);
        importLinkSurplus();
        clearSelection();
        render();
        return count;
      }

      // Turns imported surplus shading into CruxPlot's own regions. Each shaded area's
      // outline is compared with the imported curves: consumer surplus lies between a
      // falling curve (demand) and a flat price, producer surplus between the price and
      // a rising curve (supply), deadweight loss between demand and supply. Those curves
      // are named Demand, Supply and Price so Auto Regions can find them, and each area
      // becomes a live CS/PS/DWL region if CruxPlot's own calculation gives the same shape.
      function importLinkSurplus() {
        const tolY = state.yScale * 0.015;
        const curves = state.elements.filter((e) => e.type === "plot" || e.type === "line");
        // "down"/"up" only for curves that fall/rise steadily across their whole range,
        // so a wave or a U-shaped cost curve is never taken for demand or supply.
        const trend = (e) => {
          const xr = elemXRangeEcon(e),
            yr = elemYRangeEcon(e);
          if (!xr || !yr || xr[1] - xr[0] < 1e-9) return null;
          if (yr[1] - yr[0] < tolY * 0.5) return "flat";
          const ys = [];
          for (let i = 0; i <= 24; i++) {
            const y = yAtX(e, xr[0] + (xr[1] - xr[0]) * (0.01 + (0.98 * i) / 24));
            if (y == null) return null;
            ys.push(y);
          }
          const slack = tolY * 0.2;
          if (ys.every((y, i) => !i || y <= ys[i - 1] + slack)) return "down";
          if (ys.every((y, i) => !i || y >= ys[i - 1] - slack)) return "up";
          return null;
        };
        // The longest curves first, so a whole demand curve wins over a short
        // boundary piece of a shaded inequality lying along it.
        const byLength = (a, b) => {
          const ra = elemXRangeEcon(a),
            rb = elemXRangeEcon(b);
          return rb[1] - rb[0] - (ra[1] - ra[0]);
        };
        const downs = curves.filter((c) => trend(c) === "down").sort(byLength),
          ups = curves.filter((c) => trend(c) === "up").sort(byLength);
        // Lowest and highest y of a polygon along the vertical line at x.
        const spanAt = (poly, x) => {
          let lo = Infinity,
            hi = -Infinity;
          poly.forEach((p, k) => {
            const q = poly[(k + 1) % poly.length];
            if ((x - p.x) * (x - q.x) > 0 || p.x === q.x) return;
            const y = p.y + ((q.y - p.y) * (x - p.x)) / (q.x - p.x);
            lo = Math.min(lo, y);
            hi = Math.max(hi, y);
          });
          return hi >= lo ? [lo, hi] : null;
        };
        const found = [];
        state.elements
          .filter((e) => e.type === "shade" && e.poly)
          .forEach((sh) => {
            const b = plotBounds([sh.poly]);
            if (b.x1 - b.x0 < 1e-6) return;
            const xs = Array.from({ length: 16 }, (_, i) => b.x0 + (b.x1 - b.x0) * (0.04 + (0.92 * i) / 15));
            const spans = xs.map((x) => spanAt(sh.poly, x));
            const enough = (n) => n >= xs.length * 0.75;
            // side 0 = lower edge, 1 = upper edge
            const fits = (c, side) => {
              let n = 0,
                err = 0;
              xs.forEach((x, i) => {
                const y = yAtX(c, x);
                if (y == null || !spans[i]) return;
                n++;
                err += Math.abs(y - spans[i][side]);
              });
              return enough(n) && err / n < tolY;
            };
            const level = (side) => {
              const v = spans.filter(Boolean).map((s) => s[side]);
              if (!enough(v.length)) return null;
              const lo = Math.min(...v),
                hi = Math.max(...v);
              return hi - lo < tolY ? (lo + hi) / 2 : null;
            };
            const D = downs.find((c) => fits(c, 1)),
              S = ups.find((c) => fits(c, 0));
            const pBelow = level(0),
              pAbove = level(1);
            if (D && pBelow != null) found.push({ sh: sh, type: "cs", D: D, p: pBelow, Q: b.x1 });
            else if (S && pAbove != null) found.push({ sh: sh, type: "ps", S: S, p: pAbove, Q: b.x1 });
            else if (D && S) found.push({ sh: sh, type: "dwl", D: D, S: S });
          });
        if (!found.length) return;
        let D = (found.find((f) => f.D) || {}).D,
          S = (found.find((f) => f.S) || {}).S;
        if (!S && D) S = ups.find((c) => crossX(D, c) != null);
        if (!D && S) D = downs.find((c) => crossX(c, S) != null);
        const restyle = (f) => {
          const info = REGION_TYPES[f.type];
          f.sh.color = info.color;
          f.sh.label = info.label;
          if (f.sh.hatch) f.sh.hatchStyle = info.hatch;
        };
        // Without a demand curve crossing a supply curve this isn't a market diagram,
        // so the shading stays as it was drawn.
        if (!D || !S || crossX(D, S) == null) return;
        // Names picked up from GeoGebra labels (a segment called "d", say) would confuse
        // Auto Regions, so only the curves identified here keep a market role.
        const roleWords = new Set(Object.values(ROLE_ALIASES).flat());
        // A label that is just the source's object name ("g", "f1") becomes D or S.
        [
          [D, "D"],
          [S, "S"],
        ].forEach(([c, lbl]) => {
          if (c.label && c.label === c.name) c.label = lbl;
        });
        state.elements.forEach((e) => {
          if (e.name && roleWords.has(roleKey(e.name))) delete e.name;
        });
        D.name = "Demand";
        S.name = "Supply";
        const Qe = crossX(D, S),
          Pe = Qe != null ? yAtX(D, Qe) : null;
        const pf = found.find((f) => f.p != null);
        if (pf && (Pe == null || Math.abs(pf.p - Pe) > tolY)) {
          // Surplus measured at a price other than equilibrium (a cartel, a ceiling or a
          // floor) needs a Price line; reuse a flat imported line at that level if any.
          let P = curves.find(
            (c) => c !== D && c !== S && trend(c) === "flat" && Math.abs(elemYRangeEcon(c)[0] - pf.p) < tolY,
          );
          if (!P) {
            const a = uid(),
              b = uid();
            const Qmax = Math.max(...found.filter((f) => f.Q != null).map((f) => f.Q));
            state.elements.push(
              { id: a, type: "point", ex: 0, ey: pf.p, color: "#222", size: 5, label: "" },
              { id: b, type: "point", ex: Qmax, ey: pf.p, color: "#222", size: 5, label: "" },
            );
            P = { id: uid(), type: "line", p1Id: a, p2Id: b, color: "#888888", thickness: 1.5, dotted: true, hideHandles: true, label: "" };
            state.elements.push(P);
          }
          P.name = "Price";
        }
        const area = (poly) =>
          Math.abs(poly.reduce((s, p, k) => s + p.x * poly[(k + 1) % poly.length].y - poly[(k + 1) % poly.length].x * p.y, 0)) / 2;
        const sameShape = (a, b) => {
          const A = area(a),
            B = area(b),
            ba = plotBounds([a]),
            bb = plotBounds([b]);
          const tx = state.xScale * 0.02,
            ty = state.yScale * 0.02;
          return (
            Math.abs(A - B) <= 0.06 * Math.max(A, B) &&
            Math.abs(ba.x0 - bb.x0) < tx &&
            Math.abs(ba.x1 - bb.x1) < tx &&
            Math.abs(ba.y0 - bb.y0) < ty &&
            Math.abs(ba.y1 - bb.y1) < ty
          );
        };
        const linked = new Set();
        found.forEach((f) => {
          const r = linked.has(f.type) ? null : computeRegion(f.type);
          if (!r || !r.poly || !sameShape(r.poly, f.sh.poly)) return restyle(f);
          // A live region: CruxPlot recomputes it from Demand/Supply/Price on every edit.
          const info = REGION_TYPES[f.type];
          delete f.sh.poly;
          delete f.sh.hatchStyle;
          Object.assign(f.sh, {
            region: f.type,
            color: info.color,
            opacity: f.sh.hatch ? 0.4 : 0.3,
            label: info.label,
          });
          linked.add(f.type);
        });
      }

      async function importFromLink(text) {
        const t = text.trim();
        if (!t) throw new Error("Paste a Desmos link first, or upload a file.");
        if (t.startsWith("{")) {
          let json;
          try {
            json = JSON.parse(t);
          } catch (err) {
            throw new Error("That text isn't valid Desmos graph data.");
          }
          return parseDesmosState(json.state || json);
        }
        if (/geogebra\.org/i.test(t))
          throw new Error("GeoGebra links can't be read directly. In GeoGebra, download the graph as a .ggb file and use Upload File.");
        const m = t.match(/desmos\.com\/calculator\/([a-z0-9]+)/i) || t.match(/^([a-z0-9]{8,})$/i);
        if (!m) throw new Error("That doesn't look like a Desmos link (desmos.com/calculator/…).");
        let res;
        try {
          res = await fetch(`https://www.desmos.com/calculator/${m[1]}`, {
            headers: { Accept: "application/json" },
          });
        } catch (err) {
          throw new Error("Couldn't reach Desmos. Check your internet connection and try again.");
        }
        if (res.status === 404)
          throw new Error("That Desmos graph wasn't found. Use Share → copy link in Desmos, then paste it here.");
        if (!res.ok) throw new Error(`Desmos returned an error (${res.status}).`);
        const data = await res.json();
        return parseDesmosState(data.state);
      }

      async function importFromFile(file) {
        const buf = await file.arrayBuffer();
        const u8 = new Uint8Array(buf);
        if (u8[0] === 0x50 && u8[1] === 0x4b) return parseGeoGebraXML(await ggbReadXML(buf));
        const text = new TextDecoder().decode(u8);
        if (/^\s*</.test(text)) return parseGeoGebraXML(text);
        let json;
        try {
          json = JSON.parse(text);
        } catch (err) {
          throw new Error("That file isn't a GeoGebra (.ggb) or Desmos (.json) graph.");
        }
        if (Array.isArray(json.elements) && json.xScale !== undefined)
          throw new Error("That's a CruxPlot save file. Use the Load button to open it.");
        return parseDesmosState(json.state || json);
      }

      let importStatusEl = null;

      function importSetStatus(msg, isErr) {
        if (!importStatusEl) return;
        importStatusEl.textContent = msg;
        importStatusEl.classList.toggle("err", !!isErr);
      }

      function finishImport(parsed) {
        const count = importApply(parsed);
        importStatusEl = null;
        if (!parsed.skipped.length) {
          closePopup();
          return;
        }
        const ul = document.createElement("ul");
        ul.className = "pop-list";
        parsed.skipped.slice(0, 6).forEach((s) => {
          const li = document.createElement("li");
          li.textContent = s;
          ul.appendChild(li);
        });
        if (parsed.skipped.length > 6) {
          const li = document.createElement("li");
          li.textContent = `…and ${parsed.skipped.length - 6} more`;
          ul.appendChild(li);
        }
        showPopup(
          "Graph imported",
          `Imported ${count} item${count === 1 ? "" : "s"} from ${parsed.source}. These couldn't be brought in:`,
          [{ label: "OK", cls: "primary", fn: closePopup }],
          ul,
        );
      }

      async function runImport(load) {
        importSetStatus("Importing…", false);
        try {
          finishImport(await load());
        } catch (err) {
          importSetStatus(err.message || "That graph couldn't be imported.", true);
        }
      }

      async function doExport(transparent) {
        const scale = 2;
        const origBg = state.bgColor;
        const origGrid = state.showGrid;
        if (transparent) {
          state.bgColor = "transparent";
        }
        const origSel = state.selectedId;
        const origSelIds = state.selectedIds;
        clearSelection();
        render();
        const svgStr = await serializeSVGForExport();
        const blob = new Blob([svgStr], {
          type: "image/svg+xml;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = SVG_W * scale;
          canvas.height = SVG_H * scale;
          const ctx = canvas.getContext("2d");
          if (!transparent) {
            ctx.fillStyle = origBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          ctx.scale(scale, scale);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          const link = document.createElement("a");
          link.download = "cruxplot-graph.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          state.bgColor = origBg;
          state.selectedId = origSel;
          state.selectedIds = origSelIds;
          render();
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          state.bgColor = origBg;
          state.selectedId = origSel;
          state.selectedIds = origSelIds;
          render();
          alert('Export failed. Try right-clicking the graph and "Save as image".');
        };
        img.src = url;
      }

      function numFmt(v) {
        return (Math.round(v * 100) / 100).toString();
      }

      function numFmtSig(v, sig = 4) {
        if (Math.abs(v) < 1e-9) return "0";
        return parseFloat(v.toPrecision(sig)).toString();
      }

      function buildConicString(co) {
        const terms = [
          [co.A, "x^2"],
          [co.B, "xy"],
          [co.C, "y^2"],
          [co.D, "x"],
          [co.E, "y"],
        ];
        let out = "";
        terms.forEach(([coef, label]) => {
          if (Math.abs(coef) < 1e-9) return;
          const absC = Math.abs(coef);
          const coefStr = Math.abs(absC - 1) < 1e-6 ? "" : numFmtSig(absC);
          if (out === "") {
            out = (coef < 0 ? "-" : "") + coefStr + label;
          } else {
            out += ` ${coef < 0 ? "-" : "+"} ${coefStr}${label}`;
          }
        });
        if (Math.abs(co.F) > 1e-9 || out === "") {
          const val = numFmtSig(Math.abs(co.F));
          out += out === "" ? (co.F < 0 ? "-" : "") + val : ` ${co.F < 0 ? "-" : "+"} ${val}`;
        }
        return out + " = 0";
      }

      function parseConicSide(s) {
        s = s.replace(/\s+/g, "");
        if (s === "")
          return {
            A: 0,
            B: 0,
            C: 0,
            D: 0,
            E: 0,
            F: 0,
          };
        if (s[0] !== "+" && s[0] !== "-") s = "+" + s;
        const termRe = /([+-])(\d*\.?\d*)(x\^2|y\^2|xy|yx|x|y)?/g;
        const co = {
          A: 0,
          B: 0,
          C: 0,
          D: 0,
          E: 0,
          F: 0,
        };
        let m;
        while ((m = termRe.exec(s)) !== null) {
          if (m[0] === "") {
            termRe.lastIndex++;
            continue;
          }
          const sign = m[1] === "-" ? -1 : 1;
          const coef = (m[2] === "" ? 1 : parseFloat(m[2])) * sign;
          const v = m[3];
          if (!v) co.F += coef;
          else if (v === "x^2") co.A += coef;
          else if (v === "y^2") co.C += coef;
          else if (v === "xy" || v === "yx") co.B += coef;
          else if (v === "x") co.D += coef;
          else if (v === "y") co.E += coef;
        }
        return co;
      }

      function parseConicString(str) {
        const s = str.trim();
        if (!s) return null;
        let lhsStr = s,
          rhsStr = "0";
        if (s.includes("=")) {
          const parts = s.split("=");
          if (parts.length !== 2) return null;
          lhsStr = parts[0];
          rhsStr = parts[1];
        }
        const lhs = parseConicSide(lhsStr),
          rhs = parseConicSide(rhsStr);
        const co = {};
        ["A", "B", "C", "D", "E", "F"].forEach((k) => (co[k] = lhs[k] - rhs[k]));
        const anyNonzero = Object.values(co).some((v) => Math.abs(v) > 1e-12);
        return anyNonzero ? co : null;
      }

      function solveConicForY(co, x, preferNearY) {
        const a = co.C,
          b = co.B * x + co.E,
          c = co.A * x * x + co.D * x + co.F;
        if (Math.abs(a) < 1e-9) {
          if (Math.abs(b) < 1e-9) return null;
          return -c / b;
        }
        const disc = b * b - 4 * a * c;
        if (disc < 0) return null;
        const sq = Math.sqrt(disc);
        const y1 = (-b + sq) / (2 * a),
          y2 = (-b - sq) / (2 * a);
        if (preferNearY === undefined) return y1;
        return Math.abs(y1 - preferNearY) <= Math.abs(y2 - preferNearY) ? y1 : y2;
      }

      function equationFor(elem) {
        if (!elem) return "";
        if (elem.type === "point") {
          return `(${numFmt(elem.ex)}, ${numFmt(elem.ey)})`;
        }
        if (elem.type === "line") {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return "";
          if (Math.abs(b.ex - a.ex) < 1e-9) return `x = ${numFmt(a.ex)}`;
          const m = (b.ey - a.ey) / (b.ex - a.ex);
          const c = a.ey - m * a.ex;
          return `y = ${numFmt(m)}x ${c >= 0 ? "+" : "-"} ${numFmt(Math.abs(c))}`;
        }
        if (elem.type === "curve") {
          const co = curveConicCoeffs(elem);
          if (co) return buildConicString(co);
          if (Math.abs(elem.x2 - elem.x1) < 1e-9) return `x = ${numFmt(elem.x1)}`;
          const m = (elem.y2 - elem.y1) / (elem.x2 - elem.x1);
          const c = elem.y1 - m * elem.x1;
          return `y = ${numFmt(m)}x ${c >= 0 ? "+" : "-"} ${numFmt(Math.abs(c))}`;
        }
        if (elem.type === "tangent") {
          return `t = ${numFmt(elem.t)}`;
        }
        if (elem.type === "plot") return elem.source || "";
        return "";
      }

      function parseEquation(elem, str) {
        str = (str || "").trim();
        if (!elem || !str) return false;
        if (elem.type === "point") {
          const m = str.match(/^\(\s*(-?\d*\.?\d+)\s*,\s*(-?\d*\.?\d+)\s*\)$/);
          if (!m) return false;
          const ep = clampEcon(parseFloat(m[1]), parseFloat(m[2]));
          elem.ex = ep.x;
          elem.ey = ep.y;
          return true;
        }
        if (elem.type === "line") {
          const a = state.elements.find((x) => x.id === elem.p1Id);
          const b = state.elements.find((x) => x.id === elem.p2Id);
          if (!a || !b) return false;
          let m;
          if ((m = str.match(/^x\s*=\s*(-?\d*\.?\d+)$/i))) {
            const c = clampEcon(parseFloat(m[1]), 0).x;
            a.ex = c;
            b.ex = c;
            return true;
          }
          if ((m = str.match(/^y\s*=\s*(-?\d*\.?\d+)$/i))) {
            const c = clampEcon(0, parseFloat(m[1])).y;
            a.ey = c;
            b.ey = c;
            return true;
          }
          m = str.match(/^y\s*=\s*(-?\d*\.?\d*)\s*x\s*([+-]\s*\d*\.?\d+)?$/i);
          if (m) {
            const s = m[1];
            let slope;
            if (s === "" || s === "+") slope = 1;
            else if (s === "-") slope = -1;
            else slope = parseFloat(s);
            const intercept = m[2] !== undefined ? parseFloat(m[2].replace(/\s+/g, "")) : 0;
            const p1 = clampEcon(a.ex, slope * a.ex + intercept);
            const p2 = clampEcon(b.ex, slope * b.ex + intercept);
            a.ey = p1.y;
            b.ey = p2.y;
            return true;
          }
          return false;
        }
        if (elem.type === "curve") {
          const co = parseConicString(str);
          if (!co) return false;
          if (Math.abs(co.A) < 1e-9 && Math.abs(co.B) < 1e-9 && Math.abs(co.C) < 1e-9) {
            if (Math.abs(co.E) < 1e-9) {
              if (Math.abs(co.D) < 1e-9) return false;
              const cx = clampEcon(-co.F / co.D, 0).x;
              elem.x1 = cx;
              elem.x2 = cx;
            } else {
              const newY1 = -(co.D * elem.x1 + co.F) / co.E;
              const newY2 = -(co.D * elem.x2 + co.F) / co.E;
              const p1 = clampEcon(elem.x1, newY1),
                p2 = clampEcon(elem.x2, newY2);
              elem.y1 = p1.y;
              elem.y2 = p2.y;
            }
            delete elem.cpx;
            delete elem.cpy;
            delete elem.lineId;
            delete elem.t;
            delete elem.span;
            delete elem.pointId;
            elem.curvature = 0;
            return true;
          }
          const X0 = elem.x1,
            X2 = elem.x2,
            Xmid = (X0 + X2) / 2;
          const oldCp = econCurveCP(elem);
          const oldMidY = 0.25 * elem.y1 + 0.5 * oldCp.y + 0.25 * elem.y2;
          const Y0 = solveConicForY(co, X0, elem.y1);
          const Y2 = solveConicForY(co, X2, elem.y2);
          const Ymid = solveConicForY(co, Xmid, oldMidY);
          if (Y0 === null || Y2 === null || Ymid === null) return false;
          const P0 = clampEcon(X0, Y0),
            P2c = clampEcon(X2, Y2);
          const Mid = {
            x: Xmid,
            y: Ymid,
          };
          const Pc = {
            x: 2 * Mid.x - 0.5 * P0.x - 0.5 * P2c.x,
            y: 2 * Mid.y - 0.5 * P0.y - 0.5 * P2c.y,
          };
          elem.x1 = P0.x;
          elem.y1 = P0.y;
          elem.x2 = P2c.x;
          elem.y2 = P2c.y;
          elem.cpx = Pc.x;
          elem.cpy = Pc.y;
          delete elem.lineId;
          delete elem.t;
          delete elem.span;
          delete elem.pointId;
          return true;
        }
        if (elem.type === "tangent") {
          const m = str.match(/t\s*=\s*(-?\d*\.?\d+)/i);
          if (!m) return false;
          elem.t = Math.max(0.02, Math.min(0.98, parseFloat(m[1])));
          return true;
        }
        return false;
      }

      function normalizeLatex(str) {
        return String(str)
          .replace(/\\left/g, "")
          .replace(/\\right/g, "")
          .replace(/\\cdot/g, "*")
          .replace(/\\times/g, "*")
          .replace(/\^\{([^{}]*)\}/g, "^$1")
          .replace(/\\,/g, " ")
          .replace(/\\!/g, "")
          .trim();
      }

      function refreshEquationBox() {
        const input = document.getElementById("equation-input");
        if (!input) return;
        const sel = state.elements.find((e) => e.id === state.selectedId);
        if (!sel) return;
        if (document.activeElement !== input) {
          input.value = equationFor(sel);
          input.style.borderColor = "#ccc";
        }
      }

      function renderLeftSidebar() {
        const sb = document.getElementById("left-sidebar");
        sb.innerHTML = "";
        const sel = state.elements.find((e) => e.id === state.selectedId);
        const axisSel =
          state.selectedId === "xaxis" || state.selectedId === "yaxis" ? state.selectedId : null;
        const secEq = sec("Equation");
        if (sel && (sel.type === "text" || sel.type === "shade")) {
          const p = document.createElement("p");
          p.className = "no-sel";
          p.textContent = "No equation for this element.";
          secEq.appendChild(p);
        } else if (sel && sel.type === "plot") {
          // Imported curves keep their original equation for reference; it isn't editable.
          const input = document.createElement("math-field");
          input.id = "equation-input";
          input.className = "eq-input";
          input.setAttribute("math-virtual-keyboard-policy", "manual");
          input.setAttribute("read-only", "");
          input.value = equationFor(sel);
          secEq.appendChild(input);
          const p = document.createElement("p");
          p.className = "hint-text";
          p.textContent = `Imported from ${sel.importedFrom || "another graph"}, in the axis-label units.`;

      function sec(title) {
        const d = document.createElement("div");
        d.className = "sb-section";
        const h = document.createElement("h3");
        h.textContent = title;
        d.appendChild(h);
        return d;
      }

      function ctrlRow(label, control) {
        const d = document.createElement("div");
        d.className = "ctrl-row";
        const l = document.createElement("label");
        l.textContent = label;
        d.appendChild(l);
        if (control) d.appendChild(control);
        return d;
      }

      function inputTxt(val, cb) {
        const i = document.createElement("input");
        i.type = "text";
        i.value = val;
        i.addEventListener("focus", () => pushUndo());
        i.addEventListener("input", (e) => cb(e.target.value));
        return i;
      }

      function inputColor(val, cb) {
        const i = document.createElement("input");
        i.type = "color";
        i.value = val;
        i.addEventListener("focus", () => pushUndo());
        i.addEventListener("input", (e) => cb(e.target.value));
        return i;
      }

      function inputNum(val, min, max, cb, step = 1) {
        const i = document.createElement("input");
        i.type = "number";
        i.value = val;
        i.min = min;
        i.max = max;
        i.step = step;
        i.addEventListener("focus", () => pushUndo());
        i.addEventListener("change", (e) =>
          cb(Math.max(min, Math.min(max, parseFloat(e.target.value) || val))),
        );
        return i;
      }

      function rangeCtrl(val, min, max, step, cb) {
        const wrap = document.createElement("div");
        wrap.className = "range-wrap";
        const r = document.createElement("input");
        r.type = "range";
        r.min = min;
        r.max = max;
        r.step = step;
        r.value = val;
        const lbl = document.createElement("span");
        lbl.className = "range-val";
        lbl.textContent = formatVal(val, step);
        r.addEventListener("pointerdown", () => pushUndo());
        r.addEventListener("input", (e) => {
          const v = parseFloat(e.target.value);
          lbl.textContent = formatVal(v, step);
          cb(v);
        });
        wrap.appendChild(r);
        wrap.appendChild(lbl);
        return wrap;
      }

      function rotateCtrl(elem) {
        const wrap = document.createElement("div");
        wrap.className = "range-wrap";
        const r = document.createElement("input");
        r.type = "range";
        r.min = -45;
        r.max = 45;
        r.step = 1;
        r.value = 0;
        const lbl = document.createElement("span");
        lbl.className = "range-val";
        lbl.textContent = "0°";
        let lastVal = 0;
        r.addEventListener("pointerdown", () => pushUndo());
        r.addEventListener("input", (e) => {
          const v = parseFloat(e.target.value);
          rotateElementBy(elem, v - lastVal);
          lastVal = v;
          lbl.textContent = Math.round(v) + "°";
          renderCanvas();
        });
        r.addEventListener("change", () => {
          r.value = 0;
          lbl.textContent = "0°";
          lastVal = 0;
        });
        wrap.appendChild(r);
        wrap.appendChild(lbl);
        return wrap;
      }

      function formatVal(v, step) {
        return step < 1 ? v.toFixed(2) : Math.round(v).toString();
      }

      // Template kit. Templates are drawn on a 10 x 10 grid and rescaled to the default scale
      // afterwards. `at: [x, y]` puts a label at that econ position instead of the default spot.
      const TPL_COLORS = {
        demand: "#29ae4a",
        supply: "#7800bd",
        red: "#d41243",
        navy: "#1f3a5f",
        brown: "#ac4c0c",
        ink: "#1a1a1a",
        guide: "#8a8a8a",
      };

      function tplSetup(xLabel, yLabel, showGrid = false) {
        clearCanvas();
        state.showGrid = showGrid;
        state.gridColor = "#e0e0e0";
        state.bgColor = "#ffffff";
        state.xScale = 10;
        state.yScale = 10;
        state.xTicks = { enabled: false, start: 0, end: 10, step: 1 };
        state.yTicks = { enabled: false, start: 0, end: 10, step: 1 };
        state.xLabel = xLabel;
        state.yLabel = yLabel;
      }

      function tplLabelAt(elem, anchor, at) {
        if (!at) return;
        const p = econToSVG(at[0], at[1]);
        elem.lox = p.x - anchor.x;
        elem.loy = p.y - anchor.y;
      }

      function tplLine(x1, y1, x2, y2, o = {}) {
        const a = uid(),
          b = uid();
        push({ id: a, type: "point", ex: x1, ey: y1, color: "#222", size: 5, label: "" });
        push({ id: b, type: "point", ex: x2, ey: y2, color: "#222", size: 5, label: "" });
        const line = {
          id: uid(),
          type: "line",
          p1Id: a,
          p2Id: b,
          color: o.color || TPL_COLORS.ink,
          thickness: o.thickness || 2,
          dotted: !!o.dotted,
          hideHandles: true,
          label: o.label || "",
        };
        if (o.name) line.name = o.name;
        const s1 = econToSVG(x1, y1),
          s2 = econToSVG(x2, y2);
        tplLabelAt(line, { x: (s1.x + s2.x) / 2, y: (s1.y + s2.y) / 2 }, o.at);
        push(line);
        return line;
      }

      function tplCurve(props) {
        const { at, ...rest } = props;
        const curve = {
          id: uid(),
          type: "curve",
          hideHandles: true,
          color: TPL_COLORS.ink,
          thickness: 2,
          dotted: false,
          label: "",
          ...rest,
        };
        const mid = qBez(
          econToSVG(curve.x1, curve.y1),
          curveCP(curve),
          econToSVG(curve.x2, curve.y2),
          0.5,
        );
        tplLabelAt(curve, mid, at);
        push(curve);
        return curve;
      }

      // Symmetric U-shaped curve with its minimum at v: y = v.y + k (x - v.x)^2.
      function tplUCurve(v, halfWidth, k, props) {
        const h = k * halfWidth * halfWidth;
        return tplCurve({
          shape: "parabola",
          x1: v.x - halfWidth,
          y1: v.y + h,
          x2: v.x + halfWidth,
          y2: v.y + h,
          cpx: v.x,
          cpy: v.y - h,
          ...props,
        });
      }

      // Where A crosses B (preferring the crossing where A falls below B).
      function tplCross(A, B) {
        const x = crossX(A, B);
        return { x: x, y: yAtX(A, x) };
      }

      function tplDot(x, y, o = {}) {
        const pt = {
          id: uid(),
          type: "point",
          ex: x,
          ey: y,
          color: o.color || TPL_COLORS.ink,
          size: 5,
          label: o.label || "",
        };
        if (o.guides !== false) {
          pt.guides = true;
          pt.guideColor = TPL_COLORS.guide;
        }
        tplLabelAt(pt, econToSVG(x, y), o.at);
        push(pt);
        return pt;
      }

      // Label at the foot of a guide, e.g. P* on the y-axis or Q* on the x-axis.
      function tplAxisMark(axis, v, label) {
        push({
          id: uid(),
          type: "point",
          ex: axis === "x" ? v : 0,
          ey: axis === "x" ? 0 : v,
          color: "transparent",
          size: 0,
          label: label,
          labelColor: TPL_COLORS.ink,
        });
      }

      function tplText(x, y, text, color = TPL_COLORS.ink, fontSize = 14) {
        push({ id: uid(), type: "text", ex: x, ey: y, text, color, fontSize, label: "" });
      }

      // Auto region (see REGION_TYPES); its outline follows the named curves.
      function tplRegion(type, at) {
        const info = REGION_TYPES[type];
        const shade = {
          id: uid(),
          type: "shade",
          region: type,
          color: info.color,
          opacity: 0.3,
          hatch: false,
          label: info.label,
        };
        tplShade(shade, at);
      }

      // Push a shade; `at` moves its label off the default spot (the outline's centroid).
      function tplShade(shade, at) {
        const poly = computeShadePolygonEcon(shade);
        if (at && poly) {
          const pts = poly.map((p) => econToSVG(p.x, p.y));
          const anchor = {
            x: pts.reduce((s, p) => s + p.x, 0) / pts.length,
            y: pts.reduce((s, p) => s + p.y, 0) / pts.length,
          };
          tplLabelAt(shade, anchor, at);
        }
        push(shade);
      }

        const e0 = tplCross(D, S),

        tplDot(e1.x, e1.y);

      function tplPriceControl(level, kind) {
        tplSetup("Quantity", "Price ($)");
        const C = TPL_COLORS;
        const D = tplLine(0, 9, 9, 0, { color: C.demand, name: "Demand", label: "D", at: [8.3, 1.5] });
        const S = tplLine(0, 1, 8.5, 9.5, { color: C.supply, name: "Supply", label: "S", at: [8.8, 9.1] });
        tplLine(0, level, 9.5, level, {
          color: C.red,
          name: kind,
          label: kind,
          at: [7.3, level + 0.25],
        });
        tplRegion("cs");
        tplRegion("ps");
        tplRegion("dwl", [2.7, 4.35]);
        const e0 = tplCross(D, S),
          qd = xAtY(D, level),
          qs = xAtY(S, level);
        tplDot(e0.x, e0.y, { color: C.guide });
        tplDot(qs, level);
        tplDot(qd, level);
        tplAxisMark("y", e0.y, "P*");
        tplAxisMark("x", e0.x, "Q*");
        tplAxisMark("x", qs, "Qˢ");
        tplAxisMark("x", qd, "Qᵈ");
        const gap = kind === "Price ceiling" ? "Shortage" : "Surplus";
        tplText(e0.x + 0.3, level + (kind === "Price ceiling" ? -0.55 : 0.3), gap, C.red, 13);
      }

        const MSC = tplLine(0, 3, 6.5, 9.5, { color: C.red, label: "MSC", at: [6.7, 9.3] });
        const opt = tplCross(D, MSC),
          mkt = tplCross(D, S);
        const optDot = tplDot(opt.x, opt.y, { label: "Social optimum", at: [opt.x - 0.95, opt.y + 1.05] });
        const mktDot = tplDot(mkt.x, mkt.y, { label: "Market", at: [mkt.x + 0.3, mkt.y - 0.45] });
        push({
          id: uid(),
          type: "shade",
          boundA: MSC.id,
          boundB: D.id,
          xClip: [optDot.id, mktDot.id],
          color: REGION_TYPES.dwl.color,
          opacity: 0.35,

          lox: 6,

        tplAxisMark("y", opt.y, "P*");

      function tplLabourMarket() {
        tplSetup("Quantity of labour", "Wage rate ($)");
        const C = TPL_COLORS;
        const D = tplLine(0, 9, 10, 1.5, { color: C.demand, label: "Dₗ", at: [9.3, 2.4] });
        const S = tplLine(0, 2, 7.5, 9.5, { color: C.supply, label: "Sₗ", at: [7.7, 9.4] });
        const wMin = 7.5;
        tplLine(0, wMin, 9.5, wMin, { color: C.red, label: "Minimum wage", at: [6.9, wMin + 0.25] });
        const e = tplCross(D, S),
          ld = xAtY(D, wMin),
          ls = xAtY(S, wMin);
        tplDot(e.x, e.y, { color: C.guide });
        tplDot(ld, wMin);
        tplDot(ls, wMin);
        tplAxisMark("y", e.y, "W*");
        tplAxisMark("x", e.x, "L*");
        tplAxisMark("x", ld, "Lᵈ");
        tplAxisMark("x", ls, "Lˢ");
        tplText(ld + 0.3, wMin + 0.55, "Unemployment", C.red, 13);
      }

      function tplCostCurves() {
        tplSetup("Output (Q)", "Cost ($)");
        const C = TPL_COLORS;
        // MC is drawn first; AVC and ATC are built with their minima on it, so MC cuts
        // both at their lowest points. Equal curvature makes the gap (AFC) shrink with Q.
        const mc = tplCurve({
          x1: 0.9,
          y1: 2.9,
          x2: 7.2,
          y2: 9.8,
          cpx: 2.4,
          cpy: -0.6,
          color: C.red,
          name: "MC",
          label: "MC",
          at: [7.4, 9.4],
        });
        const vA = qBezEcon(mc, 0.43),
          vT = qBezEcon(mc, 0.64);
        tplUCurve(vA, 2.2, 0.16, { color: C.navy, label: "AVC", at: [vA.x + 2.3, vA.y + 0.65] });
        tplUCurve(vT, 3.6, 0.16, {
          color: C.demand,
          name: "ATC",
          label: "ATC",
          at: [vT.x + 3.7, vT.y + 2.1],
        });
        tplDot(vA.x, vA.y, { guides: false, label: "min AVC", at: [vA.x + 0.2, vA.y - 0.55] });
        tplDot(vT.x, vT.y, { guides: false, label: "min ATC", at: [vT.x + 0.25, vT.y - 0.5] });
      }

      function tplCournot() {
        tplSetup("Firm 1 output (q₁)", "Firm 2 output (q₂)");
        const C = TPL_COLORS;
        const R1 = tplLine(0, 9, 4.5, 0, { color: C.navy, label: "R₁ (Firm 1)", at: [0.35, 9.1] });
        const R2 = tplLine(0, 4.5, 9, 0, { color: C.red, label: "R₂ (Firm 2)", at: [7.4, 1.0] });
        const n = tplCross(R1, R2);
        tplDot(n.x, n.y, { label: "Nash equilibrium", at: [n.x + 0.3, n.y + 0.35] });
        tplAxisMark("x", n.x, "q₁*");
        tplAxisMark("y", n.y, "q₂*");
      }

      function tplEdgeworth() {
        tplSetup("Good X (Person A)", "Good Y (Person A)");
        const C = TPL_COLORS;
        // Box of 9 x 9: A's origin is bottom-left, B's is top-right. Each A/B pair is
        // symmetric about the diagonal, so the tangent pair touch on the contract curve.
        tplLine(0, 9, 9, 9, { color: "#46525f", thickness: 1.5 });
        tplLine(9, 0, 9, 9, { color: "#46525f", thickness: 1.5 });
        tplLine(0, 0, 9, 9, {
          color: C.guide,
          dotted: true,
          label: "Contract curve",
          at: [6.9, 6.5],
        });
        const ic = (a, b, c, color, label, at) =>
          tplCurve({ x1: a, y1: b, x2: b, y2: a, cpx: c, cpy: c, color, label, at });
        const A1 = ic(0.8, 8.6, 2.6, C.navy, "A₁", [8.45, 1.2]);
        ic(1.6, 9, 3.1, C.navy, "A₂", [8.75, 2.05]);
        const B1 = ic(0.3, 6.3, 6.2, C.red, "B₁", [6.35, 0.45]);
        ic(0, 5.8, 5.5, C.red, "B₂", [5.4, 0.3]);
        const e = tplCross(A1, B1);
        tplDot(e.x, e.y, { guides: false, label: "E", at: [e.x - 0.45, e.y + 0.35] });
        tplDot(4.2, 4.2, { guides: false, label: "P", at: [4.5, 4.35] });
        tplText(0.6, 0.15, "Person A", C.navy, 13);
        tplText(7.3, 8.55, "Person B", C.red, 13);
        tplText(0.2, 9.35, "E = endowment  ·  P = Pareto-efficient allocation", C.ink, 12);
      }

      function tplADAS() {
        tplSetup("Real GDP", "Price level");
        const C = TPL_COLORS;
        const AD = tplLine(0.5, 9, 9, 0.5, { color: C.demand, label: "AD", at: [8.6, 1.3] });
        const AS = tplLine(0.5, 0.5, 9, 9, { color: C.supply, label: "SRAS", at: [8.2, 9.2] });
        const e = tplCross(AD, AS);
        tplLine(e.x, 0, e.x, 9.5, { color: C.red, label: "LRAS", at: [e.x + 0.2, 9.2] });
        tplDot(e.x, e.y, { label: "E", at: [e.x + 0.45, e.y - 0.1] });
        tplAxisMark("y", e.y, "P*");
        tplAxisMark("x", e.x, "Y*");
      }

      function tplISLM() {
        tplSetup("Output (Y)", "Interest rate (r)");
        const C = TPL_COLORS;
        const IS = tplLine(0.8, 9, 9, 1.5, { color: C.navy, label: "IS", at: [9.1, 1.7] });
        const LM = tplLine(0.8, 1.5, 9, 9, { color: C.red, label: "LM", at: [9.1, 8.8] });
        const e = tplCross(IS, LM);
        tplDot(e.x, e.y, { label: "E", at: [e.x + 0.45, e.y - 0.1] });
        tplAxisMark("y", e.y, "r*");
        tplAxisMark("x", e.x, "Y*");
      }

      function tplKeynesianCross() {
        tplSetup("Real GDP / income (Y)", "Planned expenditure (AE)");
        const C = TPL_COLORS;
        const diag = tplLine(0, 0, 9.5, 9.5, { color: C.ink, label: "AE = Y", at: [8.4, 9.4] });
        const AE = tplLine(0, 2.5, 9.5, 8.2, { color: C.demand, label: "AE = C + I + G", at: [7.4, 6.55] });
        const e = tplCross(AE, diag);
        tplDot(e.x, e.y, { label: "E", at: [e.x - 0.45, e.y + 0.3] });
        tplAxisMark("x", e.x, "Y*");
        tplText(0.9, 0.35, "45°", C.ink, 12);
      }

      function tplPhillips() {
        tplSetup("Unemployment rate (%)", "Inflation rate (%)");
        const C = TPL_COLORS;
        const sr0 = tplCurve({
          shape: "convex",
          x1: 0.8,
          y1: 7.5,
          x2: 9,
          y2: 0.8,
          curvature: 0.75,
          color: C.navy,
          label: "SRPC₁",
          at: [9.1, 1.0],
        });
        const sr1 = tplCurve({
          shape: "convex",
          x1: 0.8,
          y1: 9.5,
          x2: 9,
          y2: 2.8,
          curvature: 0.75,
          color: C.navy,
          dotted: true,
          label: "SRPC₂",
          at: [9.1, 3.0],
        });
        const un = 4.5;
        tplLine(un, 0, un, 9.5, { color: C.red, label: "LRPC", at: [un + 0.2, 9.4] });
        const y0 = yAtX(sr0, un),
          y1 = yAtX(sr1, un);
        tplDot(un, y0, { label: "A", at: [un + 0.25, y0 + 0.3] });
        tplDot(un, y1, { label: "B", at: [un + 0.25, y1 + 0.3] });
        tplAxisMark("x", un, "uₙ");
        tplAxisMark("y", y0, "π₁");
        tplAxisMark("y", y1, "π₂");
      }

      function tplLorenz() {
        tplSetup("Cumulative % of population", "Cumulative % of income");
        const C = TPL_COLORS;
        const eq = tplLine(0, 0, 9, 9, { color: C.ink, label: "Line of equality", at: [3.3, 3.55] });
        eq.labelRotation = -45;
        tplLine(9, 0, 9, 9, { color: C.guide, thickness: 1.2, dotted: true });
        const lz = tplCurve({
          shape: "increasing-convex",
          x1: 0,
          y1: 0,
          x2: 9,
          y2: 9,
          curvature: 0.8,
          color: C.red,
          label: "Lorenz curve",
          at: [6.7, 2.2],
        });
        tplShade({ id: uid(), type: "shade", boundA: eq.id, boundB: lz.id, color: "#3b82f6", opacity: 0.25, label: "A" });
        tplShade(
          { id: uid(), type: "shade", boundA: lz.id, boundB: "xaxis", color: "#22a35a", opacity: 0.2, label: "B" },
          [5.6, 1.0],
        );
        tplAxisMark("x", 9, "100%");
        tplAxisMark("y", 9, "100%");
        tplText(0.5, 8.3, "Gini = A ÷ (A + B)", C.ink, 14);
      }

      function push(o) {
        state.elements.push(o);
      }

      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "MATH-FIELD") return;
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key.toLowerCase() === "a") {
          e.preventDefault();
          setMode("select");
          selectAll();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "z") {
          e.preventDefault();
          if (e.shiftKey) redo();
          else undo();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "y") {
          e.preventDefault();
          redo();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "c") {
          e.preventDefault();
          copySelected();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "v") {
          e.preventDefault();
          pasteClipboard();
          return;
        }
        if (ctrl && e.key.toLowerCase() === "d") {
          e.preventDefault();
          duplicateSelected();
          return;
        }
        if (
          ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key) &&
          state.selectedIds.size > 0
        ) {
          e.preventDefault();
          const step = Math.max(state.xScale, state.yScale) * 0.01 * (e.shiftKey ? 5 : 1);
          const dx = e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0;
          const dy = e.key === "ArrowUp" ? step : e.key === "ArrowDown" ? -step : 0;
          nudgeSelected(dx, dy, !e.repeat);
          return;
        }
        if (e.key === "Escape") {
          setMode("select");
          closePopup();
        }
        if ((e.key === "Delete" || e.key === "Backspace") && state.selectedIds.size > 0) {
          e.preventDefault();
          deleteSelected();
        }
        if (e.key === "p") setMode("point");
        if (e.key === "l") handleLineBtn();
        if (e.key === "c") handleCurveBtn();
        if (e.key === "s") setMode("select");
      });

      buildRightSidebar();

      render();
    </script>
  </body>
</html>
