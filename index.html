      // ---------- Import from Desmos / GeoGebra ----------
      // A graph is read into "items" in the source's own units (curves as functions,
      // points, segments), sampled over the positive quadrant of the source's view,
      // and placed on the canvas with tick labels that carry the original units.

      function nthRoot(x, n) {
        if (x < 0 && Math.abs(n % 2) === 1) return -Math.pow(-x, 1 / n);
        return Math.pow(x, 1 / n);
      }

      const IMPORT_BUILTINS = {
        sin: Math.sin,
        cos: Math.cos,
        tan: Math.tan,
        sec: (x) => 1 / Math.cos(x),
        csc: (x) => 1 / Math.sin(x),
        cosec: (x) => 1 / Math.sin(x),
        cot: (x) => 1 / Math.tan(x),
        arcsin: Math.asin,
        arccos: Math.acos,
        arctan: (y, x) => (x === undefined ? Math.atan(y) : Math.atan2(y, x)),
        asin: Math.asin,
        acos: Math.acos,
        atan: Math.atan,
        atan2: Math.atan2,
        sinh: Math.sinh,
        cosh: Math.cosh,
        tanh: Math.tanh,
        arcsinh: Math.asinh,
        arccosh: Math.acosh,
        arctanh: Math.atanh,
        asinh: Math.asinh,
        acosh: Math.acosh,
        atanh: Math.atanh,
        sqrt: Math.sqrt,
        cbrt: Math.cbrt,
        root: (n, x) => nthRoot(x, n),
        nroot: (x, n) => nthRoot(x, n),
        exp: Math.exp,
        ln: Math.log,
        lg: Math.log10,
        ld: Math.log2,
        abs: Math.abs,
        sign: Math.sign,
        sgn: Math.sign,
        floor: Math.floor,
        ceil: Math.ceil,
        round: Math.round,
        min: Math.min,
        max: Math.max,
        mod: (a, b) => ((a % b) + b) % b,
        factorial: (n) => {
          if (!(n >= 0) || n !== Math.floor(n) || n > 170) return NaN;
          let r = 1;
          for (let i = 2; i <= n; i++) r *= i;
          return r;
        },
      };

      const IMPORT_CONSTS = { pi: Math.PI, e: Math.E, tau: 2 * Math.PI };

      const IMPORT_REL = new Set(["<", ">", "<=", ">=", "=", "==", "!="]);

      const LATEX_FN_CMDS = new Set([
        "sin", "cos", "tan", "sec", "csc", "cot", "arcsin", "arccos", "arctan",
        "sinh", "cosh", "tanh", "ln", "log", "exp", "min", "max", "lg",
      ]);

      const LATEX_GREEK = new Set([
        "alpha", "beta", "gamma", "delta", "epsilon", "varepsilon", "zeta", "eta", "theta",
        "iota", "kappa", "lambda", "mu", "nu", "xi", "rho", "sigma", "upsilon", "phi",
        "varphi", "chi", "psi", "omega", "Gamma", "Delta", "Theta", "Lambda", "Xi", "Pi",
        "Sigma", "Phi", "Psi", "Omega",
      ]);

      // Desmos stores expressions as LaTeX. Letters are single-character names
      // (so "xy" is x·y), optionally subscripted: "p_{1}" becomes the name "p_1".
      function tokenizeLatex(src) {
        const s = String(src),
          toks = [],
          closers = [];
        let i = 0,
          nextGroup = null;
        const op = (v) => toks.push({ k: "op", v: v });
        const readGroup = () => {
          while (s[i] === " ") i++;
          if (s[i] !== "{") return s[i++] || "";
          let depth = 0;
          const start = i + 1;
          for (; i < s.length; i++) {
            if (s[i] === "{") depth++;
            else if (s[i] === "}" && --depth === 0) {
              i++;
              return s.slice(start, i - 1);
            }
          }
          throw new Error("Unbalanced braces");
        };
        const readSub = () => {
          if (s[i] !== "_") return "";
          i++;
          return "_" + readGroup().replace(/[^A-Za-z0-9]/g, "");
        };
        while (i < s.length) {
          const c = s[i];
          if (/\s/.test(c)) {
            i++;
            continue;
          }
          const group = nextGroup;
          nextGroup = null;
          const num = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i, i + 40));
          if (num) {
            toks.push({ k: "num", v: parseFloat(num[1]) });
            i += num[1].length;
            continue;
          }
          if (/[A-Za-z]/.test(c)) {
            i++;
            toks.push({ k: "id", v: c + readSub() });
            continue;
          }
          if (c === "{") {
            i++;
            if (group === "frac1") closers.push({ close: "}", emit: [")", "/", "("], then: "frac2" });
            else if (group === "frac2" || group === "rootn") closers.push({ close: "}", emit: [")", ")"] });
            else {
              op("(");
              closers.push({ close: "}", emit: [")"] });
            }
            continue;
          }
          if (c === "}" || (c === "]" && closers.length && closers[closers.length - 1].close === "]")) {
            i++;
            const cl = closers.pop();
            if (!cl) throw new Error("Unbalanced braces");
            cl.emit.forEach(op);
            if (cl.then) nextGroup = cl.then;
            continue;
          }
          if (c === "\\") {
            const m = /^\\([A-Za-z]+|.)/.exec(s.slice(i, i + 30));
            const cmd = m ? m[1] : "";
            i += m ? m[0].length : 1;
            if (cmd === "left" || cmd === "right") {
              let d = s[i];
              if (d === "\\") {
                d = s.slice(i, i + 2);
                i += 2;
              } else i++;
              if (d === "|") {
                if (cmd === "left") toks.push({ k: "fn", v: "abs" });
                op(cmd === "left" ? "(" : ")");
              } else if (d === "\\{" || d === "\\}") op(d[1]);
              else if (d !== ".") op(d);
            } else if (cmd === "frac" || cmd === "dfrac" || cmd === "tfrac") {
              op("(");
              op("(");
              nextGroup = "frac1";
            } else if (cmd === "sqrt") {
              if (s[i] === "[") {
                i++;
                toks.push({ k: "fn", v: "root" });
                op("(");
                closers.push({ close: "]", emit: [",", "("], then: "rootn" });
              } else toks.push({ k: "fn", v: "sqrt" });
            } else if (cmd === "operatorname" || cmd === "mathrm" || cmd === "text") {
              const name = readGroup().trim();
              const isFn = IMPORT_BUILTINS[name] || name === "log" || name === "polygon";
              toks.push({ k: isFn ? "fn" : "id", v: name });
            } else if (LATEX_FN_CMDS.has(cmd)) {
              const t = { k: "fn", v: cmd };
              if (cmd === "log" && s[i] === "_") {
                i++;
                t.base = parseFloat(readGroup());
              }
              toks.push(t);
            } else if (cmd === "cdot" || cmd === "times" || cmd === "ast") op("*");
            else if (cmd === "div") op("/");
            else if (cmd === "pi") toks.push({ k: "id", v: "pi" });
            else if (cmd === "tau") toks.push({ k: "id", v: "tau" });
            else if (cmd === "infty") toks.push({ k: "num", v: Infinity });
            else if (cmd === "le" || cmd === "leq") op("<=");
            else if (cmd === "ge" || cmd === "geq") op(">=");
            else if (cmd === "lt") op("<");
            else if (cmd === "gt") op(">");
            else if (cmd === "ne" || cmd === "neq") op("!=");
            else if (cmd === "{" || cmd === "}") op(cmd);
            else if (LATEX_GREEK.has(cmd)) toks.push({ k: "id", v: cmd + readSub() });
            else if (!/^([ ,;:!]|quad|qquad|space)$/.test(cmd)) throw new Error(`"\\${cmd}" isn't supported`);
            continue;
          }
          if (c === "<" || c === ">") {
            if (s[i + 1] === "=") {
              op(c + "=");
              i += 2;
            } else {
              op(c);
              i++;
            }
            continue;
          }
          if ("+-*/^(),:=|![]".includes(c)) {
            op(c);
            i++;
            continue;
          }
          throw new Error(`"${c}" isn't supported`);
        }
        return toks;
      }

      const SUPERSCRIPT_DIGITS = {
        "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4",
        "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9", "⁻": "-",
      };

      // GeoGebra stores plain text such as "f(x) = 3x² + a x", with multi-letter names.
      function tokenizePlain(src) {
        const s = String(src),
          toks = [];
        let i = 0;
        const op = (v) => toks.push({ k: "op", v: v });
        while (i < s.length) {
          const c = s[i];
          if (/\s/.test(c)) {
            i++;
            continue;
          }
          const num = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(s.slice(i, i + 40));
          if (num) {
            toks.push({ k: "num", v: parseFloat(num[0]) });
            i += num[0].length;
            continue;
          }
          if (SUPERSCRIPT_DIGITS[c]) {
            let sup = "";
            while (SUPERSCRIPT_DIGITS[s[i]]) sup += SUPERSCRIPT_DIGITS[s[i++]];
            op("^");
            op("(");
            if (sup[0] === "-") {
              op("-");
              sup = sup.slice(1);
            }
            toks.push({ k: "num", v: parseFloat(sup) });
            op(")");
            continue;
          }
          const id = /^[A-Za-zͰ-Ͽ][A-Za-z0-9Ͱ-Ͽ']*(_\{[^}]*\}|_[A-Za-z0-9]+)?/.exec(
            s.slice(i, i + 60),
          );
          if (id && c !== "π") {
            i += id[0].length;
            toks.push({ k: "id", v: id[0].replace(/_\{([^}]*)\}/, "_$1") });
            continue;
          }
          const two = s.slice(i, i + 2);
          if (["<=", ">=", "==", "!=", "&&", "||"].includes(two)) {
            op(two);
            i += 2;
            continue;
          }
          i++;
          if (c === "π") toks.push({ k: "id", v: "pi" });
          else if (c === "ℯ") toks.push({ k: "id", v: "e" });
          else if (c === "∞") toks.push({ k: "num", v: Infinity });
          else if (c === "√") toks.push({ k: "fn", v: "sqrt" });
          else if (c === "∛") toks.push({ k: "fn", v: "cbrt" });
          else if (c === "≤") op("<=");
          else if (c === "≥") op(">=");
          else if (c === "≠") op("!=");
          else if (c === "∧") op("&&");
          else if (c === "∨") op("||");
          else if (c === "·" || c === "×") op("*");
          else if (c === "÷") op("/");
          else if (c === "−") op("-");
          else if (c === "[") op("(");
          else if (c === "]") op(")");
          else if ("+-*/^(),:=<>|!".includes(c)) op(c);
          else throw new Error(`"${c}" isn't supported`);
        }
        return toks;
      }

      function importCtx(dialect) {
        return {
          dialect: dialect,
          vars: new Map(),
          funcs: new Map(),
          values: new Map(),
          evaluating: new Set(),
          broken: new Map(),
        };
      }

      function parseImportTokens(toks, ctx) {
        let p = 0,
          absDepth = 0;
        const peek = () => toks[p];
        const isOp = (t, v) => !!t && t.k === "op" && t.v === v;
        const expect = (v) => {
          if (!isOp(toks[p], v)) throw new Error(`expected "${v}"`);
          p++;
        };
        const startsFactor = (t) =>
          !!t &&
          (t.k !== "op" ||
            t.v === "(" ||
            t.v === "{" ||
            t.v === "[" ||
            (t.v === "|" && absDepth === 0));
        function parseOr() {
          let a = parseAnd();
          while (isOp(peek(), "||")) {
            p++;
            a = { t: "or", a: a, b: parseAnd() };
          }
          return a;
        }
        function parseAnd() {
          let a = parseCmp();
          while (isOp(peek(), "&&")) {
            p++;
            a = { t: "and", a: a, b: parseCmp() };
          }
          return a;
        }
        function parseCmp() {
          const terms = [parseSum()],
            ops = [];
          while (peek() && peek().k === "op" && IMPORT_REL.has(peek().v)) {
            ops.push(toks[p++].v);
            terms.push(parseSum());
          }
          return ops.length ? { t: "cmp", ops: ops, terms: terms } : terms[0];
        }
        function parseSum() {
          let a = parseProduct();
          while (isOp(peek(), "+") || isOp(peek(), "-")) {
            const o = toks[p++].v;
            a = { t: "bin", op: o, a: a, b: parseProduct() };
          }
          return a;
        }
        function parseProduct() {
          let a = parseUnary();
          for (;;) {
            if (isOp(peek(), "*") || isOp(peek(), "/")) {
              const o = toks[p++].v;
              a = { t: "bin", op: o, a: a, b: parseUnary() };
            } else if (startsFactor(peek())) {
              a = { t: "bin", op: "*", a: a, b: parsePower() };
            } else return a;
          }
        }
        function parseUnary() {
          if (isOp(peek(), "-")) {
            p++;
            return { t: "neg", a: parseUnary() };
          }
          if (isOp(peek(), "+")) {
            p++;
            return parseUnary();
          }
          return parsePower();
        }
        function parsePower() {
          const base = parsePostfix();
          if (isOp(peek(), "^")) {
            p++;
            return { t: "bin", op: "^", a: base, b: parseUnary() };
          }
          return base;
        }
        function parsePostfix() {
          let a = parsePrimary();
          while (isOp(peek(), "!")) {
            p++;
            a = { t: "call", fn: "factorial", args: [a] };
          }
          return a;
        }
        function parseArgs() {
          expect("(");
          const args = [];
          if (!isOp(peek(), ")")) {
            args.push(parseOr());
            while (isOp(peek(), ",")) {
              p++;
              args.push(parseOr());
            }
          }
          expect(")");
          return args;
        }
        function parsePrimary() {
          const t = toks[p++];
          if (!t) throw new Error("the expression ends too early");
          if (t.k === "num") return { t: "num", v: t.v };
          if (t.k === "fn") {
            let pw = null;
            if (isOp(peek(), "^")) {
              p++;
              pw = parsePostfix();
            }
            const args = isOp(peek(), "(") ? parseArgs() : [parsePower()];
            const node = { t: "call", fn: t.v, args: args, base: t.base };
            return pw ? { t: "bin", op: "^", a: node, b: pw } : node;
          }
          if (t.k === "id") {
            const name = t.v;
            if (isOp(peek(), "(")) {
              if (ctx.funcs.has(name)) return { t: "call", fn: name, user: true, args: parseArgs() };
              if (ctx.dialect === "ggb") {
                // x(A) and y(A): a point's coordinates, e.g. Integral(f, 0, x(H)).
                const arg = toks[p + 1],
                  shut = toks[p + 2];
                if (
                  (name === "x" || name === "y") &&
                  arg &&
                  arg.k === "id" &&
                  ctx.points &&
                  ctx.points.has(arg.v) &&
                  isOp(shut, ")")
                ) {
                  p += 3;
                  return { t: "num", v: ctx.points.get(arg.v)[name] };
                }
                const low = name.toLowerCase();
                if (low === "if") {
                  const args = parseArgs(),
                    branches = [];
                  for (let k = 0; k + 1 < args.length; k += 2) branches.push({ c: args[k], v: args[k + 1] });
                  return {
                    t: "piece",
                    branches: branches,
                    other: args.length % 2 ? args[args.length - 1] : null,
                  };
                }
                if (IMPORT_BUILTINS[low] || low === "log")
                  return { t: "call", fn: low, args: parseArgs() };
                if (/^[A-Z]/.test(name) && name.length > 1 && !ctx.vars.has(name))
                  throw new Error(`the ${name} command isn't supported`);
              }
            }
            return { t: "var", name: name };
          }
          if (t.v === "(") {
            const items = [parseOr()];
            while (isOp(peek(), ",")) {
              p++;
              items.push(parseOr());
            }
            expect(")");
            return items.length === 1 ? items[0] : { t: "tuple", items: items };
          }
          if (t.v === "{") {
            // Desmos piecewise {cond: value, cond: value, else} or a restriction {cond}.
            const branches = [];
            let other = null;
            if (!isOp(peek(), "}")) {
              for (;;) {
                const c = parseOr();
                if (isOp(peek(), ":")) {
                  p++;
                  branches.push({ c: c, v: parseOr() });
                } else if (c.t === "cmp" || c.t === "and" || c.t === "or") {
                  branches.push({ c: c, v: { t: "num", v: 1 } });
                } else other = c;
                if (!isOp(peek(), ",")) break;
                p++;
              }
            }
            expect("}");
            return { t: "piece", branches: branches, other: other };
          }
          if (t.v === "|") {
            absDepth++;
            const a = parseOr();
            expect("|");
            absDepth--;
            return { t: "call", fn: "abs", args: [a] };
          }
          if (t.v === "[") throw new Error("lists aren't supported");
          throw new Error(`unexpected "${t.v}"`);
        }
        const node = parseOr();
        if (p < toks.length) throw new Error(`unexpected "${toks[p].v}"`);
        return node;
      }

      function importPow(a, b) {
        const r = Math.pow(a, b);
        if (Number.isNaN(r) && a < 0) {
          // Real odd roots, e.g. x^(1/3) for negative x.
          const inv = 1 / b;
          if (Math.abs(inv - Math.round(inv)) < 1e-9 && Math.round(inv) % 2) return -Math.pow(-a, b);
        }
        return r;
      }

      function importCmp(op, a, b) {
        switch (op) {
          case "<":
            return a < b;
          case ">":
            return a > b;
          case "<=":
            return a <= b;
          case ">=":
            return a >= b;
          case "!=":
            return Math.abs(a - b) > 1e-9;
          default:
            return Math.abs(a - b) <= 1e-9;
        }
      }

      function importEval(n, env) {
        switch (n.t) {
          case "num":
            return n.v;
          case "var":
            return importResolve(n.name, env);
          case "neg":
            return -importEval(n.a, env);
          case "bin": {
            const a = importEval(n.a, env),
              b = importEval(n.b, env);
            if (n.op === "+") return a + b;
            if (n.op === "-") return a - b;
            if (n.op === "*") return a * b;
            if (n.op === "/") return a / b;
            return importPow(a, b);
          }
          case "call": {
            if (n.user) {
              const f = env.ctx.funcs.get(n.fn);
              if (!f || !f.body) throw new Error(`${n.fn} couldn't be read`);
              if ((env.depth || 0) > 50) throw new Error(`${n.fn} calls itself too deeply`);
              const locals = {};
              f.params.forEach((pn, k) => (locals[pn] = n.args[k] ? importEval(n.args[k], env) : NaN));
              return importEval(f.body, { ctx: env.ctx, locals: locals, depth: (env.depth || 0) + 1 });
            }
            const args = n.args.map((a) => importEval(a, env));
            if (n.fn === "log") {
              if (n.base) return Math.log(args[0]) / Math.log(n.base);
              if (args.length === 2) return Math.log(args[1]) / Math.log(args[0]);
              return env.ctx.dialect === "ggb" ? Math.log(args[0]) : Math.log10(args[0]);
            }
            const f = IMPORT_BUILTINS[n.fn];
            if (!f) throw new Error(`the function ${n.fn} isn't supported`);
            return f(...args);
          }
          case "cmp": {
            let prev = importEval(n.terms[0], env);
            for (let k = 0; k < n.ops.length; k++) {
              const cur = importEval(n.terms[k + 1], env);
              if (!importCmp(n.ops[k], prev, cur)) return 0;
              prev = cur;
            }
            return 1;
          }
          case "and":
            return importEval(n.a, env) && importEval(n.b, env) ? 1 : 0;
          case "or":
            return importEval(n.a, env) || importEval(n.b, env) ? 1 : 0;
          case "piece":
            for (const br of n.branches) if (importEval(br.c, env)) return importEval(br.v, env);
            return n.other ? importEval(n.other, env) : NaN;
          default:
            throw new Error("a point can't be used as a number here");
        }
      }

      function importResolve(name, env) {
        const ctx = env.ctx;
        if (env.locals && Object.prototype.hasOwnProperty.call(env.locals, name)) return env.locals[name];
        if (ctx.vars.has(name)) {
          if (ctx.values.has(name)) return ctx.values.get(name);
          const def = ctx.vars.get(name);
          if (typeof def === "number") return def;
          if (ctx.evaluating.has(name)) throw new Error(`${name} is defined in terms of itself`);
          ctx.evaluating.add(name);
          try {
            const v = importEval(def, { ctx: ctx, locals: {} });
            ctx.values.set(name, v);
            return v;
          } finally {
            ctx.evaluating.delete(name);
          }
        }
        if (IMPORT_CONSTS[name] !== undefined) return IMPORT_CONSTS[name];
        if (ctx.broken && ctx.broken.has(name)) throw new Error(`it uses ${name}, and ${ctx.broken.get(name)}`);
        // GeoGebra writes a·b·c as "abc" when none of them is a name on its own.
        if (ctx.dialect === "ggb" && name.length > 1 && !/[0-9_']/.test(name)) {
          let prod = 1;
          for (const ch of name) prod *= importResolve(ch, env);
          return prod;
        }
        throw new Error(`${name} isn't defined`);
      }

      function importUses(n, name, ctx) {
        if (!n || typeof n !== "object") return false;
        if (Array.isArray(n)) return n.some((c) => importUses(c, name, ctx));
        if (n.t === "var") {
          if (n.name === name) return true;
          return (
            ctx.dialect === "ggb" &&
            n.name.length > 1 &&
            !ctx.vars.has(n.name) &&
            IMPORT_CONSTS[n.name] === undefined &&
            n.name.includes(name)
          );
        }
        return Object.values(n).some((v) => v && typeof v === "object" && importUses(v, name, ctx));
      }

      // Turns an expression into a plain function of the named variables. It is run once
      // up front so undefined names or unsupported functions are reported, not drawn blank.
      function importCompile(body, ctx, names) {
        const probe = {};
        names.forEach((n) => (probe[n] = 0.7312));
        importEval(body, { ctx: ctx, locals: probe });
        return (...vals) => {
          const locals = {};
          names.forEach((n, k) => (locals[n] = vals[k]));
          try {
            const v = importEval(body, { ctx: ctx, locals: locals });
            return typeof v === "number" ? v : NaN;
          } catch (err) {
            return NaN;
          }
        };
      }

      // Pulls Desmos restrictions such as "…\{y>0\}" off an expression, so
      // y = f(x) {y > 0} is still drawn as a function of x.
      function importSplitRestrictions(n, conds) {
        const isRestriction = (q) =>
          q.t === "piece" && !q.other && q.branches.length && q.branches.every((b) => b.v.t === "num" && b.v.v === 1);
        // An undefined restriction makes the whole expression undefined, so one found
        // anywhere in a product (e.g. "a + bx\{y>0\}") applies to all of it.
        if (n.t === "bin" && n.op === "*") {
          if (isRestriction(n.b)) {
            n.b.branches.forEach((b) => conds.push(b.c));
            return importSplitRestrictions(n.a, conds);
          }
          if (isRestriction(n.a)) {
            n.a.branches.forEach((b) => conds.push(b.c));
            return importSplitRestrictions(n.b, conds);
          }
        }
        if (n.t === "bin")
          return { ...n, a: importSplitRestrictions(n.a, conds), b: importSplitRestrictions(n.b, conds) };
        if (n.t === "neg") return { t: "neg", a: importSplitRestrictions(n.a, conds) };
        return n;
      }

      // The curve L = R, drawn only where every condition in `extra` holds.
      function importCurve(L0, R0, sty, extra, ctx) {
        const uses = (n, v) => importUses(n, v, ctx);
        const isVar = (n, v) => n.t === "var" && n.name === v;
        const condNodes = extra.slice();
        const L = importSplitRestrictions(L0, condNodes),
          R = importSplitRestrictions(R0, condNodes);
        const conds = condNodes.map((c) => importCompile(c, ctx, ["x", "y"]));
        const ok = (x, y) => conds.every((c) => c(x, y));
        const fx = (body) => {
          const f = importCompile(body, ctx, ["x"]);
          return { kind: "fx", f: conds.length ? (x) => (ok(x, f(x)) ? f(x) : NaN) : f, style: sty };
        };
        const fy = (body) => {
          const f = importCompile(body, ctx, ["y"]);
          return { kind: "fy", f: conds.length ? (y) => (ok(f(y), y) ? f(y) : NaN) : f, style: sty };
        };
        if (isVar(L, "y") && !uses(R, "y")) return fx(R);
        if (isVar(R, "y") && !uses(L, "y")) return fx(L);
        if (isVar(L, "x") && !uses(R, "x")) return fy(R);
        if (isVar(R, "x") && !uses(L, "x")) return fy(L);
        const body = { t: "bin", op: "-", a: L, b: R };
        if (!uses(body, "x") && !uses(body, "y")) return null;
        const F = importCompile(body, ctx, ["x", "y"]);
        return { kind: "implicit", F: conds.length ? (x, y) => (ok(x, y) ? F(x, y) : NaN) : F, style: sty };
      }

      // "a < y < b" and "p ∧ q" broken into single comparisons {L, op, R}.
      function importAtoms(n) {
        if (n.t === "and") {
          const a = importAtoms(n.a),
            b = importAtoms(n.b);
          return a && b ? a.concat(b) : null;
        }
        if (n.t !== "cmp" || n.ops.includes("!=")) return null;
        return n.ops.map((op, k) => ({ L: n.terms[k], op: op, R: n.terms[k + 1] }));
      }

      function importPointOf(n, ctx) {
        if (n.t === "var" && ctx.vars.has(n.name) && ctx.vars.get(n.name).t === "tuple")
          return importPointOf(ctx.vars.get(n.name), ctx);
        if (n.t !== "tuple" || n.items.length !== 2) throw new Error("only polygons made of points are supported");
        const env = { ctx: ctx, locals: {} };
        return { x: importEval(n.items[0], env), y: importEval(n.items[1], env) };
      }

      // Returns one item, or a list (a shaded region plus its outline).
      function importClassify(node, style, ctx, opts = {}) {
        const uses = (n, v) => importUses(n, v, ctx);
        if (node.t === "cmp" || node.t === "and") {
          if (uses(node, "r") || uses(node, "theta")) throw new Error("polar graphs aren't supported");
          const atoms = importAtoms(node);
          if (!atoms) return null;
          const isEq = (op) => op === "=" || op === "==";
          if (atoms.length === 1 && isEq(atoms[0].op)) return importCurve(atoms[0].L, atoms[0].R, style, [], ctx);
          if (atoms.some((a) => isEq(a.op))) return null;
          // An inequality: shade where it holds, and draw each boundary where the
          // rest of the inequality holds (dashed when strict, as Desmos/GeoGebra do).
          const out = [];
          if (style.fill > 0) {
            const holds = importCompile(node, ctx, ["x", "y"]);
            out.push({ kind: "region", R: (x, y) => holds(x, y) === 1, style: style });
          }
          if (!style.noBoundary) {
            const loose = { "<": "<=", ">": ">=" };
            atoms.forEach((a, k) => {
              const others = atoms
                .filter((b, j) => j !== k)
                .map((b) => ({ t: "cmp", ops: [loose[b.op] || b.op], terms: [b.L, b.R] }));
              const strict = a.op === "<" || a.op === ">";
              const curve = importCurve(a.L, a.R, strict ? { ...style, dashed: true } : style, others, ctx);
              if (curve) out.push(curve);
            });
          }
          return out;
        }
        if (node.t === "call" && node.fn === "polygon") {
          const pts = node.args.map((a) => importPointOf(a, ctx));
          if (pts.length < 3) return null;
          const out = [];
          if (style.fill > 0) out.push({ kind: "polygon", pts: pts, style: style });
          if (!style.noBoundary) out.push({ kind: "polyline", pts: pts.concat([pts[0]]), style: style });
          return out;
        }
        if (node.t === "tuple") {
          if (node.items.length !== 2) return null;
          if (uses(node, "t")) {
            const X = importCompile(node.items[0], ctx, ["t"]),
              Y = importCompile(node.items[1], ctx, ["t"]);
            return {
              kind: "param",
              P: (t) => [X(t), Y(t)],
              tmin: opts.tmin !== undefined ? opts.tmin : 0,
              tmax: opts.tmax !== undefined ? opts.tmax : 1,
              style: style,
            };
          }
          const env = { ctx: ctx, locals: {} };
          return {
            kind: "point",
            x: importEval(node.items[0], env),
            y: importEval(node.items[1], env),
            style: style,
          };
        }
        if (uses(node, "x") && !uses(node, "y"))
          return { kind: "fx", f: importCompile(node, ctx, ["x"]), style: style };
        return null;
      }

      // Splits "a=3" (a variable) and "f(x)=..." (a function) from graphable expressions.
      function importSplitDef(toks) {
        let depth = 0,
          eqAt = -1,
          rels = 0;
        toks.forEach((t, k) => {
          if (t.k !== "op") return;
          if ("([{".includes(t.v)) depth++;
          else if (")]}".includes(t.v)) depth--;
          else if (depth === 0 && IMPORT_REL.has(t.v)) {
            rels++;
            if (t.v === "=") eqAt = k;
          }
        });
        if (rels !== 1 || eqAt < 0) return null;
        const lhs = toks.slice(0, eqAt),
          rhs = toks.slice(eqAt + 1);
        const reserved = ["x", "y", "r", "theta"];
        if (lhs.length === 1 && lhs[0].k === "id" && !reserved.includes(lhs[0].v))
          return { kind: "var", name: lhs[0].v, rhs: rhs };
        if (
          lhs.length >= 4 &&
          lhs[0].k === "id" &&
          !reserved.includes(lhs[0].v) &&
          lhs[1].k === "op" &&
          lhs[1].v === "(" &&
          lhs[lhs.length - 1].k === "op" &&
          lhs[lhs.length - 1].v === ")"
        ) {
          const inner = lhs.slice(2, -1),
            params = [];
          for (let k = 0; k < inner.length; k++) {
            if (k % 2 === 0 && inner[k].k === "id") params.push(inner[k].v);
            else if (k % 2 === 1 && inner[k].k === "op" && inner[k].v === ",") continue;
            else return null;
          }
          if (params.length) return { kind: "fn", name: lhs[0].v, params: params, rhs: rhs };
        }
        return null;
      }

      function importShort(s) {
        s = String(s).replace(/\\left|\\right|\\operatorname/g, "").replace(/\s+/g, " ");
        return s.length > 48 ? s.slice(0, 45) + "…" : s;
      }

      function clampNum(v, lo, hi, dflt) {
        return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : dflt;
      }

      function parseDesmosState(st) {
        if (!st || !st.expressions || !Array.isArray(st.expressions.list))
          throw new Error("That doesn't look like a Desmos graph.");
        const ctx = importCtx("desmos");
        const list = st.expressions.list;
        const hiddenFolders = new Set(list.filter((e) => e.type === "folder" && e.hidden).map((e) => e.id));
        const isShown = (e) => !e.hidden && !(e.folderId && hiddenFolders.has(e.folderId));
        const styleOf = (e) => {
          const lw = parseFloat(e.lineWidth);
          const ps = parseFloat(e.pointSize);
          const lbl = e.showLabel && typeof e.label === "string" && !/[$`\\]/.test(e.label) ? e.label : "";
          return {
            color: /^#[0-9a-f]{6}$/i.test(e.color || "") ? e.color : "#2d70b3",
            thickness: Math.round(clampNum(lw * 0.8, 0.5, 8, 2) * 2) / 2,
            dashed: e.lineStyle === "DASHED" || e.lineStyle === "DOTTED",
            size: Math.round(clampNum((ps * 5) / 9, 2, 14, 5) * 2) / 2,
            label: lbl,
            // Shading of inequalities and polygons (Desmos defaults to 40%).
            fill: e.fill === false ? 0 : clampNum(parseFloat(e.fillOpacity), 0, 1, 0.4),
            noBoundary: e.lines === false || parseFloat(e.lineOpacity) === 0 || lw === 0,
          };
        };
        const skipped = [],
          entries = [];
        list.forEach((e) => {
          // Older saves leave out "type" on plain expressions.
          if ((e.type || "expression") !== "expression" || !e.latex || !e.latex.trim()) return;
          if (/\\to(?![A-Za-z])/.test(e.latex)) return; // actions (a → b) aren't graphs
          const en = { e: e };
          try {
            en.toks = tokenizeLatex(e.latex);
            en.def = importSplitDef(en.toks);
            if (en.def && en.def.kind === "fn")
              ctx.funcs.set(en.def.name, { params: en.def.params, body: null });
          } catch (err) {
            en.err = err;
          }
          entries.push(en);
        });
        entries.forEach((en) => {
          if (!en.err) {
            try {
              if (en.def) {
                en.def.body = parseImportTokens(en.def.rhs, ctx);
                if (en.def.kind === "var") ctx.vars.set(en.def.name, en.def.body);
                else ctx.funcs.get(en.def.name).body = en.def.body;
              } else en.node = parseImportTokens(en.toks, ctx);
            } catch (err) {
              en.err = err;
            }
          }
          // A definition that can't be read (e.g. an integral) is only reported if
          // something drawn depends on it.
          if (en.err) {
            const m = /^\s*([A-Za-z])(?:_\{?([A-Za-z0-9]+)\}?)?\s*(?:\\left\(|=)/.exec(en.e.latex);
            const name = en.def ? en.def.name : m && m[1] + (m[2] ? "_" + m[2] : "");
            if (name && !["x", "y"].includes(name)) {
              ctx.broken.set(name, en.err.message);
              // Function definitions are graphed by Desmos, so those are still reported.
              en.quiet = en.def ? en.def.kind === "var" : !m[0].endsWith("(");
            }
          }
        });
        const items = [];
        const evalLatex = (latex, locals = {}) => {
          if (latex === undefined || latex === null || String(latex).trim() === "") return NaN;
          try {
            const v = importEval(parseImportTokens(tokenizeLatex(latex), ctx), { ctx: ctx, locals: locals });
            return typeof v === "number" ? v : NaN;
          } catch (err) {
            return NaN;
          }
        };
        entries.forEach((en) => {
          const e = en.e;
          if (!isShown(e)) return;
          const fail = (err) => skipped.push(`${importShort(e.latex)} — ${err.message}`);
          if (en.err) return en.quiet ? undefined : fail(en.err);
          let node = en.node;
          if (en.def) {
            const b = en.def.body;
            if (en.def.kind === "var") {
              // Sliders and constants aren't drawn; named points and polygons are.
              if (b.t !== "tuple" && !(b.t === "call" && b.fn === "polygon")) return;
              node = b;
              if (!e.label) e.label = e.showLabel ? en.def.name : "";
            } else if (en.def.params.length === 1 && en.def.params[0] !== "y") {
              // Desmos graphs one-variable definitions such as p(q) = … against the x-axis.
              try {
                if (importUses(b, "y", ctx)) return;
                items.push({ kind: "fx", f: importCompile(b, ctx, en.def.params), style: styleOf(e), source: e.latex });
              } catch (err) {
                fail(err);
              }
              return;
            } else return;
          }
          const dom = e.parametricDomain || {};
          try {
            const found = importClassify(node, styleOf(e), ctx, {
              tmin: dom.min !== undefined ? evalLatex(dom.min) : undefined,
              tmax: dom.max !== undefined ? evalLatex(dom.max) : undefined,
            });
            [].concat(found || []).forEach((item) => {
              item.source = e.latex;
              items.push(item);
            });
          } catch (err) {
            fail(err);
          }
        });
        list.forEach((e) => {
          if (e.type !== "table" || !isShown(e) || !Array.isArray(e.columns) || e.columns.length < 2) return;
          const [xc, ...ycs] = e.columns;
          let xName = null;
          try {
            const tk = tokenizeLatex(xc.latex || "");
            if (tk.length === 1 && tk[0].k === "id") xName = tk[0].v;
          } catch (err) {}
          const xs = (xc.values || []).map((v) => evalLatex(v));
          ycs.forEach((col) => {
            if (col.hidden) return;
            let ys = (col.values || []).map((v) => evalLatex(v));
            if (!ys.some(Number.isFinite) && col.latex && xName)
              ys = xs.map((x) => evalLatex(col.latex, { [xName]: x }));
            const pts = xs
              .map((x, k) => ({ x: x, y: ys[k] }))
              .filter((q) => Number.isFinite(q.x) && Number.isFinite(q.y));
            if (!pts.length) return;

            const lines = col.lines || col.columnMode === "LINES" || col.columnMode === "POINTS_AND_LINES";
            const dots = col.points !== false && col.columnMode !== "LINES";
            if (dots) pts.forEach((q) => items.push({ kind: "point", x: q.x, y: q.y, style: style }));

        });
        const g = st.graph || {};

          source: "Desmos",
          viewport: g.viewport,
          xLabel: g.xAxisLabel,
          yLabel: g.yAxisLabel,

      // .ggb files are zip archives; the construction lives in geogebra.xml.
      async function ggbReadXML(buf) {

            csize = dv.getUint32(off + 20, true),
            nameLen = dv.getUint16(off + 28, true),
            extraLen = dv.getUint16(off + 30, true),
            commLen = dv.getUint16(off + 32, true),
            local = dv.getUint32(off + 42, true);

          }
          off += 46 + nameLen + extraLen + commLen;
        }

      // GeoGebra fill patterns as CruxPlot hatch styles (null for a plain fill).
      function ggbHatch(oc) {
        const type = parseInt(oc.getAttribute("fillType")) || 0;
        if (type === 4) return "dots";
        if (type === 2 || type === 3 || (type >= 5 && type <= 7)) return "cross";
        if (type !== 1) return null;

        if (a < 67.5) return "diag";
        if (a < 112.5) return "vert";

      function parseGeoGebraXML(text) {
        const doc = new DOMParser().parseFromString(text, "application/xml");
        const cons = doc.querySelector("construction");
        if (!cons) throw new Error("That file doesn't contain a GeoGebra construction.");
        const ctx = importCtx("ggb");
        const child = (node, tag) => [...node.children].find((c) => c.tagName === tag);
        const num = (node, attr) => (node ? parseFloat(node.getAttribute(attr)) : NaN);
        const exprs = new Map(),
          cmds = new Map(),
          els = [];
        const argList = (node) =>
          node
            ? [...node.attributes]
                .filter((a) => /^a\d+$/.test(a.name))
                .sort((a, b) => a.name.slice(1) - b.name.slice(1))
                .map((a) => a.value)

        [...cons.children].forEach((node) => {
          if (node.tagName === "expression") exprs.set(node.getAttribute("label"), node.getAttribute("exp"));
          else if (node.tagName === "command") {
            const cmd = {
              name: node.getAttribute("name"),
              inputs: argList(child(node, "input")),
              outputs: argList(child(node, "output")),
            };
            cmd.outputs.forEach((o, idx) => o && cmds.set(o, { ...cmd, index: idx }));
          } else if (node.tagName === "element") els.push(node);
        });
        const points = new Map();
        ctx.points = points;
        els.forEach((el) => {
          const type = el.getAttribute("type"),
            label = el.getAttribute("label");
          if (type === "numeric" || type === "angle") {
            const v = num(child(el, "value"), "val");
            if (Number.isFinite(v)) ctx.vars.set(label, v);
          } else if (type === "point") {
            const c = child(el, "coords");
            const z = num(c, "z");
            if (c && z) points.set(label, { x: num(c, "x") / z, y: num(c, "y") / z });
          } else if (type === "function") {
            const m = /^\s*[^\s(=]+\s*\(([^)]*)\)\s*=/.exec(exprs.get(label) || "");
            const params = m ? m[1].split(",").map((s) => s.trim()) : ["x"];
            ctx.funcs.set(label, { params: params, body: null });
          }
        });
        const parsePlain = (s) => parseImportTokens(tokenizePlain(s), ctx);
        const rhsOf = (exp) => {
          // "f(x) = x²" or "eq1: x y = 10" → the part the function or curve is made of.
          const s = exp.replace(/^\s*[A-Za-z][\w']*\s*:\s*/, "");
          const m = /^\s*[^\s(=]+\s*\([^)]*\)\s*=(.*)$/.exec(s);
          return m ? m[1] : s;
        };
        els.forEach((el) => {
          if (el.getAttribute("type") !== "function") return;
          const label = el.getAttribute("label");
          const exp = exprs.get(label);
          const f = ctx.funcs.get(label);
          try {
            if (exp) f.body = parsePlain(rhsOf(exp));
            else {
              const cmd = cmds.get(label);
              if (cmd && cmd.name === "Function" && cmd.inputs.length >= 3) {
                const inner = ctx.funcs.has(cmd.inputs[0])
                  ? { t: "call", fn: cmd.inputs[0], user: true, args: [{ t: "var", name: "x" }] }
                  : parsePlain(cmd.inputs[0]);
                const x = { t: "var", name: "x" };
                f.body = {
                  t: "piece",
                  branches: [
                    {
                      c: { t: "cmp", ops: ["<=", "<="], terms: [parsePlain(cmd.inputs[1]), x, parsePlain(cmd.inputs[2])] },
                      v: inner,

        });
        const pointRef = (ref) => {
          if (points.has(ref)) return points.get(ref);
          const n = parsePlain(ref);
          if (n.t !== "tuple") throw new Error(`${ref} isn't a point`);
          const env = { ctx: ctx, locals: {} };
          return { x: importEval(n.items[0], env), y: importEval(n.items[1], env) };
        };
        const rgbHex = (c) =>
          "#" +
          ["r", "g", "b"]
            .map((k) => Math.max(0, Math.min(255, parseInt(c.getAttribute(k)) || 0)).toString(16).padStart(2, "0"))
            .join("");
        const items = [],
          skipped = [];
        const quiet = new Set(["numeric", "angle", "boolean", "text", "image", "button", "textfield", "list"]);
        // A function given by label ("D") or written out ("10 - x").
        const funcRef = (ref) =>
          importCompile(
            ctx.funcs.has(ref) ? { t: "call", fn: ref, user: true, args: [{ t: "var", name: "x" }] } : parsePlain(ref),
            ctx,
            ["x"],
          );
        const numRef = (ref) => importEval(parsePlain(ref), { ctx: ctx, locals: {} });
        els.forEach((el) => {
          const type = el.getAttribute("type"),
            label = el.getAttribute("label");
          const show = child(el, "show");
          const cmd = cmds.get(label);
          // Integral(f, a, b) and IntegralBetween(f, g, a, b) are numbers drawn as shaded areas.
          const isIntegral = type === "numeric" && cmd && /^Integral(Between)?$/.test(cmd.name);
          if (!show || show.getAttribute("object") !== "true" || (quiet.has(type) && !isIntegral)) return;
          const oc = child(el, "objColor"),
            ls = child(el, "lineStyle"),
            cap = child(el, "caption");
          const th = num(ls, "thickness");
          let lbl = "";
          if (show.getAttribute("label") === "true") {
            const cv = cap && cap.getAttribute("val");
            lbl = cv && !cv.includes("%") ? cv : label;
          }
          const style = {
            color: oc ? rgbHex(oc) : "#222222",
            thickness: Math.round(clampNum(th * 0.4, 0.5, 8, 2) * 2) / 2,
            dashed: ls ? (parseInt(ls.getAttribute("type")) || 0) !== 0 : false,
            size: clampNum(num(child(el, "pointSize"), "val"), 2, 14, 5),
            label: lbl,
            name: label,
            fill: oc ? clampNum(parseFloat(oc.getAttribute("alpha")), 0, 1, 0) : 0,
            hatch: oc ? ggbHatch(oc) : null,
            noBoundary: !(th > 0),
          };
          const source = exprs.get(label) || (cmd ? `${cmd.name}(${cmd.inputs.join(", ")})` : label);
          const add = (item) => {
            item.style = item.style || style;
            item.source = source;
            items.push(item);
          };
          try {
            if (isIntegral) {
              const between = cmd.name === "IntegralBetween";
              if (cmd.inputs.length < (between ? 4 : 3)) throw new Error("its bounds couldn't be found");
              const f = funcRef(cmd.inputs[0]),
                g = between ? funcRef(cmd.inputs[1]) : () => 0;
              const a = numRef(cmd.inputs[between ? 2 : 1]),
                b = numRef(cmd.inputs[between ? 3 : 2]);
              const lo = Math.min(a, b),
                hi = Math.max(a, b);
              add({
                kind: "region",
                R: (x, y) => {
                  if (x < lo || x > hi) return false;
                  const u = f(x),
                    v = g(x);
                  return y >= Math.min(u, v) && y <= Math.max(u, v);
                },
                style: { ...style, fill: style.fill || 0.1 },
              });
            } else if (type === "polygon") {
              if (!cmd || cmd.name !== "Polygon") throw new Error("its corners couldn't be found");
              if (style.fill > 0)
                add({ kind: "polygon", pts: cmd.inputs.map(pointRef), style: { ...style, label: "" } });
            } else if (type === "functionnvar") {
              const exp = exprs.get(label);
              if (!exp) throw new Error("no formula found");
              // GeoGebra doesn't label inequality regions on the graph.
              const found = importClassify(parsePlain(rhsOf(exp)), { ...style, label: "" }, ctx);
              if (!found || (Array.isArray(found) && !found.length))
                throw new Error("only inequalities in x and y are supported");
              [].concat(found).forEach(add);
            } else if (type === "point") {
              const q = points.get(label);
              if (q) add({ kind: "point", x: q.x, y: q.y });
            } else if (type === "function") {
              const f = ctx.funcs.get(label);
              if (f.error) throw f.error;
              if (!f.body) throw new Error(cmd ? `the ${cmd.name} command isn't supported` : "no formula found");
              const call = { t: "call", fn: label, user: true, args: [{ t: "var", name: "x" }] };
              add({ kind: "fx", f: importCompile(call, ctx, ["x"]) });
            } else if (type === "line") {
              const c = child(el, "coords");
              add({ kind: "line", a: num(c, "x"), b: num(c, "y"), c: num(c, "z") });
            } else if (type === "segment" || type === "ray") {
              if (!cmd) throw new Error("its end points couldn't be found");
              let A, B;
              if (cmd.name === "Polygon" && cmd.index > 0) {
                const n = cmd.inputs.length;
                A = pointRef(cmd.inputs[cmd.index - 1]);
                B = pointRef(cmd.inputs[cmd.index % n]);
              } else {
                A = pointRef(cmd.inputs[0]);
                B = pointRef(cmd.inputs[1]);
              }
              if (type === "ray") B = { x: A.x + (B.x - A.x) * 1e4, y: A.y + (B.y - A.y) * 1e4 };
              add({ kind: "seg", a: A, b: B });
            } else if (type === "polyline") {
              if (!cmd) throw new Error("its points couldn't be found");
              add({ kind: "polyline", pts: cmd.inputs.map(pointRef) });
            } else if (type === "conic") {
              const m = child(el, "matrix");
              const A = ["A0", "A1", "A2", "A3", "A4", "A5"].map((k) => num(m, k));
              if (A.some((v) => !Number.isFinite(v))) throw new Error("no equation found");
              add({
                kind: "implicit",
                F: (x, y) => A[0] * x * x + A[1] * y * y + A[2] + 2 * A[3] * x * y + 2 * A[4] * x + 2 * A[5] * y,
              });
            } else if (type === "implicitpoly" || type === "implicitcurve") {
              const exp = exprs.get(label);
              if (!exp) throw new Error("no equation found");
              const found = importClassify(parsePlain(exp.replace(/^\s*[A-Za-z][\w']*\s*:\s*/, "")), style, ctx);
              [].concat(found || []).forEach(add);

              const X = importCompile(parsePlain(cmd.inputs[0]), ctx, [tv]),
                Y = importCompile(parsePlain(cmd.inputs[1]), ctx, [tv]);
              const env = { ctx: ctx, locals: {} };
              add({
                kind: "param",
                P: (t) => [X(t), Y(t)],

        let viewport = null,
          xLabel = "",
          yLabel = "",
          showGrid = true;

            cs = child(ev, "coordSystem");

            h = num(size, "height"),
            x0 = num(cs, "xZero"),
            y0 = num(cs, "yZero"),
            sx = num(cs, "scale"),
            sy = num(cs, "yscale") || sx;

          source: "GeoGebra",
          viewport: viewport,
          xLabel: xLabel,
          yLabel: yLabel,
          showGrid: showGrid,
          items: items,
          skipped: skipped,
        };
      }

      // Samples y = f(x) (or x = f(y)) from a to b. Steep stretches are subdivided so
      // curves stay smooth, and jumps that survive subdivision (asymptotes, step
      // functions) break the curve instead of drawing a vertical connector.
      function importSampleExplicit(f, a, b, lo, hi) {
        const H = hi - lo,
          N = 300,
          tol = H * 0.01,
          pieces = [];
        let cur = [],
          budget = 150000;
        const side = (v) => (v > hi ? 1 : v < lo ? -1 : 0);
        const flush = () => {
          if (cur.length > 1) pieces.push(cur);
          cur = [];
        };
        const emit = (u, v) => {
          if (Number.isFinite(v)) cur.push({ u: u, v: v });
          else flush();
        };
        const refine = (u0, v0, u1, v1, depth) => {
          const f0 = Number.isFinite(v0),
            f1 = Number.isFinite(v1);
